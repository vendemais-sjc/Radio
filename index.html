<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>MUTV Player • Full Screen</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* CONTAINER PRINCIPAL - TELA CHEIA */
        .tv-container {
            position: relative;
            width: 100%;
            height: 100%;
            background: #000;
        }

        /* VÍDEO PRINCIPAL (TELA INTEIRA) */
        .video-fullscreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        #mainVideo {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* VÍDEO SECUNDÁRIO (PEQUENO NO CANTO) */
        .video-mini {
            position: absolute;
            bottom: 120px;
            right: 20px;
            width: 320px;
            height: 180px;
            border-radius: 12px;
            overflow: hidden;
            z-index: 10;
            border: 2px solid rgba(255,255,255,0.3);
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .video-mini:hover {
            transform: scale(1.02);
            border-color: #e63946;
        }

        #extraVideo {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .mini-overlay {
            position: absolute;
            bottom: 5px;
            right: 8px;
            background: rgba(0,0,0,0.6);
            padding: 4px 8px;
            border-radius: 20px;
            font-size: 0.6rem;
            color: white;
            font-weight: bold;
        }

        /* ==================== PLAYER DE MÚSICA (INFERIOR) ==================== */
        .music-player {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(15px);
            padding: 15px 30px;
            z-index: 20;
            border-top: 1px solid rgba(255,255,255,0.15);
            transition: all 0.3s ease;
        }

        /* OCULTAR PLAYER AUTOMATICAMENTE */
        .music-player.hide {
            transform: translateY(100%);
        }

        /* INFORMAÇÕES DA MÚSICA */
        .track-info {
            text-align: center;
            margin-bottom: 12px;
        }

        .track-title {
            font-size: 1rem;
            font-weight: bold;
            color: #fff;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
            letter-spacing: 1px;
        }

        .track-artist {
            font-size: 0.75rem;
            color: #ccc;
            margin-top: 4px;
        }

        /* BARRA DE PROGRESSO */
        .progress-area {
            margin-bottom: 12px;
        }

        .progress-time {
            display: flex;
            justify-content: space-between;
            font-size: 0.65rem;
            color: #aaa;
            margin-bottom: 5px;
        }

        .progress-bar-bg {
            height: 3px;
            background: rgba(255,255,255,0.3);
            border-radius: 3px;
            cursor: pointer;
        }

        .progress-fill {
            height: 100%;
            background: #e63946;
            width: 0%;
            border-radius: 3px;
            transition: width 0.1s linear;
        }

        /* BOTÕES DE CONTROLE - TRANSPARENTES */
        .control-buttons {
            display: flex;
            justify-content: center;
            gap: 30px;
        }

        .ctrl-btn {
            background: rgba(255,255,255,0.12);
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
            font-size: 1.4rem;
            width: 55px;
            height: 55px;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.2s ease;
            backdrop-filter: blur(5px);
        }

        .ctrl-btn:hover, .ctrl-btn:focus {
            background: #e63946;
            transform: scale(1.05);
            outline: none;
            border-color: #ffd700;
        }

        .ctrl-btn:active {
            transform: scale(0.95);
        }

        .ctrl-btn.play {
            width: 65px;
            height: 65px;
            font-size: 1.8rem;
            background: #e63946;
            border: none;
            box-shadow: 0 0 15px rgba(230,57,70,0.5);
        }

        .ctrl-btn.play:hover, .ctrl-btn.play:focus {
            background: #ff6b6b;
            transform: scale(1.05);
        }

        /* BOTÃO PARA MOSTAR/OCULTAR CONTROLES */
        .toggle-controls {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.3);
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            z-index: 25;
            font-size: 1rem;
            transition: all 0.2s;
        }

        .toggle-controls:hover, .toggle-controls:focus {
            background: #e63946;
            outline: none;
        }

        /* BOTÃO DE TELA CHEIA */
        .fullscreen-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.3);
            color: white;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            cursor: pointer;
            z-index: 25;
            font-size: 1.2rem;
            transition: all 0.2s;
        }

        .fullscreen-btn:hover, .fullscreen-btn:focus {
            background: #e63946;
            outline: none;
        }

        /* NOTIFICAÇÃO */
        .notification {
            position: fixed;
            bottom: 30%;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(10px);
            color: white;
            padding: 10px 20px;
            border-radius: 40px;
            font-size: 0.85rem;
            z-index: 1000;
            border-left: 3px solid #e63946;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            white-space: nowrap;
        }

        .notification.show {
            opacity: 1;
        }

        /* BOTÃO DO VÍDEO MINI */
        .mini-ad-btn {
            position: absolute;
            bottom: 5px;
            left: 8px;
            background: #e63946;
            border: none;
            border-radius: 20px;
            padding: 4px 12px;
            color: white;
            font-size: 0.6rem;
            font-weight: bold;
            cursor: pointer;
            z-index: 15;
        }

        /* SCROLL DA PLAYLIST */
        .playlist-container {
            position: absolute;
            bottom: 100%;
            left: 20px;
            width: 300px;
            max-height: 300px;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(15px);
            border-radius: 16px;
            padding: 12px;
            margin-bottom: 10px;
            z-index: 20;
            display: none;
            overflow-y: auto;
            border: 1px solid rgba(255,255,255,0.2);
        }

        .playlist-container.open {
            display: block;
        }

        .playlist-title {
            color: #e63946;
            font-size: 0.8rem;
            margin-bottom: 10px;
            text-align: center;
            font-weight: bold;
        }

        .playlist-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px;
            background: rgba(255,255,255,0.08);
            border-radius: 10px;
            margin-bottom: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .playlist-item:hover, .playlist-item:focus {
            background: #e63946;
            outline: none;
        }

        .playlist-item.active {
            background: #e63946;
        }

        .playlist-number {
            width: 28px;
            height: 28px;
            background: rgba(255,255,255,0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            font-weight: bold;
            color: #fff;
        }

        .playlist-info {
            flex: 1;
        }

        .playlist-name {
            font-size: 0.75rem;
            font-weight: bold;
            color: #fff;
        }

        .playlist-artist {
            font-size: 0.6rem;
            color: #aaa;
        }

        /* BOTÃO ABRIR PLAYLIST */
        .playlist-btn {
            position: absolute;
            bottom: 20px;
            right: 80px;
            background: rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.3);
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            z-index: 25;
            font-size: 1rem;
            transition: all 0.2s;
        }

        .playlist-btn:hover, .playlist-btn:focus {
            background: #e63946;
            outline: none;
        }

        /* SCROLL */
        .playlist-container::-webkit-scrollbar {
            width: 4px;
        }

        .playlist-container::-webkit-scrollbar-track {
            background: #1a1a1a;
            border-radius: 2px;
        }

        .playlist-container::-webkit-scrollbar-thumb {
            background: #e63946;
            border-radius: 2px;
        }
    </style>
</head>

            { src: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerEscapes.mp4", nome: "Pizza12", link: "https://pizzariadompepe.pedido.app.br/", texto: "🍕 Peça Agora" },
            { src: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerMeltdowns.mp4", nome: "Oferta", link: "https://wa.me/5512988461978", texto: "🎁 Oferta" }
        ];

        // ==================== DOM Elements ====================
        const musicPlayer = document.getElementById('musicPlayer');
        const playBtn = document.getElementById('playPauseBtn');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const shuffleBtn = document.getElementById('shuffleBtn');
        const progressFill = document.getElementById('progressFill');
        const currentTimeEl = document.getElementById('currentTime');
        const totalTimeEl = document.getElementById('totalTime');
        const trackTitleEl = document.getElementById('trackTitle');
        const trackArtistEl = document.getElementById('trackArtist');
        const progressBar = document.getElementById('progressBar');
        const playlistContainer = document.getElementById('playlistContainer');
        const playlistItems = document.getElementById('playlistItems');
        const playlistBtn = document.getElementById('playlistBtn');
        const toggleControlsBtn = document.getElementById('toggleControlsBtn');
        const musicPlayerBar = document.getElementById('musicPlayerBar');
        const fullscreenBtn = document.getElementById('fullscreenBtn');
        const extraVideo = document.getElementById('extraVideo');
        const miniAdBtn = document.getElementById('miniAdBtn');
        const notification = document.getElementById('notification');
        const notificationText = document.getElementById('notificationText');

        // ==================== Variáveis ====================
        let currentIndex = 0;
        let isPlaying = false;
        let shuffle = false;
        let timerInterval = null;
        let extraVideoIndex = 0;
        let extraVideoInterval = null;
        let controlsVisible = true;
        let controlsTimeout = null;

        // ==================== Funções Auxiliares ====================
        function formatTime(sec) {
            if (isNaN(sec) || !isFinite(sec)) return "0:00";
            const m = Math.floor(sec / 60);
            const s = Math.floor(sec % 60);
            return `${m}:${s < 10 ? '0' : ''}${s}`;
        }

        function showMessage(msg, duration = 2000) {
            notificationText.innerText = msg;
            notification.classList.add('show');
            setTimeout(() => notification.classList.remove('show'), duration);
        }

        function stopTimer() {
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = null;
        }

        function startTimer() {
            stopTimer();
            timerInterval = setInterval(() => {
                if (isPlaying && musicPlayer.duration && !musicPlayer.paused) {
                    const percent = (musicPlayer.currentTime / musicPlayer.duration) * 100;
                    progressFill.style.width = percent + '%';
                    currentTimeEl.textContent = formatTime(musicPlayer.currentTime);
                }
            }, 200);
        }

        // Ocultar controles automaticamente
        function resetControlsTimer() {
            if (controlsTimeout) clearTimeout(controlsTimeout);
            if (controlsVisible) {
                controlsTimeout = setTimeout(() => {
                    musicPlayerBar.classList.add('hide');
                    controlsVisible = false;
                    toggleControlsBtn.innerHTML = '<i class="fas fa-chevron-up"></i>';
                }, 5000);
            }
        }

        function showControls() {
            musicPlayerBar.classList.remove('hide');
            controlsVisible = true;
            toggleControlsBtn.innerHTML = '<i class="fas fa-chevron-down"></i>';
            resetControlsTimer();
        }

        function toggleControls() {
            if (controlsVisible) {
                musicPlayerBar.classList.add('hide');
                controlsVisible = false;
                toggleControlsBtn.innerHTML = '<i class="fas fa-chevron-up"></i>';
                if (controlsTimeout) clearTimeout(controlsTimeout);
            } else {
                musicPlayerBar.classList.remove('hide');
                controlsVisible = true;
                toggleControlsBtn.innerHTML = '<i class="fas fa-chevron-down"></i>';
                resetControlsTimer();
            }
        }

        // ==================== Playlist Render ====================
        function renderPlaylist() {
            let html = '';
            musicas.forEach((music, idx) => {
                const isActive = (idx === currentIndex);
                html += `
                    <div class="playlist-item ${isActive ? 'active' : ''}" data-index="${idx}" tabindex="0">
                        <div class="playlist-number">${(idx+1).toString().padStart(2,'0')}</div>
                        <div class="playlist-info">
                            <div class="playlist-name">${escapeHtml(music.title)}</div>
                            <div class="playlist-artist">${escapeHtml(music.artist)}</div>
                        </div>
                    </div>
                `;
            });
            playlistItems.innerHTML = html;
            
            document.querySelectorAll('.playlist-item').forEach(item => {
                item.addEventListener('click', () => {
                    const index = parseInt(item.dataset.index);
                    selectSong(index);
                    playlistContainer.classList.remove('open');
                });
                item.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' || e.key === ' ') {
                        e.preventDefault();
                        const index = parseInt(item.dataset.index);
                        selectSong(index);
                        playlistContainer.classList.remove('open');
                    }
                });
            });
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // ==================== Player Controls ====================
        function loadTrack(index) {
            if (index >= musicas.length) index = 0;
            if (index < 0) index = musicas.length - 1;
            currentIndex = index;
            const track = musicas[currentIndex];
            musicPlayer.src = track.src;
            trackTitleEl.textContent = track.title;
            trackArtistEl.textContent = track.artist;
            currentTimeEl.textContent = '0:00';
            totalTimeEl.textContent = '0:00';
            progressFill.style.width = '0%';
            renderPlaylist();
            
            musicPlayer.onloadedmetadata = () => {
                totalTimeEl.textContent = formatTime(musicPlayer.duration);
            };
        }

        async function playMusic() {
            try {
                await musicPlayer.play();
                isPlaying = true;
                playBtn.innerHTML = '<i class="fas fa-pause"></i>';
                startTimer();
                renderPlaylist();
                showControls();
            } catch(e) {
                console.log('Erro:', e);
                showMessage('⚠️ Clique no play para iniciar', 2000);
            }
        }

        function pauseMusic() {
            musicPlayer.pause();
            isPlaying = false;
            playBtn.innerHTML = '<i class="fas fa-play"></i>';
            stopTimer();
            renderPlaylist();
        }

        function togglePlayPause() {
            if (isPlaying) {
                pauseMusic();
            } else {
                playMusic();
            }
            showControls();
        }

        function nextTrack() {
            stopTimer();
            let nextIndex;
            if (shuffle) {
                do {
                    nextIndex = Math.floor(Math.random() * musicas.length);
                } while (nextIndex === currentIndex && musicas.length > 1);
            } else {
                nextIndex = (currentIndex + 1) % musicas.length;
            }
            currentIndex = nextIndex;
            loadTrack(currentIndex);
            if (isPlaying) playMusic();
            showMessage(`⏭️ ${musicas[currentIndex].title}`);
            showControls();
        }

        function prevTrack() {
            stopTimer();
            let prevIndex;
            if (shuffle) {
                do {
                    prevIndex = Math.floor(Math.random() * musicas.length);
                } while (prevIndex === currentIndex && musicas.length > 1);
            } else {
                prevIndex = (currentIndex - 1 + musicas.length) % musicas.length;
            }
            currentIndex = prevIndex;
            loadTrack(currentIndex);
            if (isPlaying) playMusic();
            showMessage(`⏮️ ${musicas[currentIndex].title}`);
            showControls();
        }

        function selectSong(index) {
            stopTimer();
            currentIndex = index;
            loadTrack(currentIndex);
            if (isPlaying) playMusic();
            showMessage(`🎵 ${musicas[currentIndex].title}`);
            showControls();
        }

        function toggleShuffleMode() {
            shuffle = !shuffle;
            showMessage(shuffle ? '🔀 Aleatório ATIVADO' : '➡️ Sequencial');
            shuffleBtn.style.background = shuffle ? '#e63946' : '';
            showControls();
        }

        // ==================== Vídeos ====================
        function alternarVideoExtra() {
            extraVideoIndex = (extraVideoIndex + 1) % videosExtra.length;
            const novo = videosExtra[extraVideoIndex];
            if (extraVideo && novo.src) {
                extraVideo.src = novo.src;
                extraVideo.load();
                extraVideo.play().catch(e => console.log);
                miniAdBtn.innerHTML = novo.texto;
                miniAdBtn.onclick = (e) => {
                    e.stopPropagation();
                    if (novo.link) window.open(novo.link, '_blank');
                };
            }
        }

        // ==================== Fullscreen ====================
        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
                showMessage('🖥️ Tela cheia');
            } else {
                document.exitFullscreen();
                showMessage('⬛ Modo janela');
            }
            showControls();
        }

        // ==================== Playlist Toggle ====================
        function togglePlaylist() {
            playlistContainer.classList.toggle('open');
            showControls();
        }

        // Fechar playlist ao clicar fora
        document.addEventListener('click', (e) => {
            if (!playlistContainer.contains(e.target) && e.target !== playlistBtn) {
                playlistContainer.classList.remove('open');
            }
        });

        // ==================== Progress Bar ====================
        progressBar.addEventListener('click', (e) => {
            const rect = progressBar.getBoundingClientRect();
            const percent = (e.clientX - rect.left) / rect.width;
            if (musicPlayer.duration) {
                musicPlayer.currentTime = percent * musicPlayer.duration;
            }
            showControls();
        });

        // ==================== Eventos ====================
        playBtn.addEventListener('click', togglePlayPause);
        prevBtn.addEventListener('click', prevTrack);
        nextBtn.addEventListener('click', nextTrack);
        shuffleBtn.addEventListener('click', toggleShuffleMode);
        toggleControlsBtn.addEventListener('click', toggleControls);
        playlistBtn.addEventListener('click', togglePlaylist);
        fullscreenBtn.addEventListener('click', toggleFullscreen);

        // Mostrar controles ao mover o mouse
        document.addEventListener('mousemove', () => {
            if (!controlsVisible) {
                showControls();
            } else {
                resetControlsTimer();
            }
        });

        // Teclado para TV
        document.addEventListener('keydown', (e) => {
            showControls();
            switch(e.key) {
                case ' ':
                case 'Space':
                    e.preventDefault();
                    togglePlayPause();
                    break;
                case 'ArrowLeft':
                    prevTrack();
                    break;
                case 'ArrowRight':
                    nextTrack();
                    break;
                case 'ArrowUp':
                    toggleControls();
                    break;
                case 'f':
                case 'F':
                    toggleFullscreen();
                    break;
                case 's':
                case 'S':
                    toggleShuffleMode();
                    break;
                case 'p':
                case 'P':
                    togglePlaylist();
                    break;
            }
        });

        // Fim da música
        musicPlayer.onended = () => {
            nextTrack();
        };

        musicPlayer.onerror = () => {
            showMessage('⚠️ Erro ao carregar música, pulando...', 1500);
            setTimeout(() => nextTrack(), 1500);
        };

        // ==================== Inicialização ====================
        function init() {
            loadTrack(0);
            alternarVideoExtra();
            extraVideoInterval = setInterval(alternarVideoExtra, 15000);
            
            setTimeout(() => {
                playMusic();
            }, 500);
            
            resetControlsTimer();
            showMessage('✅ MUTV Player | Setas do teclado', 3000);
        }

        init();
    </script>
</body>
</html>

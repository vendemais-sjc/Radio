<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Clínica Versalis • Sala de Espera</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #000;
            font-family: 'Segoe UI', 'Inter', system-ui, sans-serif;
        }

        .tv-container {
            position: relative;
            width: 100%;
            height: 100%;
            background: #000;
        }

        .video-background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        iframe {
            width: 100%;
            height: 100%;
            pointer-events: none;
            object-fit: cover;
        }

        /* VÍDEO MP4 - mesma camada da saudação */
        .video-mp4 {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 5;
        }

        /* SAUDAÇÃO - sobre o vídeo MP4 */
        .welcome-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(circle at center, rgba(0,25,30,0.9) 0%, rgba(0,0,0,0.95) 100%);
            backdrop-filter: blur(10px);
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 30px 20px;
            transition: opacity 0.5s ease;
        }

        .welcome-overlay.hide {
            opacity: 0;
            visibility: hidden;
        }

        .logo-img {
            width: 100px;
            height: 100px;
            object-fit: contain;
            margin: 0 auto 18px;
            border-radius: 50%;
            background: rgba(78,205,196,0.1);
            padding: 10px;
            border: 2px solid rgba(78,205,196,0.3);
        }

        .clinic-name {
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: 3px;
            background: linear-gradient(135deg, #fff, #4ecdc4);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .clinic-tag {
            font-size: 0.7rem;
            color: #4ecdc4;
            letter-spacing: 2px;
            margin-top: 5px;
        }

        .welcome-card {
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(20px);
            padding: 25px 40px;
            border-radius: 40px;
            border: 1px solid rgba(78,205,196,0.3);
            margin: 20px;
        }

        .welcome-card h2 {
            font-size: 1.8rem;
            color: #fff;
            margin-bottom: 12px;
        }

        .welcome-card h2 i {
            color: #4ecdc4;
            margin-right: 10px;
        }

        .mensagem {
            font-size: 1.1rem;
            color: #eef5f5;
        }

        .badge-row {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin: 15px 0;
            flex-wrap: wrap;
        }

        .badge {
            background: rgba(0,0,0,0.5);
            padding: 5px 16px;
            border-radius: 50px;
            font-size: 0.7rem;
            color: #fff;
            border: 1px solid rgba(78,205,196,0.3);
        }

        .badge i {
            color: #4ecdc4;
            margin-right: 6px;
        }

        .status-line {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(0,0,0,0.45);
            padding: 8px 24px;
            border-radius: 60px;
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            background: #4ecdc4;
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }

        .status-line span {
            font-size: 0.75rem;
            letter-spacing: 2px;
            color: white;
        }

        /* PLAYER DE MÚSICA */
        .music-player {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(12px);
            padding: 8px 20px;
            z-index: 20;
            border-top: 1px solid rgba(78,205,196,0.3);
            transition: transform 0.3s ease;
        }

        .music-player.hide {
            transform: translateY(100%);
        }

        .track-info {
            text-align: center;
            margin-bottom: 4px;
        }

        .track-title {
            font-size: 0.8rem;
            font-weight: 600;
            color: #fff;
        }

        .track-artist {
            font-size: 0.6rem;
            color: #bbb;
        }

        .progress-area {
            margin-bottom: 5px;
        }

        .progress-time {
            display: flex;
            justify-content: space-between;
            font-size: 0.5rem;
            color: #aaa;
        }

        .progress-bar-bg {
            height: 2px;
            background: rgba(255,255,255,0.2);
            border-radius: 2px;
            cursor: pointer;
        }

        .progress-fill {
            height: 100%;
            background: #4ecdc4;
            width: 0%;
            border-radius: 2px;
        }

        .control-buttons {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-top: 5px;
        }

        .ctrl-btn {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
            color: white;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.2s;
        }

        .ctrl-btn:hover {
            background: #4ecdc4;
        }

        .ctrl-btn.play {
            width: 38px;
            height: 38px;
            background: #4ecdc4;
            border: none;
        }

        .toggle-controls, .playlist-btn {
            position: absolute;
            bottom: 12px;
            background: rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.12);
            color: white;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            cursor: pointer;
            z-index: 25;
        }

        .toggle-controls { left: 12px; }
        .playlist-btn { right: 55px; }

        .playlist-container {
            position: absolute;
            bottom: 100%;
            left: 12px;
            width: 230px;
            max-height: 250px;
            background: rgba(0,0,0,0.95);
            backdrop-filter: blur(15px);
            border-radius: 16px;
            padding: 10px;
            margin-bottom: 8px;
            z-index: 20;
            display: none;
            overflow-y: auto;
            border: 1px solid rgba(78,205,196,0.3);
        }

        .playlist-container.open { display: block; }
        .playlist-header { color: #4ecdc4; font-size: 0.65rem; text-align: center; margin-bottom: 8px; }
        .playlist-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 6px;
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
            margin-bottom: 5px;
            cursor: pointer;
            font-size: 0.65rem;
        }
        .playlist-item:hover, .playlist-item.active { background: #4ecdc4; color: #000; }

        .ticker {
            position: absolute;
            bottom: 65px;
            left: 0;
            right: 0;
            background: rgba(0,0,0,0.6);
            padding: 5px 0;
            z-index: 15;
            overflow: hidden;
            white-space: nowrap;
        }

        .ticker-content {
            display: inline-block;
            animation: tickerScroll 20s linear infinite;
            padding-left: 100%;
        }

        .ticker-text {
            display: inline-block;
            font-size: 0.65rem;
            color: #fff;
        }

        .ticker-text i { margin: 0 8px; color: #4ecdc4; }

        .clock {
            position: absolute;
            top: 15px;
            right: 20px;
            background: rgba(0,0,0,0.5);
            padding: 4px 12px;
            border-radius: 20px;
            color: #4ecdc4;
            font-size: 0.75rem;
            z-index: 15;
            font-family: monospace;
        }

        @keyframes tickerScroll {
            0% { transform: translateX(0); }
            100% { transform: translateX(-100%); }
        }

        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(1.2); }
            100% { opacity: 1; transform: scale(1); }
        }

        @media (max-width: 680px) {
            .welcome-card { padding: 18px 25px; }
            .welcome-card h2 { font-size: 1.3rem; }
            .clinic-name { font-size: 1.3rem; }
            .logo-img { width: 70px; height: 70px; }
            .mensagem { font-size: 0.9rem; }
            .ticker { bottom: 60px; }
        }
    </style>
</head>
<body>
<div class="tv-container">
    <!-- VIDEO YOUTUBE FUNDO -->
    <div class="video-background">
        <iframe src="https://www.youtube.com/embed/Us3z8PpExjc?autoplay=1&mute=1&loop=1&playlist=Us3z8PpExjc&controls=0&showinfo=0&rel=0&modestbranding=1" 
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                allowfullscreen>
        </iframe>
    </div>

    <!-- VÍDEO VERSA.MP4 -->
    <video id="versaVideo" class="video-mp4" preload="auto" playsinline></video>

    <!-- SAUDAÇÃO -->
    <div class="welcome-overlay" id="welcomeOverlay">
        <div>
            <img src="ver.png" alt="Logo" class="logo-img" onerror="this.style.display='none'">
            <div class="clinic-name">CLÍNICA VERSALIS</div>
            <div class="clinic-tag">Excelência em Saúde</div>
        </div>
        <div class="welcome-card">
            <h2><i class="fas fa-hand-peace"></i> Bem-vindo(a)!</h2>
            <div class="mensagem">Em breve você será atendido(a) com excelência.</div>
        </div>
        <div class="badge-row">
            <div class="badge"><i class="fas fa-stethoscope"></i> ESPECIALIDADES</div>
            <div class="badge"><i class="fas fa-calendar-check"></i> AGENDAMENTO</div>
            <div class="badge"><i class="fas fa-shield-alt"></i> SEGURANÇA</div>
        </div>
        <div class="status-line">
            <div class="pulse-dot"></div>
            <span>AGUARDE</span>
            <div class="pulse-dot"></div>
        </div>
    </div>

    <div class="ticker">
        <div class="ticker-content">
            <div class="ticker-text">
                <i class="fas fa-heartbeat"></i>
                <span>CLÍNICA VERSALIS - CUIDANDO DA SUA SAÚDE</span>
                <i class="fas fa-circle" style="font-size: 0.2rem;"></i>
                <span>📞 (12) 98846-1978</span>
                <i class="fas fa-circle" style="font-size: 0.2rem;"></i>
                <span>📍 ATENDIMENTO HUMANIZADO</span>
            </div>
        </div>
    </div>

    <div class="clock" id="clock">--:--</div>

    <!-- MUSIC PLAYER -->
    <div class="music-player" id="musicPlayerBar">
        <div class="track-info">
            <div class="track-title" id="trackTitle">Carregando...</div>
            <div class="track-artist" id="trackArtist">Música ambiente</div>
        </div>
        <div class="progress-area">
            <div class="progress-time">
                <span id="currentTime">0:00</span>
                <span id="totalTime">0:00</span>
            </div>
            <div class="progress-bar-bg" id="progressBar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
        </div>
        <div class="control-buttons">
            <button class="ctrl-btn" id="prevBtn"><i class="fas fa-step-backward"></i></button>
            <button class="ctrl-btn play" id="playPauseBtn"><i class="fas fa-play"></i></button>
            <button class="ctrl-btn" id="shuffleBtn"><i class="fas fa-random"></i></button>
            <button class="ctrl-btn" id="nextBtn"><i class="fas fa-step-forward"></i></button>
        </div>
    </div>

    <button class="toggle-controls" id="toggleControlsBtn"><i class="fas fa-chevron-up"></i></button>
    <button class="playlist-btn" id="playlistBtn"><i class="fas fa-list-ul"></i></button>

    <div class="playlist-container" id="playlistContainer">
        <div class="playlist-header"><i class="fas fa-music"></i> PLAYLIST</div>
        <div id="playlistItems"></div>
    </div>
</div>

<script>
    // =============================================
    // SIMPLES E DIRETO:
    // Saudação + Video MP4 JUNTOS por 33 segundos
    // Depois espera 3 minutos
    // Repete eternamente
    // Músicas tocando sempre no fundo
    // =============================================

    // TEMPOS
    const TEMPO_JUNTOS = 33;      // Saudação + vídeo juntos: 33 segundos
    const TEMPO_ESPERA = 180;     // Espera: 3 minutos

    // ELEMENTOS
    const welcomeOverlay = document.getElementById('welcomeOverlay');
    const versaVideo = document.getElementById('versaVideo');
    
    let timeoutAtual = null;
    let videoCarregado = false;

    // ========== FUNÇÕES DO CICLO ==========
    
    function esconderTudo() {
        welcomeOverlay.classList.add('hide');
        if (versaVideo) {
            versaVideo.pause();
        }
    }
    
    function mostrarSaudacaoEVideo() {
        welcomeOverlay.classList.remove('hide');
        if (versaVideo && versaVideo.src) {
            versaVideo.currentTime = 0;
            versaVideo.play().catch(e => console.log("Erro vídeo:", e));
        }
    }
    
    function pararCiclo() {
        if (timeoutAtual) {
            clearTimeout(timeoutAtual);
            timeoutAtual = null;
        }
        esconderTudo();
    }
    
    function iniciarCiclo() {
        if (timeoutAtual) clearTimeout(timeoutAtual);
        
        console.log("🎬 Saudação + Video MP4 juntos por 33 segundos");
        mostrarSaudacaoEVideo();
        
        timeoutAtual = setTimeout(() => {
            console.log("⏹️ Fim dos 33 segundos");
            esconderTudo();
            
            console.log("⏳ Aguardando 3 minutos...");
            timeoutAtual = setTimeout(() => {
                console.log("🔁 Recomeçando ciclo");
                iniciarCiclo();
            }, TEMPO_ESPERA * 1000);
        }, TEMPO_JUNTOS * 1000);
    }
    
    // Carrega o vídeo uma vez
    function carregarVideo() {
        if (!videoCarregado) {
            versaVideo.src = 'versa.mp4';
            versaVideo.load();
            versaVideo.onerror = () => {
                console.log("⚠️ Arquivo versa.mp4 não encontrado");
            };
            versaVideo.oncanplay = () => {
                console.log("✅ Vídeo versa.mp4 carregado");
            };
            videoCarregado = true;
        }
    }
    
    // ========== MÚSICAS ==========
    const musicas = [
        { id: 1, title: "Clair de Lune", artist: "Debussy", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" },
        { id: 2, title: "Gymnopédie No.1", artist: "Erik Satie", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3" },
        { id: 3, title: "River Flows in You", artist: "Yiruma", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3" },
        { id: 4, title: "Nuvens", artist: "Piano & Soul", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-4.mp3" }
    ];
    
    let currentMusic = 0;
    let isPlaying = false;
    let shuffle = false;
    let timer = null;
    let controlsVisible = true;
    let controlsTimer = null;
    
    const audio = document.getElementById('musicPlayer');
    const playBtn = document.getElementById('playPauseBtn');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const shuffleBtn = document.getElementById('shuffleBtn');
    const progressFill = document.getElementById('progressFill');
    const currentTimeEl = document.getElementById('currentTime');
    const totalTimeEl = document.getElementById('totalTime');
    const trackTitle = document.getElementById('trackTitle');
    const trackArtist = document.getElementById('trackArtist');
    const progressBarBg = document.getElementById('progressBar');
    const playlistContainerDiv = document.getElementById('playlistContainer');
    const playlistItemsDiv = document.getElementById('playlistItems');
    const playlistBtnDiv = document.getElementById('playlistBtn');
    const toggleBtn = document.getElementById('toggleControlsBtn');
    const playerBar = document.getElementById('musicPlayerBar');
    
    function formatTime(sec) {
        if (isNaN(sec)) return "0:00";
        const m = Math.floor(sec / 60);
        const s = Math.floor(sec % 60);
        return `${m}:${s < 10 ? '0' : ''}${s}`;
    }
    
    function startTimer() {
        if (timer) clearInterval(timer);
        timer = setInterval(() => {
            if (isPlaying && audio.duration) {
                const percent = (audio.currentTime / audio.duration) * 100;
                progressFill.style.width = percent + '%';
                currentTimeEl.textContent = formatTime(audio.currentTime);
            }
        }, 200);
    }
    
    function resetControlsTimer() {
        if (controlsTimer) clearTimeout(controlsTimer);
        if (controlsVisible) {
            controlsTimer = setTimeout(() => {
                playerBar.classList.add('hide');
                controlsVisible = false;
                toggleBtn.innerHTML = '<i class="fas fa-chevron-up"></i>';
            }, 4000);
        }
    }
    
    function showControls() {
        playerBar.classList.remove('hide');
        controlsVisible = true;
        toggleBtn.innerHTML = '<i class="fas fa-chevron-down"></i>';
        resetControlsTimer();
    }
    
    function renderPlaylist() {
        playlistItemsDiv.innerHTML = musicas.map((m, i) => `
            <div class="playlist-item ${i === currentMusic ? 'active' : ''}" data-index="${i}">
                <div>${(i+1).toString().padStart(2,'0')}</div>
                <div><div>${m.title}</div><div>${m.artist}</div></div>
            </div>
        `).join('');
        document.querySelectorAll('.playlist-item').forEach(item => {
            item.addEventListener('click', () => {
                selectSong(parseInt(item.dataset.index));
                playlistContainerDiv.classList.remove('open');
            });
        });
    }
    
    function loadTrack(index) {
        currentMusic = index;
        const track = musicas[currentMusic];
        audio.src = track.src;
        trackTitle.textContent = track.title;
        trackArtist.textContent = track.artist;
        progressFill.style.width = '0%';
        currentTimeEl.textContent = '0:00';
        renderPlaylist();
        audio.onloadedmetadata = () => {
            totalTimeEl.textContent = formatTime(audio.duration);
        };
    }
    
    async function playMusic() {
        try {
            await audio.play();
            isPlaying = true;
            playBtn.innerHTML = '<i class="fas fa-pause"></i>';
            startTimer();
            showControls();
        } catch(e) {
            setTimeout(() => playMusic(), 1000);
        }
    }
    
    function pauseMusic() {
        audio.pause();
        isPlaying = false;
        playBtn.innerHTML = '<i class="fas fa-play"></i>';
        if (timer) clearInterval(timer);
        timer = null;
    }
    
    function togglePlayPause() { isPlaying ? pauseMusic() : playMusic(); showControls(); }
    function nextTrack() { loadTrack((currentMusic + 1) % musicas.length); if (isPlaying) playMusic(); showControls(); }
    function prevTrack() { loadTrack((currentMusic - 1 + musicas.length) % musicas.length); if (isPlaying) playMusic(); showControls(); }
    function selectSong(index) { loadTrack(index); if (isPlaying) playMusic(); showControls(); }
    function toggleShuffle() { shuffle = !shuffle; shuffleBtn.style.background = shuffle ? '#4ecdc4' : ''; showControls(); }
    function togglePlaylist() { playlistContainerDiv.classList.toggle('open'); showControls(); }
    function toggleControlsBar() {
        if (controlsVisible) {
            playerBar.classList.add('hide');
            controlsVisible = false;
            toggleBtn.innerHTML = '<i class="fas fa-chevron-up"></i>';
            if (controlsTimer) clearTimeout(controlsTimer);
        } else { showControls(); }
    }
    
    playBtn.addEventListener('click', togglePlayPause);
    prevBtn.addEventListener('click', prevTrack);
    nextBtn.addEventListener('click', nextTrack);
    shuffleBtn.addEventListener('click', toggleShuffle);
    toggleBtn.addEventListener('click', toggleControlsBar);
    playlistBtnDiv.addEventListener('click', togglePlaylist);
    
    progressBarBg.addEventListener('click', (e) => {
        if (audio.duration) {
            const rect = progressBarBg.getBoundingClientRect();
            const percent = (e.clientX - rect.left) / rect.width;
            audio.currentTime = percent * audio.duration;
        }
        showControls();
    });
    
    document.addEventListener('mousemove', () => { if (!controlsVisible) showControls(); else resetControlsTimer(); });
    document.addEventListener('click', (e) => {
        if (!playlistContainerDiv.contains(e.target) && e.target !== playlistBtnDiv) {
            playlistContainerDiv.classList.remove('open');
        }
    });
    
    audio.onended = () => nextTrack();
    audio.onerror = () => setTimeout(() => nextTrack(), 1500);
    
    // RELÓGIO
    function updateClock() {
        const now = new Date();
        document.getElementById('clock').textContent = `${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}`;
    }
    
    // INICIALIZAR
    function iniciar() {
        console.log("✅ SISTEMA INICIADO");
        console.log("📋 Fluxo: Saudação + Video MP4 JUNTOS por 33s → espera 3min → repete");
        console.log("🎵 Músicas ambiente tocando");
        
        updateClock();
        setInterval(updateClock, 1000);
        
        carregarVideo();
        loadTrack(0);
        
        setTimeout(() => playMusic(), 500);
        setTimeout(() => iniciarCiclo(), 500);
        
        resetControlsTimer();
        
        setTimeout(() => {
            if (document.documentElement.requestFullscreen) {
                document.documentElement.requestFullscreen();
            }
        }, 1000);
    }
    
    iniciar();
</script>
</body>
</html>

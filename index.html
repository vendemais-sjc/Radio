<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>MUTV Playlist • Dual Video Player</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: #000000;
            overflow: hidden;
            position: fixed;
            width: 100%;
            height: 100%;
        }

        /* Temas de cor */
        body.theme-red { --primary-color: #e63946; --primary-dark: #b71c1c; }
        body.theme-lilac { --primary-color: #b380ff; --primary-dark: #7a4db3; }
        body.theme-blue { --primary-color: #00a8ff; --primary-dark: #0077be; }
        body.theme-green { --primary-color: #00ff88; --primary-dark: #00cc6a; }
        body.theme-orange { --primary-color: #ff7700; --primary-dark: #cc5500; }
        body.theme-pink { --primary-color: #ff44aa; --primary-dark: #cc0088; }
        body.theme-purple { --primary-color: #aa44ff; --primary-dark: #7700cc; }
        body.theme-yellow { --primary-color: #ffdd44; --primary-dark: #ccaa00; }
        body.theme-white { --primary-color: #ffffff; --primary-dark: #cccccc; }
        body.theme-pure-black { --primary-color: #000000; --primary-dark: #000000; }
        
        body {
            --primary-color: #e63946;
            --primary-dark: #b71c1c;
            --text-primary: #ffffff;
            --text-secondary: #cccccc;
            --border-color: #333333;
        }

        /* Layout principal: dois vídeos ocupando 100% da tela */
        .app {
            width: 100%;
            height: 100vh;
            background: #000;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* VÍDEO PRINCIPAL - 1080x1920 (vertical) */
        .video-principal-wrapper {
            position: relative;
            width: 100%;
            flex: 1.2;
            min-height: 0;
            background: #000;
            overflow: hidden;
            border-bottom: 2px solid var(--primary-color);
        }

        #mainVideo {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Overlay do ticker sobre o vídeo principal */
        .overlay-ticker {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.85), rgba(0,0,0,0.4), transparent);
            padding: 20px 12px 12px 12px;
            z-index: 15;
            pointer-events: none;
        }

        .ticker-container {
            width: 100%;
            overflow: hidden;
            white-space: nowrap;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(8px);
            border-radius: 40px;
            padding: 10px 0;
            border-left: 3px solid var(--primary-color);
            border-right: 3px solid var(--primary-color);
        }

        .ticker-text {
            display: inline-block;
            padding-left: 100%;
            animation: ticker-scroll 25s linear infinite;
            color: #fff;
            font-weight: 700;
            font-size: 0.9rem;
            letter-spacing: 0.5px;
        }

        @keyframes ticker-scroll {
            0% { transform: translateX(0); }
            100% { transform: translateX(-100%); }
        }

        /* SEGUNDO VÍDEO - ocupa todo o espaço restante */
        .video-secundario-wrapper {
            position: relative;
            flex: 1;
            min-height: 0;
            background: #000;
            overflow: hidden;
            border-top: 1px solid rgba(255,255,255,0.2);
        }

        #extraVideo {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* CONTROLES DE MÚSICA SOBREPOSTOS AO SEGUNDO VÍDEO */
        .music-controls-overlay {
            position: absolute;
            bottom: 20px;
            left: 0;
            right: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.9), rgba(0,0,0,0.6), transparent);
            padding: 15px 20px 25px;
            z-index: 30;
            backdrop-filter: blur(4px);
            border-top: 1px solid rgba(255,255,255,0.2);
            pointer-events: auto;
        }

        .track-info {
            text-align: center;
            margin-bottom: 8px;
        }

        .track-info p {
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-shadow: 1px 1px 0 #000;
        }

        .progress-area {
            padding: 0 10px 5px;
        }

        .progress-time {
            display: flex;
            justify-content: space-between;
            font-size: 0.7rem;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }

        .progress-bar {
            height: 4px;
            background: rgba(255,255,255,0.3);
            cursor: pointer;
            border-radius: 2px;
        }

        .progress-fill {
            height: 100%;
            background: var(--primary-color);
            width: 0%;
            border-radius: 2px;
        }

        .controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-top: 8px;
        }

        .control-btn {
            background: rgba(0,0,0,0.6);
            border: none;
            color: #ffffff !important;
            font-size: 1.8rem;
            width: 48px;
            height: 48px;
            cursor: pointer;
            border-radius: 50%;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(4px);
        }

        .control-btn:active {
            transform: scale(0.92);
            background: var(--primary-color);
        }

        .play-btn {
            font-size: 2.4rem;
            width: 64px;
            height: 64px;
            background: var(--primary-color);
            color: #000 !important;
        }

        /* Botão de menu e fullscreen no vídeo principal */
        .video-buttons {
            position: absolute;
            top: 12px;
            right: 12px;
            display: flex;
            gap: 8px;
            z-index: 20;
        }

        .video-menu-btn, .fullscreen-btn {
            background: rgba(0,0,0,0.6);
            color: white;
            border: none;
            font-size: 1.2rem;
            cursor: pointer;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        /* Drawer (menu lateral) */
        .drawer {
            position: fixed;
            top: 0;
            left: 0;
            width: 85%;
            max-width: 320px;
            height: 100vh;
            background: #000000;
            transform: translateX(-100%);
            transition: transform 0.3s ease;
            z-index: 2000;
            padding: 20px;
            overflow-y: auto;
            border-right: 2px solid var(--primary-color);
        }
        .drawer.open { transform: translateX(0); }
        .drawer-header { display: flex; justify-content: flex-end; margin-bottom: 20px; }
        .close-drawer { background: none; border: none; color: var(--text-primary); font-size: 1.8rem; cursor: pointer; }
        .drawer-item { background: none; border: 1px solid var(--border-color); color: var(--text-primary); padding: 12px 14px; width: 100%; text-align: left; margin-bottom: 8px; display: flex; align-items: center; gap: 10px; cursor: pointer; border-radius: 8px; }
        .mode-toggle-btn { background: var(--primary-color); color: #000; font-weight: bold; border: none; padding: 10px; border-radius: 40px; margin: 10px 0; width: 100%; cursor: pointer; }
        .playlist-container { margin-top: 15px; max-height: 350px; overflow-y: auto; }
        .playlist-item { display: flex; align-items: center; gap: 10px; padding: 8px; border: 1px solid var(--border-color); border-radius: 30px; margin-bottom: 8px; cursor: pointer; background: #0a0a0a; }
        .playlist-item.playing { border-color: var(--primary-color); background: #1a1a1a; }
        .music-number { width: 36px; height: 36px; border-radius: 50%; background: var(--primary-color); color: #000; font-weight: bold; display: flex; align-items: center; justify-content: center; }
        .playlist-info { flex: 1; }
        .playlist-title { font-size: 0.85rem; color: var(--text-primary); font-weight: 600; }
        .color-picker { display: flex; flex-wrap: wrap; gap: 8px; margin: 15px 0; padding: 15px 0; border-top: 1px solid var(--border-color); border-bottom: 1px solid var(--border-color); }
        .color-option { width: 35px; height: 35px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; }
        .color-option.active { border-color: white; }
        .notification { position: fixed; bottom: 20px; left: 16px; right: 16px; background: #000; color: #fff; padding: 10px 16px; z-index: 3000; transform: translateY(100px); transition: transform 0.3s; border-left: 3px solid var(--primary-color); border-radius: 10px; text-align: center; font-size: 0.85rem; }
        .notification.show { transform: translateY(0); }
        .feedback-btn { position: fixed; bottom: 20px; right: 20px; background: rgba(0,0,0,0.7); color: #fff; font-size: 1.5rem; cursor: pointer; z-index: 2000; width: 48px; height: 48px; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 1px solid var(--primary-color); }
        .ad-panel { background: #0a0a0a; border-radius: 8px; padding: 10px; margin: 15px 0; border: 1px solid var(--border-color); }
        .ad-timer { font-size: 1.3rem; font-weight: bold; text-align: center; color: var(--primary-color); }
        .drawer-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 1999; display: none; }
        .drawer-overlay.active { display: block; }
        #splash { position: fixed; inset: 0; background: #000; display: flex; align-items: center; justify-content: center; z-index: 9999; transition: opacity 0.5s; }
        #splash.hidden { opacity: 0; pointer-events: none; }
        #tap-to-start { position: fixed; bottom: 120px; left: 50%; transform: translateX(-50%); background: linear-gradient(135deg, var(--primary-color), var(--primary-dark)); color: white; padding: 12px 28px; border-radius: 50px; font-weight: bold; z-index: 10000; cursor: pointer; display: none; white-space: nowrap; }
    </style>
</head>

        ];

        // Vídeos do segundo player (substitua pelos seus vídeos)
        const videosExtra = [
            { src: "betania.mp4", nome: "AlugueCopos", link: "https://www.aluguecopos.com.br/" },
            { src: "loja.mp4", nome: "Destaque", link: "https://destaque.com.br/" },
            { src: "pizza12.mp4", nome: "Pizza12", link: "#" }
        ];

        // Anúncios de áudio
        const anunciosAudio = [
            { src: "zzcv.mp3", nome: "Oferta Especial" },
            { src: "zzcv.mp3", nome: "Promoção Relâmpago" }
        ];

        // DOM Elements
        const musicPlayer = document.getElementById('musicPlayer');
        const adPlayer = document.getElementById('adPlayer');
        const playBtn = document.getElementById('playPauseBtn');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const progressFill = document.getElementById('progressFill');
        const currentTimeEl = document.getElementById('currentTime');
        const totalTimeEl = document.getElementById('totalTime');
        const trackArtist = document.getElementById('trackArtist');
        const shuffleBtn = document.getElementById('shufflePlayerBtn');
        const playlistContainer = document.getElementById('playlistContainer');
        const toggleAllSongsBtn = document.getElementById('toggleAllSongsBtn');
        const extraVideo = document.getElementById('extraVideo');
        
        let currentIndex = 0, isPlaying = false, shuffle = false, allSongsMode = true, filteredPlaylist = [];
        let timerInterval = null, isAdPlaying = false, adsEnabled = true, adInterval = 15;
        let currentAdIndex = 0, shouldResumeMusic = false, musicPausedTime = 0;
        let extraVideoIndex = 0, extraVideoInterval = null;

        // Filtrar playlist
        function updateFilteredPlaylist() {
            if(allSongsMode) {
                filteredPlaylist = [...musicas];
            } else {
                const hora = new Date().getHours();
                let periodo = "manha";
                if(hora >= 12 && hora < 18) periodo = "tarde";
                else if(hora >= 18) periodo = "noite";
                filteredPlaylist = musicas.filter(m => m.periodo === periodo || m.periodo === "todos");
                if(filteredPlaylist.length === 0) filteredPlaylist = [...musicas];
            }
            renderPlaylist();
        }

        function renderPlaylist() {
            let html = '';
            filteredPlaylist.forEach((m, idx) => {
                const globalIdx = musicas.findIndex(p => p.id === m.id);
                const isActive = (globalIdx === currentIndex && isPlaying);
                html += `<div class="playlist-item ${isActive ? 'playing' : ''}" onclick="window.selectSong(${globalIdx})">
                            <div class="music-number">${(idx+1).toString().padStart(2,'0')}</div>
                            <div class="playlist-info">
                                <div class="playlist-title">${m.title}</div>
                                <div class="playlist-artist">${m.artist}</div>
                            </div>
                        </div>`;
            });
            playlistContainer.innerHTML = html;
        }

        function loadTrack(index) {
            if(index >= musicas.length) index = 0;
            if(index < 0) index = musicas.length - 1;
            currentIndex = index;
            const track = musicas[currentIndex];
            musicPlayer.src = track.src;
            trackArtist.textContent = `${track.title} - ${track.artist}`;
            currentTimeEl.textContent = '0:00';
            totalTimeEl.textContent = '03:30';
            progressFill.style.width = '0%';
            renderPlaylist();
        }

        function startTimer() {
            if(timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                if(isPlaying && !isAdPlaying && musicPlayer.duration && !musicPlayer.paused) {
                    const percent = (musicPlayer.currentTime / musicPlayer.duration) * 100;
                    progressFill.style.width = percent + '%';
                    const mins = Math.floor(musicPlayer.currentTime / 60);
                    const secs = Math.floor(musicPlayer.currentTime % 60);
                    currentTimeEl.textContent = `${mins}:${secs < 10 ? '0' : ''}${secs}`;
                    if(musicPlayer.currentTime >= musicPlayer.duration - 0.3) nextTrack();
                }
            }, 100);
        }

        function stopTimer() { 
            if(timerInterval) clearInterval(timerInterval); 
            timerInterval = null; 
        }
        
        async function playMusic() {
            if(isAdPlaying) { 
                showNotification('Aguarde o anúncio terminar'); 
                return; 
            }
            const track = musicas[currentIndex];
            musicPlayer.src = track.src;
            musicPlayer.load();
            musicPlayer.oncanplaythrough = async () => {
                await musicPlayer.play();
                isPlaying = true;
                playBtn.innerHTML = '<i class="fas fa-pause"></i>';
                startTimer();
                renderPlaylist();
            };
            musicPlayer.onerror = () => showNotification('Erro: Arquivo não encontrado');
        }

        function pauseMusic() { 
            musicPlayer.pause(); 
            isPlaying = false; 
            playBtn.innerHTML = '<i class="fas fa-play"></i>'; 
            stopTimer(); 
            renderPlaylist(); 
        }

        function togglePlayPause() { 
            isPlaying ? pauseMusic() : playMusic(); 
        }
        
        async function nextTrack() {
            if(isAdPlaying) return;
            stopTimer();
            musicPlayer.pause();
            let filteredIdx = filteredPlaylist.findIndex(m => m.id === musicas[currentIndex].id);
            if(filteredIdx === -1) filteredIdx = 0;
            if(shuffle && filteredPlaylist.length > 1) {
                let newIdx;
                do { newIdx = Math.floor(Math.random() * filteredPlaylist.length); } while(newIdx === filteredIdx);
                filteredIdx = newIdx;
            } else { 
                filteredIdx = (filteredIdx + 1) % filteredPlaylist.length; 
            }
            const newGlobal = musicas.findIndex(m => m.id === filteredPlaylist[filteredIdx].id);
            currentIndex = newGlobal;
            loadTrack(currentIndex);
            if(isPlaying) await playMusic();
        }

        async function prevTrack() {
            if(isAdPlaying) return;
            stopTimer();
            musicPlayer.pause();
            let filteredIdx = filteredPlaylist.findIndex(m => m.id === musicas[currentIndex].id);
            if(filteredIdx === -1) filteredIdx = 0;
            if(shuffle && filteredPlaylist.length > 1) {
                let newIdx;
                do { newIdx = Math.floor(Math.random() * filteredPlaylist.length); } while(newIdx === filteredIdx);
                filteredIdx = newIdx;
            } else { 
                filteredIdx = (filteredIdx - 1 + filteredPlaylist.length) % filteredPlaylist.length; 
            }
            const newGlobal = musicas.findIndex(m => m.id === filteredPlaylist[filteredIdx].id);
            currentIndex = newGlobal;
            loadTrack(currentIndex);
            if(isPlaying) await playMusic();
        }
        
        function playAudioAd() {
            if(!adsEnabled || isAdPlaying) return;
            const ad = anunciosAudio[currentAdIndex];
            if(!ad) return;
            if(isPlaying) { 
                musicPausedTime = musicPlayer.currentTime; 
                pauseMusic(); 
                shouldResumeMusic = true; 
            } else {
                shouldResumeMusic = false;
            }
            adPlayer.src = ad.src;
            adPlayer.load();
            isAdPlaying = true;
            adPlayer.play().catch(() => finishAudioAd());
            adPlayer.onended = finishAudioAd;
        }

        function finishAudioAd() {
            isAdPlaying = false;
            if(shouldResumeMusic) {
                musicPlayer.currentTime = musicPausedTime;
                playMusic();
                shouldResumeMusic = false;
            }
            currentAdIndex = (currentAdIndex + 1) % anunciosAudio.length;
        }

        function startAdTimer() { 
            setInterval(() => { 
                if(adsEnabled && !isAdPlaying && isPlaying) playAudioAd(); 
            }, adInterval * 60 * 1000); 
        }

        function toggleAds() { 
            adsEnabled = !adsEnabled; 
            document.getElementById('toggleAdsBtn').innerHTML = adsEnabled ? 'Ativo' : 'Inativo'; 
        }

        function testAd() { 
            playAudioAd(); 
        }
        
        function alternarVideoExtra() {
            extraVideoIndex = (extraVideoIndex + 1) % videosExtra.length;
            const novo = videosExtra[extraVideoIndex];
            extraVideo.src = novo.src;
            extraVideo.load();
            extraVideo.play().catch(e => console.log('Erro no vídeo:', e));
            const container = extraVideo.parentElement;
            container.onclick = () => { 
                if(novo.link && novo.link !== '#') window.open(novo.link, '_blank'); 
            };
        }

        function iniciarAlternanciaExtra() { 
            extraVideoInterval = setInterval(alternarVideoExtra, 15000); 
        }
        
        window.selectSong = async function(globalIdx) {
            if(isAdPlaying) return;
            stopTimer();
            musicPlayer.pause();
            currentIndex = globalIdx;
            loadTrack(currentIndex);
            if(isPlaying) await playMusic();
            document.getElementById('drawer').classList.remove('open');
            document.getElementById('drawerOverlay').classList.remove('active');
        };
        
        function closeDrawer() { 
            document.getElementById('drawer').classList.remove('open'); 
            document.getElementById('drawerOverlay').classList.remove('active'); 
        }

        function toggleAllSongsMode() { 
            allSongsMode = !allSongsMode; 
            updateFilteredPlaylist(); 
            toggleAllSongsBtn.innerHTML = allSongsMode ? '🌎 Modo: TODAS as músicas' : '⏰ Modo: Período do dia'; 
            showNotification(allSongsMode ? "Todas as músicas" : "Modo período"); 
        }

        function showNotification(msg) { 
            const n = document.getElementById('notification'); 
            document.getElementById('notificationText').innerText = msg; 
            n.classList.add('show'); 
            setTimeout(() => n.classList.remove('show'), 3000); 
        }
        
        // Eventos e inicialização
        document.getElementById('progressBar').addEventListener('click', (e) => { 
            if(isAdPlaying) return; 
            const rect = e.currentTarget.getBoundingClientRect(); 
            const percent = (e.clientX - rect.left) / rect.width; 
            if(musicPlayer.duration) musicPlayer.currentTime = percent * musicPlayer.duration; 
        });
        
        playBtn.addEventListener('click', togglePlayPause);
        prevBtn.addEventListener('click', prevTrack);
        nextBtn.addEventListener('click', nextTrack);
        shuffleBtn.addEventListener('click', () => { 
            shuffle = !shuffle; 
            showNotification(shuffle ? '🔀 Aleatório ON' : '➡️ Sequencial'); 
        });
        
        document.getElementById('toggleAdsBtn').addEventListener('click', toggleAds);
        document.getElementById('testAdBtn').addEventListener('click', testAd);
        document.getElementById('videoMenuBtn').addEventListener('click', () => { 
            document.getElementById('drawer').classList.add('open'); 
            document.getElementById('drawerOverlay').classList.add('active'); 
        });
        
        document.getElementById('fullscreenBtn').addEventListener('click', () => { 
            if(document.fullscreenElement) document.exitFullscreen(); 
            else document.documentElement.requestFullscreen(); 
        });
        
        document.getElementById('closeDrawer').addEventListener('click', closeDrawer);
        document.getElementById('drawerOverlay').addEventListener('click', closeDrawer);
        
        document.getElementById('shareDrawerBtn').addEventListener('click', () => { 
            if(navigator.share) {
                navigator.share({title:'MUTV', url:location.href});
            } else { 
                navigator.clipboard.writeText(location.href); 
                showNotification('Link copiado!'); 
            } 
        });
        
        toggleAllSongsBtn.addEventListener('click', toggleAllSongsMode);
        
        // Temas
        const colorOptions = document.querySelectorAll('.color-option');
        function setTheme(themeClass) { 
            document.body.className = themeClass; 
            localStorage.setItem('radioTheme', themeClass); 
            colorOptions.forEach(opt => opt.classList.toggle('active', opt.dataset.theme === themeClass)); 
        }
        
        const savedTheme = localStorage.getItem('radioTheme') || 'theme-red'; 
        setTheme(savedTheme);
        colorOptions.forEach(opt => opt.addEventListener('click', () => setTheme(opt.dataset.theme)));
        
        // Feedback WhatsApp
        document.getElementById('feedbackBtn').addEventListener('click', () => { 
            window.open('https://wa.me/5512988461978?text=Feedback%20MUTV', '_blank'); 
        });
        
        // Inicialização
        window.addEventListener('load', () => {
            updateFilteredPlaylist();
            const randomIndex = Math.floor(Math.random() * filteredPlaylist.length);
            currentIndex = musicas.findIndex(m => m.id === filteredPlaylist[randomIndex].id);
            loadTrack(currentIndex);
            startAdTimer();
            iniciarAlternanciaExtra();
            
            document.getElementById('tap-to-start').style.display = 'block';
            document.getElementById('tap-to-start').addEventListener('click', async () => {
                await playMusic();
                document.getElementById('tap-to-start').style.display = 'none';
                document.getElementById('splash').classList.add('hidden');
                setTimeout(() => document.getElementById('splash').style.display = 'none', 500);
            });
            
            // Forçar o segundo vídeo a tocar
            extraVideo.play().catch(e => console.log('Erro no vídeo extra:', e));
            setInterval(() => { 
                if(!allSongsMode) updateFilteredPlaylist(); 
            }, 60000);
        });
    </script>

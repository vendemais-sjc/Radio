<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rádio Playlist • Corpo Único</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #0a0c12;
            color: #eaeef2;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            transition: background 0.2s;
            padding: 0;
        }

        body.darker {
            background: #000;
        }

        body.car-mode {
            background: #000;
        }
        body.car-mode .player-card,
        body.car-mode .top-bar,
        body.car-mode .status-row,
        body.car-mode .playlist-card {
            background: #111;
            border: 2px solid #ff4444;
        }
        body.car-mode .playlist-card,
        body.car-mode .status-row {
            display: none;
        }
        body.car-mode .control-btn {
            width: 60px;
            height: 60px;
            font-size: 2rem;
        }

        .app {
            max-width: 420px;
            width: 100%;
            background: #1e2430;
            display: flex;
            flex-direction: column;
        }

        /* TOP BAR SEM ARREDONDAMENTO */
        .top-bar {
            background: #1e2430;
            padding: 12px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #2f3542;
        }
        .logo {
            font-weight: 700;
            font-size: 1.25rem;
            color: #f1c40f;
            letter-spacing: -0.5px;
        }
        .logo i {
            margin-right: 6px;
            color: #f1c40f;
        }
        .menu-btn {
            background: none;
            border: none;
            color: white;
            font-size: 1.5rem;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.2s;
        }
        .menu-btn:hover {
            background: rgba(255,255,255,0.1);
        }

        /* PLAYER CARD SEM ARREDONDAMENTO */
        .player-card {
            background: #1e2430;
            overflow: hidden;
            border-bottom: 1px solid #2f3542;
        }
        .video-container {
            aspect-ratio: 16 / 9;
            background: #10141c;
            position: relative;
            overflow: hidden;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        /* LETREIRO COM LETRAS PRETAS E FUNDO CLARO */
        .video-ticker {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            background: rgba(255, 255, 255, 0.7); /* fundo branco semi-transparente */
            color: #000000; /* letras pretas */
            padding: 8px 0;
            font-size: 0.9rem;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            z-index: 10;
            backdrop-filter: blur(4px);
            border-bottom: 1px solid rgba(0,0,0,0.2);
            cursor: pointer;
        }
        .video-ticker span {
            display: inline-block;
            padding-left: 100%;
            animation: ticker-scroll 20s linear infinite;
        }
        @keyframes ticker-scroll {
            0% { transform: translateX(0); }
            100% { transform: translateX(-100%); }
        }

        .car-mode-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            color: #ff4444;
            opacity: 0.8;
            animation: pulse 2s infinite;
            pointer-events: none;
        }
        .track-info {
            padding: 16px 16px 8px;
            text-align: center;
        }
        .track-info h2 {
            font-size: 1.3rem;
            font-weight: 700;
            color: #f1c40f;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .track-info p {
            font-size: 0.9rem;
            opacity: 0.7;
            margin-top: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .progress-area {
            padding: 0 16px 8px;
        }
        .progress-time {
            display: flex;
            justify-content: space-between;
            font-size: 0.7rem;
            opacity: 0.8;
            margin-bottom: 4px;
        }
        .progress-bar {
            height: 5px;
            background: #2f3542;
            cursor: pointer;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: #3b82f6;
            width: 0%;
        }
        .controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            padding: 8px 16px 16px;
        }
        .control-btn {
            background: none;
            border: none;
            color: white;
            font-size: 1.8rem;
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.2s;
        }
        .control-btn:active {
            background: rgba(255,255,255,0.1);
        }
        .play-btn {
            font-size: 2.4rem;
            color: #3b82f6;
        }
        .volume-area {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 0 16px 16px;
        }
        .volume-icon {
            background: none;
            border: none;
            color: white;
            font-size: 1.2rem;
            width: 36px;
            height: 36px;
            cursor: pointer;
        }
        .volume-slider {
            flex: 1;
            height: 4px;
            background: #2f3542;
            -webkit-appearance: none;
        }
        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            background: white;
            border: 2px solid #3b82f6;
            border-radius: 50%;
            cursor: pointer;
        }
        .volume-percent {
            font-size: 0.8rem;
            width: 40px;
            text-align: right;
            opacity: 0.8;
        }

        /* STATUS ROW SEM ARREDONDAMENTO */
        .status-row {
            background: #1e2430;
            padding: 10px 18px;
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            border-bottom: 1px solid #2f3542;
        }
        .status-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .status-item i {
            color: #f1c40f;
            width: 18px;
            text-align: center;
        }

        /* PLAYLIST SEM ARREDONDAMENTO */
        .playlist-card {
            background: #1e2430;
            padding: 16px;
            flex: 1;
        }
        .playlist-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }
        .playlist-header h3 {
            font-size: 1rem;
            font-weight: 600;
            opacity: 0.9;
        }
        .playlist-header h3 i {
            margin-right: 6px;
            color: #f1c40f;
        }
        .fav-filter {
            background: none;
            border: none;
            color: #666;
            font-size: 1.2rem;
            width: 40px;
            height: 40px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
        }
        .fav-filter.active {
            color: #e74c3c;
        }
        .playlist-items {
            max-height: 300px;
            overflow-y: auto;
            padding-right: 4px;
        }
        .playlist-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px;
            background: rgba(0,0,0,0.2);
            margin-bottom: 6px;
            cursor: pointer;
            transition: background 0.2s;
            border-left: 3px solid transparent;
        }
        .playlist-item.playing {
            background: #2a3140;
            border-left: 3px solid #3b82f6;
        }
        .playlist-item.favorite {
            border-right: 3px solid #f1c40f;
        }
        .item-index {
            width: 28px;
            height: 28px;
            background: #2f3542;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            font-weight: 700;
            color: white;
        }
        .item-info {
            flex: 1;
            min-width: 0;
        }
        .item-title {
            font-weight: 600;
            font-size: 0.9rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .item-artist {
            font-size: 0.7rem;
            opacity: 0.6;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .item-duration {
            font-size: 0.7rem;
            background: #2f3542;
            padding: 3px 8px;
            opacity: 0.8;
        }
        .fav-btn {
            background: none;
            border: none;
            color: #666;
            font-size: 1rem;
            width: 32px;
            height: 32px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .fav-btn.active {
            color: #e74c3c;
        }

        /* DRAWER (menu lateral) */
        .drawer {
            position: fixed;
            top: 0;
            left: 0;
            width: 280px;
            height: 100vh;
            background: #141a24;
            box-shadow: 4px 0 20px rgba(0,0,0,0.8);
            transform: translateX(-100%);
            transition: transform 0.3s ease;
            z-index: 2000;
            padding: 20px;
            overflow-y: auto;
            border-right: 1px solid #2f3542;
        }
        .drawer.open {
            transform: translateX(0);
        }
        .drawer-header {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 30px;
        }
        .close-drawer {
            background: none;
            border: none;
            color: white;
            font-size: 1.8rem;
            cursor: pointer;
            padding: 4px;
        }
        .drawer-item {
            background: none;
            border: none;
            color: white;
            font-size: 1rem;
            padding: 14px 16px;
            width: 100%;
            text-align: left;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .drawer-item i {
            width: 24px;
            text-align: center;
            color: #f1c40f;
        }
        .drawer-item:hover {
            background: #1e2a3a;
        }
        .drawer-divider {
            height: 1px;
            background: #2f3542;
            margin: 16px 0;
        }

        .ad-panel {
            background: #0e121b;
            padding: 16px;
            margin-top: 10px;
        }
        .ad-panel h4 {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px;
            font-size: 0.9rem;
            opacity: 0.9;
        }
        .ad-timer {
            font-size: 2rem;
            font-weight: 700;
            text-align: center;
            margin: 10px 0;
            color: #f1c40f;
        }
        .ad-status {
            background: #1a212e;
            padding: 8px;
            text-align: center;
            font-size: 0.8rem;
            margin-bottom: 12px;
        }
        .ad-buttons {
            display: flex;
            gap: 8px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .ad-btn {
            background: #1e2a3a;
            border: none;
            color: white;
            padding: 8px 16px;
            font-size: 0.8rem;
            cursor: pointer;
            border: 1px solid #2f3542;
        }
        .ad-btn i {
            margin-right: 4px;
        }

        .drawer-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            z-index: 1999;
            display: none;
        }
        .drawer-overlay.active {
            display: block;
        }

        .notification {
            position: fixed;
            bottom: 16px;
            left: 16px;
            right: 16px;
            background: #1e2a3a;
            color: white;
            padding: 12px 20px;
            box-shadow: 0 8px 20px black;
            z-index: 3000;
            transform: translateY(100px);
            transition: 0.3s;
            border-left: 4px solid #3b82f6;
            max-width: 380px;
            margin: 0 auto;
            text-align: center;
        }
        .notification.show {
            transform: translateY(0);
        }

        .footer {
            text-align: center;
            padding: 15px 5px;
            font-size: 0.7rem;
            opacity: 0.5;
            border-top: 1px solid #2f3542;
        }

        ::-webkit-scrollbar { width: 3px; }
        ::-webkit-scrollbar-track { background: #1a1f2a; }
        ::-webkit-scrollbar-thumb { background: #3b82f6; }
    </style>
</head>

            window.toggleFavorite = function(index) {
                if (index === undefined) return;
                const musica = playlistAtual[index];
                if (!musica) return;
                musica.favorite = !musica.favorite;
                let favorites = JSON.parse(localStorage.getItem('radioFavorites') || '[]');
                if (musica.favorite) {
                    if (!favorites.includes(musica.id)) favorites.push(musica.id);
                } else {
                    favorites = favorites.filter(id => id !== musica.id);
                }
                localStorage.setItem('radioFavorites', JSON.stringify(favorites));
                if (showingFavorites) mostrarPlaylistFavoritas();
                else mostrarPlaylist();
                showNotification(musica.favorite ? '❤️ Adicionado' : '💔 Removido');
            };

            function loadFavoritesFromStorage() {
                const favorites = JSON.parse(localStorage.getItem('radioFavorites') || '[]');
                playlistAtual.forEach(m => { m.favorite = favorites.includes(m.id); });
            }

            function shuffleArray(arr) {
                for (let i = arr.length-1; i>0; i--) {
                    const j = Math.floor(Math.random()*(i+1));
                    [arr[i],arr[j]] = [arr[j],arr[i]];
                }
                return arr;
            }

            function inicializarPlaylist() {
                playlistAtual = shuffleArray([...playlistCompleta]);
                loadFavoritesFromStorage();
                totalCountEl.textContent = playlistAtual.length;
                mostrarPlaylist();
                if (playlistAtual.length > 0) {
                    currentIndex = 0;
                    loadTrack(0);
                }
            }

            function mostrarPlaylist() {
                if (!playlistContainer) return;
                if (showingFavorites) {
                    mostrarPlaylistFavoritas();
                    return;
                }
                const musicasParaMostrar = playlistAtual.slice(0, CONFIG.maxPlaylistDisplay);
                let html = '';
                musicasParaMostrar.forEach((musica, index) => {
                    const isPlaying = (index === currentIndex && !isAdPlaying);
                    html += `<div class="playlist-item ${isPlaying ? 'playing' : ''} ${musica.favorite ? 'favorite' : ''}" onclick="selectSong(${index})">
                        <div class="item-index">${index+1}</div>
                        <div class="item-info">
                            <div class="item-title">${musica.title}</div>
                            <div class="item-artist">${musica.artist}</div>
                        </div>
                        <div class="item-duration">${musica.duration}</div>
                        <button class="fav-btn ${musica.favorite ? 'active' : ''}" onclick="event.stopPropagation(); window.toggleFavorite(${index})"><i class="fas fa-heart"></i></button>
                    </div>`;
                });
                if (playlistAtual.length > CONFIG.maxPlaylistDisplay) {
                    html += `<div style="text-align:center; padding:10px; opacity:0.6;">+ ${playlistAtual.length - CONFIG.maxPlaylistDisplay} músicas</div>`;
                }
                playlistContainer.innerHTML = html;

            function mostrarPlaylistFavoritas() {
                const favoritas = playlistAtual.filter(m => m.favorite);
                if (favoritas.length === 0) {
                    playlistContainer.innerHTML = '<div style="text-align:center; padding:20px; opacity:0.7;">Nenhuma favorita ❤️</div>';
                    return;
                }
                let html = '';
                favoritas.forEach((musica, idx) => {
                    const originalIndex = playlistAtual.findIndex(m => m.id === musica.id);
                    const isPlaying = (originalIndex === currentIndex && !isAdPlaying);
                    html += `<div class="playlist-item ${isPlaying ? 'playing' : ''} favorite" onclick="selectSong(${originalIndex})">
                        <div class="item-index">${idx+1}</div>
                        <div class="item-info">

                            <div class="item-artist">${musica.artist}</div>

                    </div>`;
                });
                playlistContainer.innerHTML = html;

            function loadTrack(index) {

                if (index >= playlistAtual.length) index = 0;

                progressFill.style.width = '0%';
                currentTimeEl.textContent = '0:00';

            }

            function prevTrack() {
                if (isAdPlaying) return;
                currentIndex = (currentIndex - 1 + playlistAtual.length) % playlistAtual.length;
                loadTrack(currentIndex);
                if (isPlaying) playMusic();
            }

            function checkAdInterval() {
                if (!adsEnabled) return;
                if (musicPlayedCount > 0 && musicPlayedCount % CONFIG.musicBetweenAds === 0 && !isAdPlaying) {
                    playNextAd();
                }
                updateAdTimer();
            }

            function updateAdTimer() {
                if (!adTimer) return;
                if (adsEnabled) {
                    const songsUntilAd = CONFIG.musicBetweenAds - (musicPlayedCount % CONFIG.musicBetweenAds);
                    adTimer.textContent = songsUntilAd === CONFIG.musicBetweenAds ? 0 : songsUntilAd;
                } else {
                    adTimer.textContent = "OFF";
                }
            }

            function playNextAd() {
                if (!adsEnabled || !advertisements.length) return;
                currentAdIndex = (currentAdIndex + 1) % advertisements.length;
                playAd(currentAdIndex);
            }

            function playAd(index) {
                const ad = advertisements[index];
                if (isPlaying) {
                    musicPausedTime = musicPlayer.currentTime;
                    pauseMusic();
                    shouldResumeMusic = true;
                }
                adPlayer.src = ad.src;
                adPlayer.load();
                isAdPlaying = true;
                adStatus.innerHTML = `<i class="fas fa-volume-up fa-spin"></i> ${ad.title} (${ad.duration})`;
                skipAdBtn.style.display = "inline-block";
                showNotification(`📢 ${ad.title}`);
                adPlayer.play().catch(() => finishAd());
                adPlayer.onended = finishAd;
            }

            function finishAd() {
                isAdPlaying = false;
                updateAdTimer();
                adStatus.innerHTML = '<i class="fas fa-compact-disc fa-spin"></i> Aguardando...';
                skipAdBtn.style.display = "none";
                if (shouldResumeMusic && playlistAtual.length) {
                    musicPlayer.currentTime = musicPausedTime;
                    playMusic();
                    shouldResumeMusic = false;
                }
            }

            function toggleAds() {
                adsEnabled = !adsEnabled;
                toggleAdsBtn.innerHTML = adsEnabled ? '<i class="fas fa-toggle-on"></i> Ativo' : '<i class="fas fa-toggle-off"></i> Inativo';
                if (!adsEnabled) {
                    adTimer.textContent = "OFF";
                    adStatus.innerHTML = '<i class="fas fa-ban"></i> Desativados';
                    if (isAdPlaying) {
                        adPlayer.pause();
                        finishAd();
                    }
                } else {
                    updateAdTimer();
                    adStatus.innerHTML = '<i class="fas fa-compact-disc fa-spin"></i> Aguardando...';
                }
            }

            function testAd() {
                if (advertisements.length) playAd(currentAdIndex);
            }

            function skipAd() {
                if (isAdPlaying) {
                    adPlayer.pause();
                    finishAd();
                    showNotification('⏭️ Anúncio pulado');
                }
            }

            volumeSlider.addEventListener('input', (e) => {
                const vol = e.target.value / 100;
                musicPlayer.volume = adPlayer.volume = vol;
                volumePercent.textContent = e.target.value + '%';
                volumeIconBtn.innerHTML = vol == 0 ? '<i class="fas fa-volume-mute"></i>' : vol < 0.3 ? '<i class="fas fa-volume-off"></i>' : vol < 0.7 ? '<i class="fas fa-volume-down"></i>' : '<i class="fas fa-volume-up"></i>';
            });

            volumeIconBtn.addEventListener('click', () => {
                if (musicPlayer.volume > 0) {
                    musicPlayer.volume = 0;
                    adPlayer.volume = 0;
                    volumeSlider.value = 0;
                    volumePercent.textContent = '0%';
                    volumeIconBtn.innerHTML = '<i class="fas fa-volume-mute"></i>';
                } else {
                    musicPlayer.volume = 0.8;
                    adPlayer.volume = 0.8;
                    volumeSlider.value = 80;
                    volumePercent.textContent = '80%';
                    volumeIconBtn.innerHTML = '<i class="fas fa-volume-up"></i>';
                }
            });

            musicPlayer.addEventListener('timeupdate', () => {
                if (musicPlayer.duration && !isAdPlaying) {
                    progressFill.style.width = (musicPlayer.currentTime / musicPlayer.duration * 100) + '%';
                    currentTimeEl.textContent = formatTime(musicPlayer.currentTime);
                }
            });

            musicPlayer.addEventListener('ended', () => {
                if (!isAdPlaying) nextTrack();
            });

            musicPlayer.addEventListener('error', () => {
                if (!isAdPlaying) setTimeout(nextTrack, 1000);
            });

            progressBar.addEventListener('click', (e) => {
                if (isAdPlaying || !musicPlayer.duration) return;
                const rect = progressBar.getBoundingClientRect();
                const x = e.clientX - rect.left;
                if (x >= 0 && x <= rect.width) {
                    musicPlayer.currentTime = (x / rect.width) * musicPlayer.duration;
                }
            });

            function formatTime(s) {
                if (isNaN(s)) return '0:00';
                const m = Math.floor(s / 60);
                const se = Math.floor(s % 60);
                return `${m}:${se < 10 ? '0' : ''}${se}`;
            }

            filterFavBtn.addEventListener('click', () => {
                showingFavorites = !showingFavorites;
                filterFavBtn.classList.toggle('active', showingFavorites);
                if (showingFavorites) mostrarPlaylistFavoritas();
                else mostrarPlaylist();
            });

            function openDrawer() {
                drawer.classList.add('open');
                drawerOverlay.classList.add('active');
            }
            function closeDrawerFunc() {
                drawer.classList.remove('open');
                drawerOverlay.classList.remove('active');
            }
            menuBtn.addEventListener('click', openDrawer);
            closeDrawer.addEventListener('click', closeDrawerFunc);
            drawerOverlay.addEventListener('click', closeDrawerFunc);

            toggleAdsBtn.addEventListener('click', toggleAds);
            testAdBtn.addEventListener('click', testAd);
            skipAdBtn.addEventListener('click', skipAd);

            playBtn.addEventListener('click', togglePlayPause);
            prevBtn.addEventListener('click', prevTrack);
            nextBtn.addEventListener('click', nextTrack);

            videoTicker.addEventListener('click', () => {
                const novoTexto = prompt('Editar texto do letreiro:', tickerText.textContent);
                if (novoTexto && novoTexto.trim() !== '') {
                    tickerText.textContent = novoTexto.trim();
                }
            });

            setInterval(() => {
                let change = Math.floor(Math.random() * 451) - 200;
                listenerCount = Math.max(100, Math.min(3900, listenerCount + change));
                listenerCountEl.textContent = listenerCount >= 1000 ? (listenerCount / 1000).toFixed(1) + 'k' : listenerCount;
            }, Math.random() * 5000 + 3000);

            setInterval(() => {
                uptimeSeconds++;
                const h = Math.floor(uptimeSeconds / 3600);
                const m = Math.floor((uptimeSeconds % 3600) / 60);
                const s = uptimeSeconds % 60;
                uptimeEl.textContent = h > 0 ? `${h}h${m.toString().padStart(2, '0')}` : `${m}:${s.toString().padStart(2, '0')}`;
            }, 1000);

            window.addEventListener('load', () => {
                musicPlayer.volume = CONFIG.defaultVolume / 100;
                adPlayer.volume = CONFIG.defaultVolume / 100;
                volumeSlider.value = CONFIG.defaultVolume;
                volumePercent.textContent = CONFIG.defaultVolume + '%';
                inicializarPlaylist();
                updateAdTimer();

                const autoPlay = () => {
                    if (!autoPlayAttempted) {
                        musicPlayer.play().then(() => {
                            isPlaying = true;
                            playBtn.innerHTML = '<i class="fas fa-pause"></i>';
                        }).catch(() => {});
                        autoPlayAttempted = true;
                    }
                };
                autoPlay();
                document.addEventListener('touchstart', autoPlay, { once: true });
                document.addEventListener('click', autoPlay, { once: true });
            });
        })();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rádio Playlist • Temas Modernos</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* ========== RESET E VARIÁVEIS ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            transition: background-color 0.3s, color 0.3s;
            background-color: var(--bg-primary);
        }

        /* Tema padrão (vermelho moderno) */
        body.theme-red {
            --bg-primary: #1a0c0c;
            --bg-secondary: #2d1a1a;
            --bg-drawer: #221212;
            --text-primary: #ffe6e6;
            --text-secondary: #d4a5a5;
            --border-color: #5c3a3a;
            --primary-color: #e63946;
            --primary-light: #ff6b7a;
            --primary-dark: #b71c1c;
        }

        /* Tema lilás */
        body.theme-lilac {
            --bg-primary: #1a1024;
            --bg-secondary: #2e1e3a;
            --bg-drawer: #231530;
            --text-primary: #f3e8ff;
            --text-secondary: #c9b0e6;
            --border-color: #563d7c;
            --primary-color: #b380ff;
            --primary-light: #d6b3ff;
            --primary-dark: #7a4db3;
        }

        /* Tema preto (dark moderno) */
        body.theme-black {
            --bg-primary: #121212;
            --bg-secondary: #1e1e1e;
            --bg-drawer: #1a1a1a;
            --text-primary: #f0f0f0;
            --text-secondary: #b0b0b0;
            --border-color: #333333;
            --primary-color: #bb86fc;
            --primary-light: #cf9eff;
            --primary-dark: #9b6ad0;
        }

        /* Tema cinza (gray moderno) */
        body.theme-gray {
            --bg-primary: #1f1f1f;
            --bg-secondary: #2d2d2d;
            --bg-drawer: #262626;
            --text-primary: #e0e0e0;
            --text-secondary: #a0a0a0;
            --border-color: #4a4a4a;
            --primary-color: #a0a0a0;
            --primary-light: #c0c0c0;
            --primary-dark: #707070;
        }

        /* Aplicação das variáveis (fallback) */
        body {
            --bg-primary: #1a0c0c;
            --bg-secondary: #2d1a1a;
            --bg-drawer: #221212;
            --text-primary: #ffe6e6;
            --text-secondary: #d4a5a5;
            --border-color: #5c3a3a;
            --primary-color: #e63946;
            --primary-light: #ff6b7a;
            --primary-dark: #b71c1c;
        }

        /* Modo carro */
        body.car-mode {
            background: #000;
        }
        body.car-mode .player-card,
        body.car-mode .top-bar {
            background: #111;
        }
        body.car-mode .control-btn {
            width: 60px;
            height: 60px;
            font-size: 2rem;
        }
        body.car-mode .top-bar,
        body.car-mode .extra-video-container {
            display: none !important;
        }
        body.car-mode .player-card {
            border: 2px solid var(--primary-color);
            margin-bottom: 0;
        }
        body.car-mode .app {
            justify-content: center;
        }

        .app {
            max-width: 420px;
            width: 100%;
            background: var(--bg-primary);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        /* SPLASH SCREEN */
        #splash {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.5s ease;
            pointer-events: none;
        }
        #splash.hidden {
            opacity: 0;
        }
        #splash.hidden.display-none {
            display: none;
        }
        .splash-content {
            text-align: center;
            color: #fff;
        }
        .splash-content i {
            font-size: 4rem;
            color: var(--primary-color);
            margin-bottom: 1rem;
            animation: pulse 1.5s infinite;
        }
        .splash-content h1 {
            font-size: 1.8rem;
            letter-spacing: 2px;
        }
        .splash-content p {
            font-size: 1rem;
            opacity: 0.8;
            margin-top: 0.5rem;
        }

        /* MENSAGEM PARA TOQUE NO MOBILE */
        #tap-to-start {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--primary-color);
            color: white;
            padding: 12px 24px;
            border-radius: 40px;
            font-weight: bold;
            z-index: 10000;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            transition: opacity 0.5s;
            pointer-events: none;
        }
        #tap-to-start.hidden {
            opacity: 0;
        }

        @keyframes pulse {
            0% { opacity: 0.6; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.1); }
            100% { opacity: 0.6; transform: scale(1); }
        }

        /* TOP BAR E TICKER */
        .top-bar {
            background: #000;
            border-top: 3px solid var(--primary-color);
            border-top-left-radius: 15px;
            border-top-right-radius: 15px;
            border-bottom: 1px solid var(--primary-color);
        }
        
        .top-ticker {
            width: 100%;
            overflow: hidden;
            white-space: nowrap;
            background: #000;
            color: #fff;
            font-weight: 800;
            font-size: 1.2rem;
            padding: 12px 16px;
            cursor: pointer;
            border: none;
            border-top-left-radius: 12px;
            border-top-right-radius: 12px;
        }
        
        .top-ticker span {
            display: inline-block;
            padding-left: 100%;
            animation: ticker-scroll 25s linear infinite;
        }
        
        @keyframes ticker-scroll {
            0% { transform: translateX(0); }
            100% { transform: translateX(-100%); }
        }

        /* PLAYER CARD */
        .player-card {
            background: var(--bg-primary);
            border-bottom: 1px solid var(--primary-color);
        }
        .video-container {
            aspect-ratio: 16 / 9;
            background: #10141c;
            position: relative;
            border-bottom: 1px solid var(--primary-color);
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .video-menu-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0,0,0,0.6);
            color: white;
            border: none;
            border-radius: 50%;
            width: 44px;
            height: 44px;
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 20;
        }
        .track-info {
            padding: 16px 16px 8px;
            text-align: center;
        }
        .track-info h2 {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--primary-color);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .track-info p {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-top: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .progress-area {
            padding: 0 16px 8px;
        }
        .progress-time {
            display: flex;
            justify-content: space-between;
            font-size: 0.7rem;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }
        /* BARRA DE PROGRESSO FINA */
        .progress-bar {
            height: 4px;
            background: var(--border-color);
            cursor: pointer;
            overflow: hidden;
            border-radius: 2px;
        }
        .progress-fill {
            height: 100%;
            background: var(--primary-color);
            width: 0%;
        }
        .controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            padding: 8px 16px 16px;
        }
        .control-btn {
            background: none;
            border: none;
            color: var(--text-primary);
            font-size: 1.8rem;
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .play-btn {
            font-size: 2.4rem;
            color: var(--primary-color);
        }
        .shuffle-player-btn.active {
            color: var(--primary-color);
            transform: scale(1.2);
        }
        .volume-area {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 0 16px 16px;
        }
        .volume-icon {
            background: none;
            border: none;
            color: var(--text-primary);
            font-size: 1.2rem;
            width: 36px;
            height: 36px;
            cursor: pointer;
        }
        .volume-slider {
            flex: 1;
            height: 4px;
            background: var(--border-color);
            -webkit-appearance: none;
            border-radius: 2px;
        }
        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 12px;
            height: 12px;
            background: white;
            border: 2px solid var(--primary-color);
            border-radius: 50%;
            cursor: pointer;
        }
        .volume-percent {
            font-size: 0.8rem;
            width: 40px;
            text-align: right;
            color: var(--text-secondary);
        }

        /* VÍDEO EXTRA */
        .extra-video-container {
            flex: 1;
            background: #000;
            border-top: 1px solid var(--primary-color);
        }
        .extra-video-container video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* DRAWER */
        .drawer {
            position: fixed;
            top: 0;
            left: 0;
            width: 280px;
            height: 100vh;
            background: var(--bg-drawer);
            box-shadow: 4px 0 20px rgba(0,0,0,0.8);
            transform: translateX(-100%);
            transition: transform 0.3s ease;
            z-index: 2000;
            padding: 20px;
            overflow-y: auto;
            border-right: 1px solid var(--border-color);
        }
        .drawer.open {
            transform: translateX(0);
        }
        .drawer-header {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 30px;
        }
        .close-drawer {
            background: none;
            border: none;
            color: var(--text-primary);
            font-size: 1.8rem;
            cursor: pointer;
            padding: 4px;
        }
        .drawer-item {
            background: none;
            border: none;
            color: var(--text-primary);
            font-size: 1rem;
            padding: 14px 16px;
            width: 100%;
            text-align: left;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            border-radius: 8px;
        }
        .drawer-item i {
            width: 24px;
            text-align: center;
            color: var(--primary-color);
        }
        .drawer-item:hover {
            background: var(--control-hover);
        }
        .drawer-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            z-index: 1999;
            display: none;
        }
        .drawer-overlay.active {
            display: block;
        }

        /* SELETOR DE CORES */
        .color-picker {
            display: flex;
            justify-content: space-around;
            margin: 20px 0;
            padding: 10px 0;
            border-top: 1px solid var(--border-color);
            border-bottom: 1px solid var(--border-color);
        }
        .color-option {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid transparent;
            transition: transform 0.2s;
        }
        .color-option:hover {
            transform: scale(1.2);
        }
        .color-option.active {
            border-color: white;
            box-shadow: 0 0 10px currentColor;
        }
        .color-option.red { background: #e63946; }
        .color-option.lilac { background: #b380ff; }
        .color-option.black { background: #bb86fc; }
        .color-option.gray { background: #a0a0a0; }

        /* PAINEL DE ANÚNCIOS */
        .ad-panel {
            background: rgba(0,0,0,0.3);
            border-radius: 8px;
            padding: 12px;
            margin: 20px 0;
        }
        .ad-panel h4 {
            color: var(--primary-color);
            margin-bottom: 8px;
            font-size: 0.9rem;
        }
        .ad-timer {
            font-size: 2rem;
            font-weight: bold;
            text-align: center;
            color: var(--primary-color);
        }
        .ad-status {
            font-size: 0.8rem;
            text-align: center;
            color: var(--text-secondary);
            margin: 5px 0;
        }
        .ad-buttons {
            display: flex;
            justify-content: center;
            gap: 10px;
        }
        .ad-btn {
            background: none;
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 5px 12px;
            border-radius: 15px;
            cursor: pointer;
            font-size: 0.8rem;
        }

        /* PLAYLIST */
        .filter-fav {
            display: flex;
            gap: 10px;
            margin: 10px 0;
            align-items: center;
        }
        .filter-fav button {
            background: none;
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 5px 10px;
            border-radius: 15px;
            cursor: pointer;
            font-size: 0.8rem;
        }
        .filter-fav button.active {
            background: var(--primary-color);
            border-color: var(--primary-color);
        }
        .playlist-container {
            max-height: 300px;
            overflow-y: auto;
            margin-top: 10px;
        }
        .playlist-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px;
            border-radius: 4px;
            margin-bottom: 4px;
            cursor: pointer;
            background: rgba(255,255,255,0.05);
        }
        .playlist-item.playing {
            border-left: 3px solid var(--primary-color);
            background: rgba(255,64,129,0.1);
        }
        .playlist-info {
            flex: 1;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }
        .playlist-title {
            font-size: 0.9rem;
            color: var(--text-primary);
        }
        .playlist-artist {
            font-size: 0.7rem;
            color: var(--text-secondary);
        }
        .fav-btn {
            background: none;
            border: none;
            color: #666;
            font-size: 1rem;
            cursor: pointer;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .fav-btn.active {
            color: var(--primary-color);
        }

        /* NOTIFICAÇÃO */
        .notification {
            position: fixed;
            bottom: 16px;
            left: 16px;
            right: 16px;
            background: var(--bg-drawer);
            color: var(--text-primary);
            padding: 12px 20px;
            box-shadow: 0 8px 20px black;
            z-index: 3000;
            transform: translateY(100px);
            transition: transform 0.3s;
            border-left: 4px solid var(--primary-color);
            max-width: 380px;
            margin: 0 auto;
            text-align: center;
        }
        .notification.show {
            transform: translateY(0);
        }

        .footer {
            text-align: center;
            padding: 15px 5px;
            font-size: 0.7rem;
            color: var(--text-secondary);
            background: var(--bg-primary);
            border-bottom: 3px solid var(--primary-color);
            border-bottom-left-radius: 15px;
            border-bottom-right-radius: 15px;
            border-top: 1px solid var(--primary-color);
        }
    </style>
</head>

                const favs = JSON.parse(localStorage.getItem('radioFavorites')) || [];
                playlist.forEach(m => {
                    m.favorite = favs.includes(m.id);
                });
            }

            // Salva favoritos no localStorage
            function saveFavorites() {
                const favs = playlist.filter(m => m.favorite).map(m => m.id);
                localStorage.setItem('radioFavorites', JSON.stringify(favs));

            window.toggleFavorite = function(id) {
                const musica = playlist.find(m => m.id === id);
                if (musica) {
                    musica.favorite = !musica.favorite;
                    saveFavorites();
                    renderPlaylist();
                    showNotification(musica.favorite ? '❤️ Adicionado aos favoritos' : '💔 Removido dos favoritos');
                }

            // Renderiza a playlist no drawer (com base no filtro)
            function renderPlaylist() {
                let lista = showingFavorites ? playlist.filter(m => m.favorite) : playlist;
                let html = '';
                lista.forEach((musica, idx) => {
                    const isPlaying = (musica.id === playlist[currentIndex].id && !isAdPlaying);
                    html += `
                        <div class="playlist-item ${isPlaying ? 'playing' : ''}" onclick="selectSong(${musica.id})">

                });

            window.selectSong = function(id) {
                if (isAdPlaying) {
                    showNotification('⏸️ Aguarde o anúncio terminar');
                    return;
                }
                const index = playlist.findIndex(m => m.id === id);
                if (index !== -1) {
                    currentIndex = index;
                    loadTrack(currentIndex);
                    if (isPlaying) playMusic();
                    closeDrawerFunc();

            // Carrega uma faixa
            function loadTrack(index) {
                if (!playlist.length) return;
                if (index >= playlist.length) index = 0;
                if (index < 0) index = playlist.length - 1;
                currentIndex = index;
                const track = playlist[currentIndex];
                musicPlayer.src = track.src;
                musicPlayer.load();
                trackTitle.textContent = track.title;
                trackArtist.textContent = track.artist;
                totalTimeEl.textContent = track.duration;
                progressFill.style.width = '0%';
                currentTimeEl.textContent = '0:00';
                renderPlaylist();
            }

            // Tocar música

                if (isAdPlaying) return;

                        tapToStart.classList.add('hidden');
                    })
                    .catch(e => {
                        console.warn('Autoplay bloqueado:', e);

                    });

                musicPlayer.pause();

                if (isAdPlaying) {
                    adPlayer.paused ? adPlayer.play() : adPlayer.pause();
                } else {

                    let newIndex;
                    do {
                        newIndex = Math.floor(Math.random() * playlist.length);
                    } while (newIndex === currentIndex);
                    currentIndex = newIndex;
                } else {

                checkAdInterval();
            }

            function prevTrack() {
                if (isAdPlaying) return;
                if (shuffle && playlist.length > 1) {
                    let newIndex;
                    do {
                        newIndex = Math.floor(Math.random() * playlist.length);
                    } while (newIndex === currentIndex);
                    currentIndex = newIndex;
                } else {
                    currentIndex = (currentIndex - 1 + playlist.length) % playlist.length;
                }
                loadTrack(currentIndex);
                if (isPlaying) playMusic();
            }

            // ========== SISTEMA DE ANÚNCIOS ==========
            function updateAdTimer() {
                if (!adsEnabled) {
                    adTimerEl.textContent = 'OFF';
                    return;
                }
                const songsUntilAd = CONFIG.adsInterval - (musicPlayedCount % CONFIG.adsInterval);
                adTimerEl.textContent = songsUntilAd === CONFIG.adsInterval ? 0 : songsUntilAd;
            }

            function playAd() {
                if (!adsEnabled || isAdPlaying) return;
                const ad = CONFIG.adsList[currentAdIndex];
                if (!ad) return;
                // Pausa a música atual
                if (isPlaying) {
                    musicPlayer.pause();
                }
                adPlayer.src = ad.src;
                adPlayer.load();
                isAdPlaying = true;
                adStatus.innerHTML = `<i class="fas fa-volume-up"></i> Tocando: ${ad.title}`;
                skipAdBtn.style.display = 'inline-block';
                showNotification(`📢 Anúncio: ${ad.title}`);
                adPlayer.play()
                    .catch(() => finishAd());
                adPlayer.onended = finishAd;
                adPlayer.onerror = finishAd;
            }

            function finishAd() {
                isAdPlaying = false;
                adStatus.innerHTML = '<i class="fas fa-compact-disc fa-spin"></i> Aguardando...';
                skipAdBtn.style.display = 'none';
                if (isPlaying) {
                    musicPlayer.play();
                }
                // Avança para o próximo anúncio na lista
                currentAdIndex = (currentAdIndex + 1) % CONFIG.adsList.length;
            }

            function checkAdInterval() {
                if (!adsEnabled) return;
                if (musicPlayedCount > 0 && musicPlayedCount % CONFIG.adsInterval === 0) {
                    playAd();
                }
                updateAdTimer();
            }

            function toggleAds() {
                adsEnabled = !adsEnabled;
                toggleAdsBtn.innerHTML = adsEnabled ? '<i class="fas fa-toggle-on"></i> Ativo' : '<i class="fas fa-toggle-off"></i> Inativo';
                if (!adsEnabled && isAdPlaying) {
                    adPlayer.pause();
                    finishAd();
                }
                updateAdTimer();
            }

            function testAd() {
                playAd();
            }

            function skipAd() {
                if (isAdPlaying) {
                    adPlayer.pause();
                    finishAd();
                    showNotification('⏭️ Anúncio pulado');
                }
            }

            // ========== TROCAR CORES ==========
            function setTheme(themeClass) {
                body.className = themeClass; // remove todas as outras classes e adiciona a nova
                localStorage.setItem('radioTheme', themeClass);
                colorOptions.forEach(opt => {
                    opt.classList.toggle('active', opt.dataset.theme === themeClass);
                });
                showNotification('🎨 Tema alterado');
            }

            // Carregar tema salvo
            const savedTheme = localStorage.getItem('radioTheme') || 'theme-red';
            setTheme(savedTheme);

            colorOptions.forEach(opt => {
                opt.addEventListener('click', () => {
                    setTheme(opt.dataset.theme);
                });
            });

            // ========== EVENTOS DO PLAYER ==========
            musicPlayer.addEventListener('timeupdate', () => {
                if (musicPlayer.duration && !isAdPlaying) {
                    const percent = (musicPlayer.currentTime / musicPlayer.duration) * 100;
                    progressFill.style.width = percent + '%';
                    const m = Math.floor(musicPlayer.currentTime / 60);
                    const s = Math.floor(musicPlayer.currentTime % 60);
                    currentTimeEl.textContent = m + ':' + (s < 10 ? '0' + s : s);
                }
            });

            musicPlayer.addEventListener('ended', () => {
                if (!isAdPlaying) nextTrack();
            });

            musicPlayer.addEventListener('error', (e) => {
                console.error('Erro no áudio:', e);
                showNotification('⚠️ Erro na música, pulando...');
                setTimeout(nextTrack, 1000);
            });

            // Controles
            prevBtn.addEventListener('click', prevTrack);
            nextBtn.addEventListener('click', nextTrack);
            playBtn.addEventListener('click', togglePlayPause);

            // Shuffle
            shuffleBtn.addEventListener('click', () => {
                shuffle = !shuffle;
                shuffleBtn.classList.toggle('active', shuffle);
                showNotification(shuffle ? '🔀 Aleatório ON' : '➡️ Sequencial');
            });

            // Volume
            volumeSlider.addEventListener('input', (e) => {
                const vol = e.target.value / 100;
                musicPlayer.volume = vol;
                adPlayer.volume = vol;
                volumePercent.textContent = e.target.value + '%';
                volumeIcon.innerHTML = vol == 0 ? '<i class="fas fa-volume-mute"></i>' : '<i class="fas fa-volume-up"></i>';
            });

            volumeIcon.addEventListener('click', () => {
                if (musicPlayer.volume > 0) {
                    musicPlayer.volume = 0;
                    adPlayer.volume = 0;
                    volumeSlider.value = 0;
                    volumePercent.textContent = '0%';
                    volumeIcon.innerHTML = '<i class="fas fa-volume-mute"></i>';
                } else {
                    musicPlayer.volume = 0.8;
                    adPlayer.volume = 0.8;
                    volumeSlider.value = 80;
                    volumePercent.textContent = '80%';
                    volumeIcon.innerHTML = '<i class="fas fa-volume-up"></i>';
                }
            });

            // Barra de progresso clicável
            document.getElementById('progressBar').addEventListener('click', (e) => {
                if (isAdPlaying || !musicPlayer.duration) return;
                const rect = e.currentTarget.getBoundingClientRect();
                const x = e.clientX - rect.left;
                musicPlayer.currentTime = (x / rect.width) * musicPlayer.duration;
            });

            // ========== DRAWER ==========
            function openDrawer() {
                drawer.classList.add('open');
                drawerOverlay.classList.add('active');
                renderPlaylist();
            }
            function closeDrawerFunc() {
                drawer.classList.remove('open');
                drawerOverlay.classList.remove('active');
            }
            document.getElementById('videoMenuBtn').addEventListener('click', openDrawer);
            closeDrawer.addEventListener('click', closeDrawerFunc);
            drawerOverlay.addEventListener('click', closeDrawerFunc);

            // ========== FILTRO DE FAVORITOS ==========
            filterFavBtn.addEventListener('click', () => {
                showingFavorites = false;
                filterFavBtn.classList.add('active');
                showFavBtn.classList.remove('active');
                renderPlaylist();
            });
            showFavBtn.addEventListener('click', () => {
                showingFavorites = true;
                showFavBtn.classList.add('active');
                filterFavBtn.classList.remove('active');
                renderPlaylist();
            });

            // ========== OUTRAS OPÇÕES DO DRAWER ==========
            document.getElementById('fullscreenDrawerBtn').addEventListener('click', () => {
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen();
                } else {
                    document.exitFullscreen();
                }
            });

            document.getElementById('shareDrawerBtn').addEventListener('click', () => {
                if (navigator.share) {
                    navigator.share({ title: 'Rádio Playlist', url: location.href }).catch(() => {});
                } else {
                    navigator.clipboard.writeText(location.href);
                    showNotification('📋 Link copiado!');
                }
            });

            document.getElementById('carModeDrawerBtn').addEventListener('click', () => {
                document.body.classList.toggle('car-mode');
                showNotification('🚗 Modo carro ' + (document.body.classList.contains('car-mode') ? 'ativado' : 'desativado'));
            });

            // Anúncios
            toggleAdsBtn.addEventListener('click', toggleAds);
            testAdBtn.addEventListener('click', testAd);
            skipAdBtn.addEventListener('click', skipAd);

            // ========== INICIALIZAÇÃO ==========
            window.addEventListener('load', () => {
                // Carrega favoritos
                loadFavorites();

                // Ajusta volume inicial
                musicPlayer.volume = CONFIG.defaultVolume / 100;
                adPlayer.volume = CONFIG.defaultVolume / 100;
                volumeSlider.value = CONFIG.defaultVolume;
                volumePercent.textContent = CONFIG.defaultVolume + '%';

                // Carrega primeira música
                loadTrack(0);

                // Tenta autoplay
                const attemptPlay = () => {
                    if (!autoPlayAttempted) {
                        autoPlayAttempted = true;
                        playMusic();
                    }
                };
                attemptPlay();

                // Fallback: esconde splash após 3 segundos
                setTimeout(hideSplash, 3000);

                // Se falhou, ao tocar na tela tenta de novo
                document.addEventListener('touchstart', () => {
                    if (!isPlaying && musicPlayer.paused && !autoPlayAttempted) {
                        autoPlayAttempted = true;
                        playMusic();
                    } else if (!isPlaying && musicPlayer.paused) {
                        playMusic();
                    }
                }, { once: true });
                document.addEventListener('click', () => {
                    if (!isPlaying && musicPlayer.paused && !autoPlayAttempted) {
                        autoPlayAttempted = true;
                        playMusic();
                    } else if (!isPlaying && musicPlayer.paused) {
                        playMusic();
                    }
                }, { once: true });

                // Atualiza timer de anúncios
                updateAdTimer();
            });
        })();
    </script>
</body>
</html>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }

        #tap-to-start { position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%); background: linear-gradient(135deg, var(--primary-color), var(--primary-dark)); color: white; padding: 12px 28px; border-radius: 50px; font-weight: bold; font-size: 1.1rem; z-index: 10000; box-shadow: 0 0 25px rgba(230, 57, 70, 0.7), 0 4px 12px rgba(0,0,0,0.4); cursor: pointer; border: 2px solid rgba(255,255,255,0.5); text-align: center; letter-spacing: 0.5px; display: none; animation: btnPulse 1.5s infinite; backdrop-filter: blur(4px); white-space: nowrap; }

        .video-container { aspect-ratio: 16 / 9; background: #000; position: relative; border: 1px solid var(--primary-color); border-radius: 12px; margin: 5px; overflow: hidden; display: flex; align-items: center; justify-content: center; }

        .media-type-selector { position: absolute; bottom: 12px; left: 12px; display: flex; gap: 8px; z-index: 20; background: rgba(0,0,0,0.6); padding: 6px 12px; border-radius: 30px; backdrop-filter: blur(4px); border: 1px solid var(--primary-color); }
        .media-type-btn { background: none; border: none; color: #fff; font-size: 1rem; cursor: pointer; padding: 4px 8px; border-radius: 20px; transition: all 0.2s; }

        .progress-area { padding: 0 16px 8px; }
        .progress-time { display: flex; justify-content: space-between; font-size: 0.75rem; color: var(--text-secondary); margin-bottom: 4px; }
        .progress-bar { height: 4px; background: var(--border-color); cursor: pointer; border-radius: 2px; }
        .progress-fill { height: 100%; background: var(--primary-color); width: 0%; border-radius: 2px; }

        .playlist-container { margin-top: 15px; max-height: 350px; overflow-y: auto; }

        .color-option { width: 35px; height: 35px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; }

        .color-option.blue { background: #00a8ff; }

        .notification { position: fixed; bottom: 16px; left: 16px; right: 16px; background: #000; color: #fff; padding: 10px 16px; z-index: 3000; transform: translateY(100px); transition: transform 0.3s; border-left: 3px solid var(--primary-color); border-radius: 10px; text-align: center; }
        .notification.show { transform: translateY(0); }

        .feedback-btn { position: fixed; bottom: 20px; right: 20px; background: transparent; color: #ffffff !important; font-size: 1.5rem; cursor: pointer; z-index: 2000; }
        .feedback-modal { position: fixed; bottom: 70px; right: 20px; width: 260px; background: #1a1a1a; border: 2px solid var(--primary-color); border-radius: 15px; padding: 15px; z-index: 2001; display: none; }
        .feedback-modal.open { display: block; }
        .greeting-indicator { position: absolute; top: 12px; left: 12px; background: rgba(0,0,0,0.6); border-radius: 20px; padding: 4px 12px; font-size: 0.8rem; font-weight: bold; color: var(--primary-color); border: 1px solid var(--primary-color); backdrop-filter: blur(4px); z-index: 20; pointer-events: none; }

        body.car-mode .car-exit-btn { display: flex; }
        .bg-audio-badge { display: none; }
    </style>
</head>

    <script>
        // ==================== ÁUDIO FUNCIONAL ====================
        // ✅ Usando Web Audio API para gerar áudio de demonstração (funciona sem arquivos)
        let audioContext = null;
        let audioSource = null;
        let isPlayingAudio = false;
        let currentOscillator = null;
        let audioStartTime = 0;
        let audioPausedAt = 0;
        let currentTrackDuration = 30; // 30 segundos por música demo
        
        // Playlist com 173 músicas (usando áudio gerado dinamicamente)
        const musicas = [];
        const artistas = ["Flavio Venturini", "Adele", "Alphaville", "Bee Gees", "Cazuza", "Djavan", "Eagles", "Fagner", "Guns N Roses", "Jason Mraz", "Jota Quest", "Lulu Santos", "Natiruts", "Simply Red", "Skank", "Sting", "Titãs", "Zé Ramalho", "Marisa Monte", "Caetano Veloso"];
        const titulos = ["Flavio Venturini Feat Jota Quest", "Someone Like You", "Forever Young", "More Than A Woman", "Codinome Beija-Flor", "Correnteza", "Hotel California", "Espumas ao Vento", "Knockin On Heaven's Door", "I'm Yours", "Dentro de um Abraço", "Toda Forma de Amor", "Sorri Sou Rei", "Holding Back The Years", "Garota Nacional", "Fields of Gold", "Epitáfio", "Garoto de Aluguel", "Velha Infância", "Sorte"];
        
        for(let i = 1; i <= 173; i++) {
            const artistaIndex = (i - 1) % artistas.length;
            const tituloIndex = (i - 1) % titulos.length;
            musicas.push({ 
                id: i, 
                title: titulos[tituloIndex] + (i > 20 ? ` ${Math.floor(i/10)}` : ""), 
                artist: artistas[artistaIndex], 
                periodo: i % 3 === 0 ? "tarde" : (i % 2 === 0 ? "noite" : "manha"),
                duration: 30
            });
        }
        
        // Função para gerar áudio sintetizado (beep musical)
        function generateTone(frequency, duration, volume = 0.3) {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
            
            const now = audioContext.currentTime;
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            
            oscillator.type = 'sine';
            oscillator.frequency.value = frequency;
            
            gainNode.gain.value = 0;
            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);
            
            gainNode.gain.setValueAtTime(0, now);
            gainNode.gain.linearRampToValueAtTime(volume, now + 0.05);
            gainNode.gain.linearRampToValueAtTime(volume, now + duration - 0.1);
            gainNode.gain.linearRampToValueAtTime(0, now + duration);
            
            oscillator.start(now);
            oscillator.stop(now + duration);
            
            return oscillator;
        }
        
        // Função para tocar uma "música" demo (sequência de notas)
        function playDemoTrack(track, durationSec = 25) {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
            
            if (currentOscillator) {
                try { currentOscillator.stop(); } catch(e) {}
            }
            
            // Criar uma sequência de notas baseada no ID da música
            const baseNote = 220 + (track.id % 50) * 2;
            const notes = [baseNote, baseNote * 1.125, baseNote * 1.25, baseNote * 1.125, baseNote];
            let timeOffset = 0;
            const noteDuration = 0.8;
            
            const now = audioContext.currentTime;
            
            for (let i = 0; i < Math.min(durationSec / noteDuration, 30); i++) {
                const note = notes[i % notes.length];
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                
                oscillator.type = i % 2 === 0 ? 'sine' : 'triangle';
                oscillator.frequency.value = note * (1 + (i % 3) * 0.02);
                
                gainNode.gain.value = 0.15;
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                
                oscillator.start(now + timeOffset);
                oscillator.stop(now + timeOffset + noteDuration * 0.7);
                
                timeOffset += noteDuration;
            }
            
            // Timer para controlar duração da música
            if (window.musicTimeout) clearTimeout(window.musicTimeout);
            window.musicTimeout = setTimeout(() => {
                if (isPlayingAudio) {
                    stopDemoTrack();
                    nextTrack();
                }
            }, durationSec * 1000);
            
            currentOscillator = { stop: () => {} };
            return true;
        }
        
        function stopDemoTrack() {
            if (window.musicTimeout) clearTimeout(window.musicTimeout);
            if (audioContext) {
                // Não precisa parar todos os osciladores, eles param automaticamente
            }
        }
        
        // Player principal
        let currentIndex = 0, isPlaying = false, shuffle = false, allSongsMode = true, filteredPlaylist = [];
        let timerInterval = null;
        
        function updateFilteredPlaylist() {
            if(allSongsMode) filteredPlaylist = [...musicas];
            else { 
                const hora = new Date().getHours(); 
                let periodo = hora>=12 && hora<18 ? "tarde" : (hora>=18 ? "noite" : "manha"); 
                filteredPlaylist = musicas.filter(m => m.periodo === periodo || m.periodo === "todos"); 
                if(!filteredPlaylist.length) filteredPlaylist = [...musicas]; 
            }
            renderPlaylist();
        }
        
        function renderPlaylist() {
            let html = '';
            filteredPlaylist.forEach((m, idx) => { 
                const globalIdx = musicas.findIndex(p => p.id === m.id); 
                const isActive = (globalIdx === currentIndex && isPlaying); 
                html += `<div class="playlist-item ${isActive ? 'playing' : ''}" onclick="window.selectSong(${globalIdx})">
                            <div class="music-number">${(idx+1).toString().padStart(2,'0')}</div>
                            <div class="playlist-info">
                                <div class="playlist-title">${m.title}</div>
                                <div class="playlist-artist">${m.artist}</div>
                            </div>
                            <div class="playlist-duration">00:30</div>
                        </div>`; 
            });
            playlistContainer.innerHTML = html;
        }
        
        function loadTrack(index) {
            if(index >= musicas.length) index = 0;
            if(index < 0) index = musicas.length-1;
            currentIndex = index;
            const track = musicas[currentIndex];
            trackArtist.textContent = `${track.title} - ${track.artist}`;
            currentTimeEl.textContent = '0:00';
            totalTimeEl.textContent = '0:30';
            progressFill.style.width = '0%';
            
            // Media Session
            if ('mediaSession' in navigator) {
                navigator.mediaSession.metadata = new MediaMetadata({ title: track.title, artist: track.artist, album: 'Rádio Playlist' });
            }
            renderPlaylist();
        }
        
        function startTimer() {
            if(timerInterval) clearInterval(timerInterval);
            let startTime = Date.now();
            let elapsed = 0;
            timerInterval = setInterval(() => {
                if(isPlaying) {
                    elapsed = (Date.now() - startTime) / 1000;
                    if(elapsed >= 30) {
                        clearInterval(timerInterval);
                        timerInterval = null;
                        nextTrack();
                        return;
                    }
                    const percent = (elapsed / 30) * 100;
                    progressFill.style.width = percent + '%';
                    const mins = Math.floor(elapsed / 60);
                    const secs = Math.floor(elapsed % 60);
                    currentTimeEl.textContent = `${mins}:${secs < 10 ? '0' : ''}${secs}`;
                }
            }, 100);
        }
        
        function stopTimer() {
            if(timerInterval) { clearInterval(timerInterval); timerInterval = null; }
        }
        
        function playMusic() {
            if(isPlayingAudio) return;
            
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
            
            if (audioContext.state === 'suspended') {
                audioContext.resume();
            }
            
            const track = musicas[currentIndex];
            playDemoTrack(track, 30);
            isPlayingAudio = true;
            isPlaying = true;
            playBtn.innerHTML = '<i class="fas fa-pause"></i>';
            startTimer();
            
            splash.classList.add('hidden');
            setTimeout(() => splash.classList.add('display-none'), 500);
            tapToStart.classList.add('hidden');
            renderPlaylist();
            
            if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'playing';
        }
        
        function pauseMusic() {
            stopDemoTrack();
            isPlayingAudio = false;
            isPlaying = false;
            playBtn.innerHTML = '<i class="fas fa-play"></i>';
            stopTimer();
            renderPlaylist();
            if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'paused';
        }
        
        function togglePlayPause() {
            isPlayingAudio ? pauseMusic() : playMusic();
        }
        
        function nextTrack() {
            stopDemoTrack();
            stopTimer();
            
            let filteredIdx = filteredPlaylist.findIndex(m => m.id === musicas[currentIndex].id);
            if(filteredIdx === -1) filteredIdx = 0;
            
            if(shuffle && filteredPlaylist.length > 1) {
                let newIdx;
                do { newIdx = Math.floor(Math.random() * filteredPlaylist.length); } 
                while(newIdx === filteredIdx);
                filteredIdx = newIdx;
            } else {
                filteredIdx = (filteredIdx + 1) % filteredPlaylist.length;
            }
            
            const newGlobal = musicas.findIndex(m => m.id === filteredPlaylist[filteredIdx].id);
            currentIndex = newGlobal;
            loadTrack(currentIndex);
            
            if(isPlayingAudio) {
                playMusic();
            }
        }
        
        function prevTrack() {
            stopDemoTrack();
            stopTimer();
            
            let filteredIdx = filteredPlaylist.findIndex(m => m.id === musicas[currentIndex].id);
            if(filteredIdx === -1) filteredIdx = 0;
            
            if(shuffle && filteredPlaylist.length > 1) {
                let newIdx;
                do { newIdx = Math.floor(Math.random() * filteredPlaylist.length); } 
                while(newIdx === filteredIdx);
                filteredIdx = newIdx;
            } else {
                filteredIdx = (filteredIdx - 1 + filteredPlaylist.length) % filteredPlaylist.length;
            }
            
            const newGlobal = musicas.findIndex(m => m.id === filteredPlaylist[filteredIdx].id);
            currentIndex = newGlobal;
            loadTrack(currentIndex);
            
            if(isPlayingAudio) {
                playMusic();
            }
        }
        
        window.selectSong = function(globalIdx) {
            stopDemoTrack();
            stopTimer();
            currentIndex = globalIdx;
            loadTrack(currentIndex);
            if(isPlayingAudio) playMusic();
            closeDrawer();
        };
        
        // ==================== MULTI-MÍDIA FUNCIONAL ====================
        // ✅ Vídeos funcionais do Pexels (vídeos gratuitos e funcionais)
        const videosFuncionais = {
            padrao: ['https://videos.pexels.com/video-files/855743/855743-hd_1920_1080_25fps.mp4', 'https://videos.pexels.com/video-files/799134/799134-hd_1920_1080_25fps.mp4', 'https://videos.pexels.com/video-files/3191532/3191532-hd_1920_1080_24fps.mp4'],
            bomdia: ['https://videos.pexels.com/video-files/2845911/2845911-hd_1920_1080_24fps.mp4', 'https://videos.pexels.com/video-files/2816679/2816679-hd_1920_1080_24fps.mp4'],
            boatarde: ['https://videos.pexels.com/video-files/2098247/2098247-hd_1920_1080_24fps.mp4', 'https://videos.pexels.com/video-files/1886841/1886841-hd_1920_1080_30fps.mp4'],
            boanoite: ['https://videos.pexels.com/video-files/2013625/2013625-hd_1920_1080_24fps.mp4', 'https://videos.pexels.com/video-files/3254786/3254786-hd_1920_1080_30fps.mp4']
        };
        
        // ✅ Imagens funcionais do Picsum
        const imagensFuncionais = {
            padrao: ['https://picsum.photos/id/100/1280/720', 'https://picsum.photos/id/1015/1280/720'],
            bomdia: ['https://picsum.photos/id/16/1280/720', 'https://picsum.photos/id/29/1280/720'],
            boatarde: ['https://picsum.photos/id/15/1280/720', 'https://picsum.photos/id/30/1280/720'],
            boanoite: ['https://picsum.photos/id/42/1280/720', 'https://picsum.photos/id/76/1280/720']
        };
        
        // ✅ GIFs funcionais (GIPHY links que funcionam)
        const gifsFuncionais = {
            padrao: ['https://media.giphy.com/media/26tPplGWjN0xLyxUQ/giphy.gif', 'https://media.giphy.com/media/l0MYt5jH6gkWHygDe/giphy.gif'],
            bomdia: ['https://media.giphy.com/media/l0MYt5jH6gkWHygDe/giphy.gif', 'https://media.giphy.com/media/3o7abB06u9bNzA8LC8/giphy.gif'],
            boatarde: ['https://media.giphy.com/media/xT9IgzoKnwFWm9TkH2/giphy.gif', 'https://media.giphy.com/media/l0MYEq5BJi4XiLPZ6/giphy.gif'],
            boanoite: ['https://media.giphy.com/media/26gR2qejcKcgH4tA4/giphy.gif', 'https://media.giphy.com/media/3o7abB06u9bNzA8LC8/giphy.gif']
        };
        
        let mainMediaType = 'video';
        let extraMediaType = 'video';
        let mainMediaIndex = 0;
        let extraMediaIndex = 0;
        let currentGreeting = getCurrentGreeting();
        
        function getCurrentGreeting() {
            const hora = new Date().getHours();
            if (hora >= 5 && hora < 12) return { texto: "🌞 Bom dia!", emoji: "🌞", nome: "bomdia" };
            if (hora >= 12 && hora < 18) return { texto: "☀️ Boa tarde!", emoji: "☀️", nome: "boatarde" };
            return { texto: "🌙 Boa noite!", emoji: "🌙", nome: "boanoite" };
        }
        
        function getMediaList(type, greeting) {
            if (type === 'video') return videosFuncionais[greeting] || videosFuncionais.padrao;
            if (type === 'image') return imagensFuncionais[greeting] || imagensFuncionais.padrao;
            return gifsFuncionais[greeting] || gifsFuncionais.padrao;
        }
        
        function updateMainMedia() {
            const mediaList = getMediaList(mainMediaType, currentGreeting.nome);
            const src = mediaList[mainMediaIndex % mediaList.length];
            const isVideo = mainMediaType === 'video';
            
            const container = document.getElementById('mainMediaContainer');
            const oldMedia = document.getElementById('mainMedia');
            
            if (isVideo) {
                const newVideo = document.createElement('video');
                newVideo.id = 'mainMedia';
                newVideo.autoplay = true;
                newVideo.loop = true;
                newVideo.muted = true;
                newVideo.playsInline = true;
                newVideo.src = src;
                newVideo.style.width = '100%';
                newVideo.style.height = '100%';
                newVideo.style.objectFit = 'cover';
                if (oldMedia) oldMedia.replaceWith(newVideo);
                newVideo.play().catch(e => console.log);
            } else {
                const newImg = document.createElement('img');
                newImg.id = 'mainMedia';
                newImg.src = src;
                newImg.style.width = '100%';
                newImg.style.height = '100%';
                newImg.style.objectFit = 'contain';
                newImg.style.background = '#000';
                if (oldMedia) oldMedia.replaceWith(newImg);
            }
        }
        
        function updateExtraMedia() {
            const mediaList = getMediaList(extraMediaType, currentGreeting.nome);
            const src = mediaList[extraMediaIndex % mediaList.length];
            const isVideo = extraMediaType === 'video';
            
            const oldMedia = document.getElementById('extraMedia');
            
            if (isVideo) {
                const newVideo = document.createElement('video');
                newVideo.id = 'extraMedia';
                newVideo.autoplay = true;
                newVideo.loop = true;
                newVideo.muted = true;
                newVideo.playsInline = true;
                newVideo.src = src;
                newVideo.style.width = '100%';
                newVideo.style.height = '100%';
                newVideo.style.objectFit = 'cover';
                if (oldMedia) oldMedia.replaceWith(newVideo);
                newVideo.play().catch(e => console.log);
            } else {
                const newImg = document.createElement('img');
                newImg.id = 'extraMedia';
                newImg.src = src;
                newImg.style.width = '100%';
                newImg.style.height = '100%';
                newImg.style.objectFit = 'cover';
                if (oldMedia) oldMedia.replaceWith(newImg);
            }
        }
        
        function changeMainMediaType(type) {
            mainMediaType = type;
            mainMediaIndex = 0;
            updateMainMedia();
            document.querySelectorAll('.media-type-btn').forEach(btn => {
                if(btn.dataset.type === type) btn.classList.add('active');
                else btn.classList.remove('active');
            });
            showNotification(`Modo: ${type === 'video' ? 'Vídeo' : type === 'image' ? 'Foto' : 'GIF'}`);
        }
        
        function changeExtraMediaType(type) {
            extraMediaType = type;
            extraMediaIndex = 0;
            updateExtraMedia();
            document.querySelectorAll('.extra-media-btn').forEach(btn => {
                if(btn.dataset.extraType === type) btn.classList.add('active');
                else btn.classList.remove('active');
            });
        }
        
        function rotateMedia() {
            mainMediaIndex++;
            updateMainMedia();
            extraMediaIndex++;
            updateExtraMedia();
        }
        
        function updateGreetingUI() {
            const greeting = getCurrentGreeting();
            document.getElementById('greetingIndicator').innerHTML = `${greeting.emoji} ${greeting.texto}`;
            document.getElementById('topTickerText').innerHTML = `<i class="fas fa-headphones-alt fa-spin"></i> ${greeting.texto} RÁDIO PLAYLIST - 173 músicas - Anuncie aqui! <i class="fas fa-music fa-beat"></i>`;
        }
        
        function checkGreetingChange() {
            const newGreeting = getCurrentGreeting();
            if (newGreeting.nome !== currentGreeting.nome) {
                currentGreeting = newGreeting;
                updateGreetingUI();
                updateMainMedia();
                updateExtraMedia();
                showNotification(`${currentGreeting.texto} 🎉 Mídias atualizadas!`);
            }
        }
        
        // ==================== UTILITÁRIOS ====================
        function showNotification(msg) {
            const n = document.getElementById('notification');
            document.getElementById('notificationText').innerText = msg;
            n.classList.add('show');
            setTimeout(() => n.classList.remove('show'), 2000);
        }
        
        function closeDrawer() {
            document.getElementById('drawer').classList.remove('open');
            document.getElementById('drawerOverlay').classList.remove('active');
        }
        
        function toggleAllSongsMode() {
            allSongsMode = !allSongsMode;
            updateFilteredPlaylist();
            document.getElementById('toggleAllSongsBtn').innerHTML = allSongsMode ? '🌎 Modo: TODAS as músicas' : '⏰ Modo: Período do dia';
            showNotification(allSongsMode ? "Todas as músicas" : "Modo período");
            
            const exists = filteredPlaylist.some(m => m.id === musicas[currentIndex].id);
            if(!exists && filteredPlaylist.length) {
                const newGlobal = musicas.findIndex(m => m.id === filteredPlaylist[0].id);
                currentIndex = newGlobal;
                loadTrack(currentIndex);
                if(isPlayingAudio) playMusic();
            }
        }
        
        // ==================== EVENTOS ====================
        document.getElementById('progressBar').addEventListener('click', (e) => {});
        document.getElementById('playPauseBtn').addEventListener('click', togglePlayPause);
        document.getElementById('prevBtn').addEventListener('click', prevTrack);
        document.getElementById('nextBtn').addEventListener('click', nextTrack);
        document.getElementById('shufflePlayerBtn').addEventListener('click', () => {
            shuffle = !shuffle;
            document.getElementById('shufflePlayerBtn').classList.toggle('active', shuffle);
            showNotification(shuffle ? '🔀 Aleatório ON' : '➡️ Sequencial');
        });
        document.getElementById('toggleAdsBtn').addEventListener('click', () => showNotification('Anúncios desativados na versão demo'));
        document.getElementById('testAdBtn').addEventListener('click', () => showNotification('Demo: Anúncio teste'));
        document.getElementById('skipAdBtn').addEventListener('click', () => showNotification('Pular anúncio'));
        document.getElementById('videoMenuBtn').addEventListener('click', () => {
            document.getElementById('drawer').classList.add('open');
            document.getElementById('drawerOverlay').classList.add('active');
        });
        document.getElementById('closeDrawer').addEventListener('click', closeDrawer);
        document.getElementById('drawerOverlay').addEventListener('click', closeDrawer);
        document.getElementById('fullscreenDrawerBtn').addEventListener('click', () => {
            if(document.fullscreenElement) document.exitFullscreen();
            else document.documentElement.requestFullscreen();
        });
        document.getElementById('shareDrawerBtn').addEventListener('click', () => {
            if(navigator.share) navigator.share({title:'Rádio Playlist', url:location.href});
            else { navigator.clipboard.writeText(location.href); showNotification('Link copiado!'); }
        });
        document.getElementById('carModeDrawerBtn').addEventListener('click', () => {
            document.body.classList.add('car-mode');
            showNotification('🚗 Modo Carro ATIVO');
        });
        document.getElementById('exitCarModeBtn').addEventListener('click', () => {
            document.body.classList.remove('car-mode');
            showNotification('Modo normal');
        });
        document.getElementById('toggleAllSongsBtn').addEventListener('click', toggleAllSongsMode);
        
        // Temas
        const colorOptions = document.querySelectorAll('.color-option');
        function setTheme(themeClass) {
            document.body.className = themeClass;
            localStorage.setItem('radioTheme', themeClass);
            colorOptions.forEach(opt => opt.classList.toggle('active', opt.dataset.theme === themeClass));
        }
        const savedTheme = localStorage.getItem('radioTheme') || 'theme-red';
        setTheme(savedTheme);
        colorOptions.forEach(opt => opt.addEventListener('click', () => setTheme(opt.dataset.theme)));
        
        // Feedback
        const feedbackBtn = document.getElementById('feedbackBtn'), feedbackModal = document.getElementById('feedbackModal');
        let currentRating = 0;
        document.querySelectorAll('.star').forEach(star => {
            star.addEventListener('click', () => {
                currentRating = parseInt(star.dataset.rating);
                document.querySelectorAll('.star').forEach((s,i) => {
                    if(i < currentRating) { s.classList.add('fas','active'); s.classList.remove('far'); }
                    else { s.classList.remove('fas','active'); s.classList.add('far'); }
                });
            });
        });
        feedbackBtn.addEventListener('click', () => feedbackModal.classList.toggle('open'));
        document.getElementById('cancelFeedback').addEventListener('click', () => feedbackModal.classList.remove('open'));
        document.getElementById('sendFeedback').addEventListener('click', () => {
            if(currentRating === 0) { showNotification('⭐ Dê uma nota'); return; }
            let msg = `🎵 Rádio Playlist\n⭐ Nota: ${'★'.repeat(currentRating)}${'☆'.repeat(5-currentRating)}`;
            window.open(`https://wa.me/5512988461978?text=${encodeURIComponent(msg)}`, '_blank');
            feedbackModal.classList.remove('open');
        });
        
        // Media Session
        if ('mediaSession' in navigator) {
            navigator.mediaSession.setActionHandler('play', () => playMusic());
            navigator.mediaSession.setActionHandler('pause', () => pauseMusic());
            navigator.mediaSession.setActionHandler('previoustrack', () => prevTrack());
            navigator.mediaSession.setActionHandler('nexttrack', () => nextTrack());
        }
        
        // Inicialização
        window.addEventListener('load', () => {
            updateFilteredPlaylist();
            const randomIndex = Math.floor(Math.random() * filteredPlaylist.length);
            currentIndex = musicas.findIndex(m => m.id === filteredPlaylist[randomIndex].id);
            loadTrack(currentIndex);
            tapToStart.style.display = 'block';
            tapToStart.addEventListener('click', (e) => { e.stopPropagation(); playMusic(); tapToStart.style.display = 'none'; });
            setInterval(checkGreetingChange, 60000);
            setInterval(rotateMedia, 20000);
            updateGreetingUI();
            changeMainMediaType('video');
            changeExtraMediaType('video');
        });
        
        document.querySelectorAll('.media-type-btn').forEach(btn => {
            btn.addEventListener('click', () => changeMainMediaType(btn.dataset.type));
        });
        document.querySelectorAll('.extra-media-btn').forEach(btn => {
            btn.addEventListener('click', () => changeExtraMediaType(btn.dataset.extraType));
        });
    </script>
</body>
</html>

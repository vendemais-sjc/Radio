<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rádio Playlist • Versão Final</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* ========== RESET E ESTILOS GLOBAIS ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            transition: background-color 0.3s, color 0.3s;
            background-color: var(--bg-primary);
        }

        :root {
            --bg-primary: #0a0c12;
            --bg-secondary: #1e2430;
            --bg-drawer: #141a24;
            --text-primary: #eaeef2;
            --text-secondary: #a0a8b8;
            --border-color: #2f3542;
            --primary-color: #ff4081;
            --control-hover: rgba(255,255,255,0.1);
            --player-card-bg: #0a0c12;
        }

        /* Tema padrão pink */
        body {
            --bg-primary: #120a0f;
            --bg-secondary: #1e1a1d;
            --bg-drawer: #1a1217;
            --text-primary: #f5e6f0;
            --text-secondary: #c0a8b8;
            --border-color: #442b38;
            --primary-color: #ff4081;
        }

        .app {
            max-width: 420px;
            width: 100%;
            background: var(--bg-primary);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* SPLASH SCREEN */
        #splash {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.5s ease;
            pointer-events: none;
        }
        #splash.hidden {
            opacity: 0;
        }
        #splash.hidden.display-none {
            display: none;
        }
        .splash-content {
            text-align: center;
            color: #fff;
        }
        .splash-content i {
            font-size: 4rem;
            color: var(--primary-color);
            margin-bottom: 1rem;
            animation: pulse 1.5s infinite;
        }
        .splash-content h1 {
            font-size: 1.8rem;
            letter-spacing: 2px;
        }
        .splash-content p {
            font-size: 1rem;
            opacity: 0.8;
            margin-top: 0.5rem;
        }

        /* MENSAGEM PARA TOQUE NO MOBILE */
        #tap-to-start {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--primary-color);
            color: white;
            padding: 12px 24px;
            border-radius: 40px;
            font-weight: bold;
            z-index: 10000;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            transition: opacity 0.5s;
            pointer-events: none;
        }
        #tap-to-start.hidden {
            opacity: 0;
        }

        @keyframes pulse {
            0% { opacity: 0.6; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.1); }
            100% { opacity: 0.6; transform: scale(1); }
        }

        .top-bar {
            background: #000;
            border-top: 3px solid var(--primary-color);
            border-top-left-radius: 15px;
            border-top-right-radius: 15px;
            border-bottom: 1px solid var(--primary-color);
        }
        
        .top-ticker {
            width: 100%;
            overflow: hidden;
            white-space: nowrap;
            background: #000;
            color: #fff;
            font-weight: 800;
            font-size: 1.2rem;
            padding: 12px 16px;
            cursor: pointer;
            border: none;
            border-top-left-radius: 12px;
            border-top-right-radius: 12px;
        }
        
        .top-ticker span {
            display: inline-block;
            padding-left: 100%;
            animation: ticker-scroll 25s linear infinite;
        }
        
        @keyframes ticker-scroll {
            0% { transform: translateX(0); }
            100% { transform: translateX(-100%); }
        }

        .player-card {
            background: var(--player-card-bg);
            border-bottom: 1px solid var(--primary-color);
        }
        .video-container {
            aspect-ratio: 16 / 9;
            background: #10141c;
            position: relative;
            border-bottom: 1px solid var(--primary-color);
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .video-menu-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0,0,0,0.6);
            color: white;
            border: none;
            border-radius: 50%;
            width: 44px;
            height: 44px;
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 20;
        }
        .track-info {
            padding: 16px 16px 8px;
            text-align: center;
        }
        .track-info h2 {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--primary-color);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .track-info p {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-top: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .progress-area {
            padding: 0 16px 8px;
        }
        .progress-time {
            display: flex;
            justify-content: space-between;
            font-size: 0.7rem;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }
        /* BARRA DE PROGRESSO FINA */
        .progress-bar {
            height: 4px;
            background: var(--border-color);
            cursor: pointer;
            overflow: hidden;
            border-radius: 2px;
        }
        .progress-fill {
            height: 100%;
            background: var(--primary-color);
            width: 0%;
        }
        .controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            padding: 8px 16px 16px;
        }
        .control-btn {
            background: none;
            border: none;
            color: var(--text-primary);
            font-size: 1.8rem;
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .play-btn {
            font-size: 2.4rem;
            color: var(--primary-color);
        }
        .volume-area {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 0 16px 16px;
        }
        .volume-icon {
            background: none;
            border: none;
            color: var(--text-primary);
            font-size: 1.2rem;
            width: 36px;
            height: 36px;
            cursor: pointer;
        }
        /* BARRA DE VOLUME FINA */
        .volume-slider {
            flex: 1;
            height: 4px;
            background: var(--border-color);
            -webkit-appearance: none;
            border-radius: 2px;
        }
        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 12px;
            height: 12px;
            background: white;
            border: 2px solid var(--primary-color);
            border-radius: 50%;
            cursor: pointer;
        }
        .volume-percent {
            font-size: 0.8rem;
            width: 40px;
            text-align: right;
            color: var(--text-secondary);
        }

        .extra-video-container {
            flex: 1;
            background: #000;
            border-top: 1px solid var(--primary-color);
        }
        .extra-video-container video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .drawer {
            position: fixed;
            top: 0;
            left: 0;
            width: 280px;
            height: 100vh;
            background: var(--bg-drawer);
            box-shadow: 4px 0 20px rgba(0,0,0,0.8);
            transform: translateX(-100%);
            transition: transform 0.3s ease;
            z-index: 2000;
            padding: 20px;
            overflow-y: auto;
            border-right: 1px solid var(--border-color);
        }
        .drawer.open {
            transform: translateX(0);
        }
        .drawer-header {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 30px;
        }
        .close-drawer {
            background: none;
            border: none;
            color: var(--text-primary);
            font-size: 1.8rem;
            cursor: pointer;
            padding: 4px;
        }
        .drawer-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            z-index: 1999;
            display: none;
        }
        .drawer-overlay.active {
            display: block;
        }

        .notification {
            position: fixed;
            bottom: 16px;
            left: 16px;
            right: 16px;
            background: var(--bg-drawer);
            color: var(--text-primary);
            padding: 12px 20px;
            box-shadow: 0 8px 20px black;
            z-index: 3000;
            transform: translateY(100px);
            transition: transform 0.3s;
            border-left: 4px solid var(--primary-color);
            max-width: 380px;
            margin: 0 auto;
            text-align: center;
        }
        .notification.show {
            transform: translateY(0);
        }

        .footer {
            text-align: center;
            padding: 15px 5px;
            font-size: 0.7rem;
            color: var(--text-secondary);
            background: var(--bg-primary);
            border-bottom: 3px solid var(--primary-color);
            border-bottom-left-radius: 15px;
            border-bottom-right-radius: 15px;
            border-top: 1px solid var(--primary-color);
        }
    </style>
</head>
<body>
    <!-- SPLASH SCREEN -->
    <div id="splash">
        <div class="splash-content">
            <i class="fas fa-headphones-alt"></i>
            <h1>Rádio Playlist</h1>
            <p>Carregando...</p>
        </div>
    </div>

    <!-- MENSAGEM PARA TOQUE INICIAL -->
    <div id="tap-to-start" class="hidden">
        <i class="fas fa-hand-point-up"></i> Toque na tela para iniciar
    </div>

    <div class="app">
        <!-- LETREIRO COM ÍCONES ANIMADOS -->
        <div class="top-bar">
            <div class="top-ticker" id="topTicker" title="Clique para editar">
                <span id="topTickerText">
                    <i class="fas fa-headphones-alt fa-spin"></i> RÁDIO PLAYLIST - A MELHOR SELEÇÃO MUSICAL 
                    <i class="fas fa-music fa-beat"></i> - SEM ANÚNCIOS 
                    <i class="fas fa-radio fa-fade"></i> - ATUALIZAÇÃO DIÁRIA 
                    <i class="fas fa-star fa-spin-pulse"></i> - CONTATO 12 98846-1978
                </span>
            </div>
        </div>

        <!-- PLAYER PRINCIPAL -->
        <div class="player-card">
            <div class="video-container">
                <video autoplay loop muted playsinline id="mainVideo">
                    <source src="macaco.mp4" type="video/mp4">
                </video>
                <video autoplay loop muted playsinline id="carVideo" style="display:none;">
                    <source src="sebb.mp4" type="video/mp4">
                </video>
                <button class="video-menu-btn" id="videoMenuBtn"><i class="fas fa-ellipsis-v"></i></button>
            </div>
            <div class="track-info">
                <h2 id="trackTitle">Rádio Playlist</h2>
                <p id="trackArtist">Carregando...</p>
            </div>
            <div class="progress-area">
                <div class="progress-time">
                    <span id="currentTime">0:00</span>
                    <span id="totalTime">0:00</span>
                </div>
                <div class="progress-bar" id="progressBar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
            </div>
            <div class="controls">
                <button class="control-btn" id="prevBtn"><i class="fas fa-step-backward"></i></button>
                <button class="control-btn play-btn" id="playPauseBtn"><i class="fas fa-play"></i></button>
                <button class="control-btn" id="shufflePlayerBtn"><i class="fas fa-random"></i></button>
                <button class="control-btn" id="nextBtn"><i class="fas fa-step-forward"></i></button>
            </div>
            <div class="volume-area">
                <button class="volume-icon" id="volumeIconBtn"><i class="fas fa-volume-up"></i></button>
                <input type="range" class="volume-slider" id="volumeSlider" min="0" max="100" value="80">
                <span class="volume-percent" id="volumePercent">80%</span>
            </div>
        </div>

        <!-- VÍDEO EXTRA -->
        <div class="extra-video-container">
            <video autoplay loop muted playsinline>
                <source src="autoc.mp4" type="video/mp4">
            </video>
        </div>

        <div class="footer">Rádio Playlist © 2025</div>
    </div>

    <!-- DRAWER -->
    <div class="drawer-overlay" id="drawerOverlay"></div>
    <div class="drawer" id="drawer">
        <div class="drawer-header">
            <button class="close-drawer" id="closeDrawer"><i class="fas fa-times"></i></button>
        </div>
        <div class="drawer-content">
            <button class="drawer-item" id="carModeDrawerBtn"><i class="fas fa-car"></i> Modo carro</button>
            <button class="drawer-item" id="fullscreenDrawerBtn"><i class="fas fa-expand"></i> Tela cheia</button>
            <button class="drawer-item" id="shareDrawerBtn"><i class="fas fa-share-alt"></i> Compartilhar</button>
        </div>
    </div>

    <audio id="musicPlayer" preload="auto"></audio>
    <div class="notification" id="notification"><span id="notificationText"></span></div>

    <script>
        (function() {
            // LISTA DE MÚSICAS COM URLs PÚBLICAS (teste)
            const musicas = [
                { title: "SoundHelix 1", artist: "Exemplo", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3", duration: "5:00" },
                { title: "SoundHelix 2", artist: "Exemplo", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3", duration: "5:00" },
                { title: "SoundHelix 3", artist: "Exemplo", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3", duration: "5:00" }
            ];

            let playlist = [...musicas];
            let currentIndex = 0;
            let isPlaying = false;
            let autoPlayAttempted = false;

            const musicPlayer = document.getElementById('musicPlayer');
            const playBtn = document.getElementById('playPauseBtn');
            const progressFill = document.getElementById('progressFill');
            const currentTimeEl = document.getElementById('currentTime');
            const totalTimeEl = document.getElementById('totalTime');
            const trackTitle = document.getElementById('trackTitle');
            const trackArtist = document.getElementById('trackArtist');
            const volumeSlider = document.getElementById('volumeSlider');
            const volumePercent = document.getElementById('volumePercent');
            const notification = document.getElementById('notification');
            const notificationText = document.getElementById('notificationText');
            const splash = document.getElementById('splash');
            const tapToStart = document.getElementById('tap-to-start');

            function showNotification(msg) {
                notificationText.textContent = msg;
                notification.classList.add('show');
                setTimeout(() => notification.classList.remove('show'), 2000);
            }

            function hideSplash() {
                if (!splash) return;
                splash.classList.add('hidden');
                setTimeout(() => splash.classList.add('display-none'), 500);
            }

            function loadTrack(index) {
                if (index >= playlist.length) index = 0;
                if (index < 0) index = playlist.length - 1;
                currentIndex = index;
                const track = playlist[currentIndex];
                musicPlayer.src = track.src;
                musicPlayer.load();
                trackTitle.textContent = track.title;
                trackArtist.textContent = track.artist;
                totalTimeEl.textContent = track.duration;
                progressFill.style.width = '0%';
                currentTimeEl.textContent = '0:00';
            }

            function playMusic() {
                musicPlayer.play().then(() => {
                    isPlaying = true;
                    playBtn.innerHTML = '<i class="fas fa-pause"></i>';
                    hideSplash();
                    if (tapToStart) tapToStart.classList.add('hidden');
                }).catch(e => {
                    console.warn('Autoplay bloqueado:', e);
                    if (tapToStart) tapToStart.classList.remove('hidden');
                });
            }

            function pauseMusic() {
                musicPlayer.pause();
                isPlaying = false;
                playBtn.innerHTML = '<i class="fas fa-play"></i>';
            }

            function togglePlayPause() {
                isPlaying ? pauseMusic() : playMusic();
            }

            function nextTrack() {
                currentIndex = (currentIndex + 1) % playlist.length;
                loadTrack(currentIndex);
                if (isPlaying) playMusic();
            }

            function prevTrack() {
                currentIndex = (currentIndex - 1 + playlist.length) % playlist.length;
                loadTrack(currentIndex);
                if (isPlaying) playMusic();
            }

            // Eventos do player
            musicPlayer.addEventListener('timeupdate', () => {
                if (musicPlayer.duration) {
                    const percent = (musicPlayer.currentTime / musicPlayer.duration) * 100;
                    progressFill.style.width = percent + '%';
                    const m = Math.floor(musicPlayer.currentTime / 60);
                    const s = Math.floor(musicPlayer.currentTime % 60);
                    currentTimeEl.textContent = m + ':' + (s < 10 ? '0' + s : s);
                }
            });

            musicPlayer.addEventListener('ended', nextTrack);

            musicPlayer.addEventListener('error', (e) => {
                console.error('Erro no áudio:', e);
                showNotification('⚠️ Erro na música, pulando...');
                setTimeout(nextTrack, 1000);
            });

            // Controles
            document.getElementById('prevBtn').addEventListener('click', prevTrack);
            document.getElementById('nextBtn').addEventListener('click', nextTrack);
            playBtn.addEventListener('click', togglePlayPause);

            volumeSlider.addEventListener('input', (e) => {
                const vol = e.target.value / 100;
                musicPlayer.volume = vol;
                volumePercent.textContent = e.target.value + '%';
            });

            document.getElementById('volumeIconBtn').addEventListener('click', () => {
                if (musicPlayer.volume > 0) {
                    musicPlayer.volume = 0;
                    volumeSlider.value = 0;
                    volumePercent.textContent = '0%';
                } else {
                    musicPlayer.volume = 0.8;
                    volumeSlider.value = 80;
                    volumePercent.textContent = '80%';
                }
            });

            document.getElementById('progressBar').addEventListener('click', (e) => {
                if (!musicPlayer.duration) return;
                const rect = e.currentTarget.getBoundingClientRect();
                const x = e.clientX - rect.left;
                musicPlayer.currentTime = (x / rect.width) * musicPlayer.duration;
            });

            // Drawer
            const drawer = document.getElementById('drawer');
            const drawerOverlay = document.getElementById('drawerOverlay');
            document.getElementById('videoMenuBtn').addEventListener('click', () => {
                drawer.classList.add('open');
                drawerOverlay.classList.add('active');
            });
            document.getElementById('closeDrawer').addEventListener('click', () => {
                drawer.classList.remove('open');
                drawerOverlay.classList.remove('active');
            });
            drawerOverlay.addEventListener('click', () => {
                drawer.classList.remove('open');
                drawerOverlay.classList.remove('active');
            });

            // Fullscreen
            document.getElementById('fullscreenDrawerBtn').addEventListener('click', () => {
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen();
                } else {
                    document.exitFullscreen();
                }
            });

            // Compartilhar
            document.getElementById('shareDrawerBtn').addEventListener('click', () => {
                if (navigator.share) {
                    navigator.share({ title: 'Rádio Playlist', url: location.href }).catch(() => {});
                } else {
                    navigator.clipboard.writeText(location.href);
                    showNotification('📋 Link copiado!');
                }
            });

            // Modo carro (simplificado)
            document.getElementById('carModeDrawerBtn').addEventListener('click', () => {
                document.body.classList.toggle('car-mode');
                showNotification('🚗 Modo carro ' + (document.body.classList.contains('car-mode') ? 'ativado' : 'desativado'));
            });

            // Inicialização
            window.addEventListener('load', () => {
                musicPlayer.volume = 0.8;
                volumeSlider.value = 80;
                loadTrack(0);

                // Tenta autoplay
                const attemptPlay = () => {
                    if (!autoPlayAttempted) {
                        autoPlayAttempted = true;
                        playMusic();
                    }
                };
                attemptPlay();

                // Fallback: esconde splash após 3 segundos
                setTimeout(hideSplash, 3000);

                // Se falhou, ao tocar na tela tenta de novo
                document.addEventListener('touchstart', () => {
                    if (!isPlaying && musicPlayer.paused) {
                        playMusic();
                    }
                }, { once: true });
                document.addEventListener('click', () => {
                    if (!isPlaying && musicPlayer.paused) {
                        playMusic();
                    }
                }, { once: true });
            });
        })();
    </script>
</body>
</html>

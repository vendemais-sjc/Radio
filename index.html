<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rádio Playlist • Player Musical</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            background-color: #000;
            color: #fff;
        }

        /* Tema vermelho (padrão) */
        :root {
            --primary: #e63946;
            --primary-light: #ff6b7a;
            --bg: #000;
            --bg-secondary: #0a0a0a;
            --text: #fff;
            --text-secondary: #ccc;
            --border: #333;
        }

        .app {
            max-width: 420px;
            width: 100%;
            background: var(--bg);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            position: relative;
        }

        /* TOPO */
        .top-bar {
            background: var(--bg);
            border-top: 3px solid var(--primary);
            border-bottom: 1px solid var(--primary);
            padding: 15px;
            text-align: center;
            font-weight: bold;
            font-size: 1.2rem;
        }

        .top-bar i {
            color: var(--primary);
            margin-right: 8px;
        }

        /* PLAYER */
        .player-card {
            padding: 15px;
        }

        .video-container {
            aspect-ratio: 16 / 9;
            background: #111;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--border);
            margin-bottom: 15px;
        }

        .video-placeholder {
            text-align: center;
        }

        .video-placeholder i {
            font-size: 4rem;
            color: var(--primary);
            margin-bottom: 10px;
        }

        .video-placeholder p {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        /* LETREIRO */
        .track-info {
            background: #111;
            padding: 20px;
            border-radius: 8px;
            border-left: 4px solid var(--primary);
            margin-bottom: 20px;
            text-align: center;
            min-height: 100px;
        }

        #musicTicker {
            font-size: 1.2rem;
            color: var(--primary);
            font-weight: bold;
            line-height: 1.5;
            margin-bottom: 10px;
        }

        #trackArtist {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        /* PROGRESSO */
        .progress-area {
            margin-bottom: 15px;
        }

        .progress-time {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-bottom: 5px;
        }

        .progress-bar {
            height: 4px;
            background: var(--border);
            border-radius: 2px;
            cursor: pointer;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: var(--primary);
            width: 0%;
            transition: width 0.1s linear;
        }

        /* CONTROLES */
        .controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 30px;
            margin: 20px 0;
        }

        .control-btn {
            background: none;
            border: none;
            color: var(--text);
            font-size: 2rem;
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .control-btn:active {
            transform: scale(0.9);
        }

        .play-btn {
            color: var(--primary) !important;
            font-size: 2.8rem !important;
        }

        /* VOLUME */
        .volume-area {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .volume-icon {
            background: none;
            border: none;
            color: var(--text);
            font-size: 1.2rem;
            width: 35px;
            height: 35px;
            cursor: pointer;
        }

        .volume-slider {
            flex: 1;
            height: 4px;
            background: var(--border);
            -webkit-appearance: none;
            border-radius: 2px;
        }

        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 12px;
            height: 12px;
            background: var(--text);
            border: 2px solid var(--primary);
            border-radius: 50%;
            cursor: pointer;
        }

        .volume-percent {
            font-size: 0.8rem;
            color: var(--text-secondary);
            min-width: 40px;
            text-align: right;
        }

        /* VÍDEO EXTRA */
        .extra-video-container {
            background: #111;
            border-top: 1px solid var(--primary);
            cursor: pointer;
            position: relative;
            height: 100px;
            margin-top: 10px;
            border-radius: 8px;
            overflow: hidden;
        }

        .extra-video-container video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: none;
        }

        .extra-overlay {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background: rgba(0,0,0,0.7);
            color: var(--text);
            padding: 5px 12px;
            border-radius: 20px;
            border-left: 3px solid var(--primary);
            font-size: 0.9rem;
        }

        .extra-timer {
            position: absolute;
            bottom: 10px;
            right: 10px;
            background: rgba(0,0,0,0.7);
            color: var(--text);
            padding: 5px 12px;
            border-radius: 20px;
            border-left: 3px solid var(--primary);
            font-size: 0.9rem;
        }

        /* DRAWER */
        .drawer {
            position: fixed;
            top: 0;
            left: 0;
            width: 280px;
            height: 100vh;
            background: #000;
            box-shadow: 4px 0 20px rgba(0,0,0,0.8);
            transform: translateX(-100%);
            transition: transform 0.3s ease;
            z-index: 2000;
            padding: 20px;
            overflow-y: auto;
            border-right: 1px solid var(--border);
        }

        .drawer.open {
            transform: translateX(0);
        }

        .drawer-header {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 30px;
        }

        .close-drawer {
            background: none;
            border: none;
            color: var(--text);
            font-size: 1.8rem;
            cursor: pointer;
        }

        .drawer-item {
            background: none;
            border: none;
            color: var(--text);
            font-size: 1rem;
            padding: 15px;
            width: 100%;
            text-align: left;
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            border-radius: 8px;
        }

        .drawer-item i {
            width: 24px;
            color: var(--primary);
        }

        .drawer-item:active {
            background: #1a1a1a;
        }

        .drawer-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.8);
            z-index: 1999;
            display: none;
        }

        .drawer-overlay.active {
            display: block;
        }

        /* SELETOR DE CORES */
        .color-picker {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 20px 0;
            padding: 15px 0;
            border-top: 1px solid var(--border);
            border-bottom: 1px solid var(--border);
        }

        .color-option {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid transparent;
        }

        .color-option.active {
            border-color: #fff;
            box-shadow: 0 0 10px currentColor;
        }

        .color-option.red { background: #e63946; }
        .color-option.blue { background: #00a8ff; }
        .color-option.green { background: #00ff88; }
        .color-option.purple { background: #aa44ff; }

        /* PAINEL DE ANÚNCIOS */
        .ad-panel {
            background: #111;
            border-radius: 8px;
            padding: 15px;
            margin: 20px 0;
            border: 1px solid var(--border);
        }

        .ad-panel h4 {
            color: var(--primary);
            margin-bottom: 10px;
            font-size: 0.9rem;
        }

        .ad-timer {
            font-size: 2rem;
            font-weight: bold;
            text-align: center;
            color: var(--primary);
        }

        .ad-status {
            font-size: 0.8rem;
            text-align: center;
            color: var(--text-secondary);
            margin: 5px 0;
        }

        .ad-buttons {
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        .ad-btn {
            background: none;
            border: 1px solid var(--border);
            color: var(--text);
            padding: 5px 15px;
            border-radius: 15px;
            cursor: pointer;
            font-size: 0.8rem;
        }

        .ad-btn:active {
            background: var(--primary);
        }

        /* FILTRO DE FAVORITOS */
        .filter-fav {
            display: flex;
            gap: 10px;
            margin: 15px 0;
        }

        .filter-fav button {
            background: none;
            border: 1px solid var(--border);
            color: var(--text);
            padding: 5px 15px;
            border-radius: 15px;
            cursor: pointer;
            font-size: 0.9rem;
            flex: 1;
        }

        .filter-fav button.active {
            background: var(--primary);
            border-color: var(--primary);
        }

        /* PLAYLIST */
        .playlist-container {
            max-height: 300px;
            overflow-y: auto;
        }

        .playlist-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 5px;
            background: #111;
            border: 1px solid var(--border);
            cursor: pointer;
        }

        .playlist-item:active {
            background: #1a1a1a;
        }

        .playlist-item.playing {
            border-left: 3px solid var(--primary);
            background: #1a1a1a;
        }

        .playlist-info {
            flex: 1;
        }

        .playlist-title {
            font-size: 0.95rem;
            color: var(--text);
            margin-bottom: 4px;
        }

        .playlist-artist {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .fav-btn {
            background: none;
            border: none;
            color: #666;
            font-size: 1.1rem;
            width: 35px;
            height: 35px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .fav-btn.active {
            color: var(--primary);
        }

        /* NOTIFICAÇÃO */
        .notification {
            position: fixed;
            bottom: 20px;
            left: 20px;
            right: 20px;
            background: #111;
            color: var(--text);
            padding: 12px 20px;
            border-left: 4px solid var(--primary);
            border-radius: 8px;
            z-index: 3000;
            transform: translateY(100px);
            transition: transform 0.3s;
            max-width: 380px;
            margin: 0 auto;
            text-align: center;
            border: 1px solid var(--border);
        }

        .notification.show {
            transform: translateY(0);
        }

        /* RODAPÉ */
        .footer {
            text-align: center;
            padding: 20px;
            color: var(--text-secondary);
            font-size: 0.8rem;
            border-top: 1px solid var(--border);
            margin-top: auto;
        }

        /* SPLASH */
        #splash {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.5s ease;
            pointer-events: none;
        }

        #splash.hidden {
            opacity: 0;
        }

        .splash-content {
            text-align: center;
        }

        .splash-content i {
            font-size: 4rem;
            color: var(--primary);
            margin-bottom: 1rem;
            animation: pulse 1.5s infinite;
        }

        .splash-content h1 {
            font-size: 1.8rem;
            letter-spacing: 2px;
        }

        .splash-content p {
            color: var(--text-secondary);
            margin-top: 0.5rem;
        }

        @keyframes pulse {
            0% { opacity: 0.6; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.1); }
            100% { opacity: 0.6; transform: scale(1); }
        }

        /* TOQUE INICIAL */
        #tap-to-start {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.9);
            color: var(--text);
            padding: 12px 24px;
            border-radius: 30px;
            border: 1px solid var(--primary);
            z-index: 10000;
            text-align: center;
            backdrop-filter: blur(2px);
            transition: opacity 0.3s;
        }

        #tap-to-start.hidden {
            opacity: 0;
            pointer-events: none;
        }

        /* MODO CARRO */
        body.car-mode .top-bar,
        body.car-mode .extra-video-container {
            display: none !important;
        }

        body.car-mode .player-card {
            border: 2px solid var(--primary);
            border-radius: 8px;
        }
    </style>
</head>

            <!-- CONTROLES -->

                <button class="control-btn" id="nextBtn"><i class="fas fa-step-forward"></i></button>
            </div>

            <!-- VOLUME -->
            <div class="volume-area">
                <button class="volume-icon" id="volumeIconBtn"><i class="fas fa-volume-up"></i></button>

        </div>

        <!-- RODAPÉ -->
        <div class="footer">
            Rádio Playlist © 2024 - Roger Mendes
        </div>

    <!-- DRAWER -->
    <div class="drawer-overlay" id="drawerOverlay"></div>
    <div class="drawer" id="drawer">

            <button class="close-drawer" id="closeDrawer"><i class="fas fa-times"></i></button>
        </div>
        <div class="drawer-content">

            <button class="drawer-item" id="carModeDrawerBtn"><i class="fas fa-car"></i> Modo carro</button>

            <!-- CORES -->
            <div class="color-picker">
                <div class="color-option red active" data-theme="red" title="Vermelho"></div>
                <div class="color-option blue" data-theme="blue" title="Azul"></div>
                <div class="color-option green" data-theme="green" title="Verde"></div>
                <div class="color-option purple" data-theme="purple" title="Roxo"></div>
            </div>

            <!-- ANÚNCIOS -->
            <div class="ad-panel">
                <h4><i class="fas fa-microphone-alt"></i> Próximo anúncio</h4>
                <div class="ad-timer" id="adTimer">20</div>
                <div class="ad-status" id="adStatus"><i class="fas fa-compact-disc fa-spin"></i> Aguardando...</div>
                <div class="ad-buttons">
                    <button class="ad-btn" id="toggleAdsBtn"><i class="fas fa-toggle-on"></i> Ativo</button>
                    <button class="ad-btn" id="testAdBtn">Testar</button>
                    <button class="ad-btn" id="skipAdBtn" style="display:none;">Pular</button>
                </div>
            </div>

            <!-- FILTROS -->
            <div class="filter-fav">
                <button id="filterFavBtn" class="active">Todas</button>
                <button id="showFavBtn">❤️ Favoritas</button>
            </div>

            <!-- PLAYLIST -->
            <div class="playlist-container" id="playlistContainer"></div>
        </div>
    </div>

    <!-- AUDIO -->
    <audio id="musicPlayer" preload="auto"></audio>
    <audio id="adPlayer" preload="auto"></audio>

    <!-- NOTIFICAÇÃO -->
    <div class="notification" id="notification">

                            <div class="playlist-info">
                                <div class="playlist-title">${musica.title}</div>
                                <div class="playlist-artist">${musica.artist}</div>
                            </div>
                            <button class="fav-btn ${musica.favorite ? 'active' : ''}" onclick="event.stopPropagation(); toggleFavorite(${musica.id})">
                                <i class="fas fa-heart"></i>
                            </button>
                        </div>
                    `;
                });
                playlistContainer.innerHTML = html || '<div style="text-align:center; padding:20px;">Nenhuma música favorita</div>';
            }

            window.selectSong = function(id) {
                const index = playlist.findIndex(m => m.id === id);
                if (index !== -1) {
                    currentIndex = index;
                    loadTrack(currentIndex);
                    if (isPlaying) playMusic();
                    closeDrawer();
                    showNotification(`🎵 ${playlist[index].title}`);
                }
            };

            window.toggleFavorite = function(id) {
                const musica = playlist.find(m => m.id === id);
                if (musica) {
                    musica.favorite = !musica.favorite;
                    renderPlaylist();
                    showNotification(musica.favorite ? '❤️ Adicionado' : '💔 Removido');
                }
            };

            function updateAdTimer() {
                if (!adsEnabled) {
                    adTimerEl.textContent = 'OFF';
                    return;
                }
                const songsUntilAd = CONFIG.adsInterval - (musicPlayedCount % CONFIG.adsInterval);
                adTimerEl.textContent = songsUntilAd === CONFIG.adsInterval ? 0 : songsUntilAd;
            }

            function playAd() {
                if (!adsEnabled || isAdPlaying) return;
                isAdPlaying = true;
                adStatus.innerHTML = '<i class="fas fa-volume-up"></i> Tocando anúncio...';
                skipAdBtn.style.display = 'inline-block';
                showNotification('📢 Anúncio de áudio');
                
                setTimeout(() => {
                    isAdPlaying = false;
                    adStatus.innerHTML = '<i class="fas fa-compact-disc fa-spin"></i> Aguardando...';
                    skipAdBtn.style.display = 'none';
                    if (isPlaying) musicPlayer.play();
                }, 3000);
            }

            function testAd() {
                playAd();
            }

            function skipAd() {
                if (isAdPlaying) {
                    isAdPlaying = false;
                    adStatus.innerHTML = '<i class="fas fa-compact-disc fa-spin"></i> Aguardando...';
                    skipAdBtn.style.display = 'none';
                    if (isPlaying) musicPlayer.play();
                    showNotification('⏭️ Anúncio pulado');
                }
            }

            function toggleAds() {
                adsEnabled = !adsEnabled;
                toggleAdsBtn.innerHTML = adsEnabled ? '<i class="fas fa-toggle-on"></i> Ativo' : '<i class="fas fa-toggle-off"></i> Inativo';
                updateAdTimer();
            }

            function setTheme(themeClass) {
                const cores = {
                    red: '#e63946',
                    blue: '#00a8ff',
                    green: '#00ff88',
                    purple: '#aa44ff'
                };
                document.documentElement.style.setProperty('--primary', cores[themeClass]);
                colorOptions.forEach(opt => opt.classList.toggle('active', opt.dataset.theme === themeClass));
                localStorage.setItem('radioTheme', themeClass);
            }

            function iniciarVideoUnico() {
                extraVideo.src = videosExtra[0].src;
                extraVideo.play().catch(() => {});
                extraOverlay.innerHTML = `<i class="fas fa-ad"></i> ${videosExtra[0].nome}`;
                
                timerInterval = setInterval(() => {
                    if (tempoRestante > 0) {
                        tempoRestante--;
                        const minutos = Math.floor(tempoRestante / 60);
                        const segundos = tempoRestante % 60;
                        extraTimer.textContent = `${minutos}:${segundos < 10 ? '0' + segundos : segundos}`;
                    }
                }, 1000);
                
                videoInterval = setInterval(() => {
                    videoIndex = (videoIndex + 1) % videosExtra.length;
                    extraVideo.src = videosExtra[videoIndex].src;
                    extraVideo.play().catch(() => {});
                    extraOverlay.innerHTML = `<i class="fas fa-ad"></i> ${videosExtra[videoIndex].nome}`;
                    tempoRestante = 60;
                }, 60000);
            }

            function openDrawer() {
                drawer.classList.add('open');
                drawerOverlay.classList.add('active');
                renderPlaylist();
            }
            
            function closeDrawer() {
                drawer.classList.remove('open');
                drawerOverlay.classList.remove('active');
            }

            // ==================== EVENT LISTENERS ====================
            playBtn.addEventListener('click', togglePlayPause);
            prevBtn.addEventListener('click', prevTrack);
            nextBtn.addEventListener('click', nextTrack);

            volumeSlider.addEventListener('input', (e) => {
                const vol = e.target.value / 100;
                musicPlayer.volume = vol;
                volumePercent.textContent = e.target.value + '%';
                volumeIcon.innerHTML = vol == 0 ? '<i class="fas fa-volume-mute"></i>' : '<i class="fas fa-volume-up"></i>';
            });

            volumeIcon.addEventListener('click', () => {
                if (musicPlayer.volume > 0) {
                    musicPlayer.volume = 0;
                    volumeSlider.value = 0;
                    volumePercent.textContent = '0%';
                    volumeIcon.innerHTML = '<i class="fas fa-volume-mute"></i>';
                } else {
                    musicPlayer.volume = 0.8;
                    volumeSlider.value = 80;
                    volumePercent.textContent = '80%';
                    volumeIcon.innerHTML = '<i class="fas fa-volume-up"></i>';
                }
            });

            document.getElementById('progressBar').addEventListener('click', (e) => {
                if (!musicPlayer.duration) return;
                const rect = e.currentTarget.getBoundingClientRect();
                const x = e.clientX - rect.left;
                musicPlayer.currentTime = (x / rect.width) * musicPlayer.duration;
            });

            musicPlayer.addEventListener('timeupdate', () => {
                if (musicPlayer.duration) {
                    const percent = (musicPlayer.currentTime / musicPlayer.duration) * 100;
                    progressFill.style.width = percent + '%';
                    const m = Math.floor(musicPlayer.currentTime / 60);
                    const s = Math.floor(musicPlayer.currentTime % 60);
                    currentTimeEl.textContent = m + ':' + (s < 10 ? '0' + s : s);
                }
            });

            musicPlayer.addEventListener('ended', nextTrack);

            document.getElementById('videoMenuBtn').addEventListener('click', openDrawer);
            closeDrawer.addEventListener('click', closeDrawer);
            drawerOverlay.addEventListener('click', closeDrawer);

            filterFavBtn.addEventListener('click', () => {
                showingFavorites = false;
                filterFavBtn.classList.add('active');
                showFavBtn.classList.remove('active');
                renderPlaylist();
            });
            
            showFavBtn.addEventListener('click', () => {
                showingFavorites = true;
                showFavBtn.classList.add('active');
                filterFavBtn.classList.remove('active');
                renderPlaylist();
            });

            document.getElementById('fullscreenDrawerBtn').addEventListener('click', () => {
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen();
                } else {
                    document.exitFullscreen();
                }
            });

            document.getElementById('shareDrawerBtn').addEventListener('click', () => {
                if (navigator.share) {
                    navigator.share({ title: 'Rádio Playlist', url: location.href });
                } else {
                    navigator.clipboard.writeText(location.href);
                    showNotification('📋 Link copiado!');
                }
            });

            document.getElementById('carModeDrawerBtn').addEventListener('click', () => {
                body.classList.toggle('car-mode');
                showNotification(body.classList.contains('car-mode') ? '🚗 Modo carro ativado' : '🚗 Modo carro desativado');
            });

            toggleAdsBtn.addEventListener('click', toggleAds);
            testAdBtn.addEventListener('click', testAd);
            skipAdBtn.addEventListener('click', skipAd);

            if (extraContainer) {
                extraContainer.addEventListener('click', () => {
                    showNotification('🔗 Propaganda');
                });
            }

            colorOptions.forEach(opt => opt.addEventListener('click', () => setTheme(opt.dataset.theme)));

            // ==================== INICIALIZAÇÃO ====================
            window.addEventListener('load', () => {
                musicPlayer.volume = CONFIG.defaultVolume / 100;
                loadTrack(0);
                
                iniciarVideoUnico();
                
                setTimeout(() => {
                    splash.classList.add('hidden');
                }, 2000);

                const startPlayer = () => {
                    if (!isPlaying) playMusic();
                    tapToStart.classList.add('hidden');
                };

                document.addEventListener('touchstart', startPlayer, { once: true });
                document.addEventListener('click', startPlayer, { once: true });

                updateAdTimer();
                renderPlaylist();

                const savedTheme = localStorage.getItem('radioTheme') || 'red';
                setTheme(savedTheme);
            });

            window.addEventListener('beforeunload', () => {
                if (timerInterval) clearInterval(timerInterval);
                if (videoInterval) clearInterval(videoInterval);
            });
        })();
    </script>
</body>
</html>

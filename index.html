<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Sistema de Vídeos e Músicas para TV</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #000;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Container principal */
        .video-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
            z-index: 1;
        }

        /* Estilo dos players de vídeo */
        .video-player {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: opacity 0.8s ease-in-out;
            background: #000;
        }

        .video-player.active {
            opacity: 1;
            z-index: 2;
            visibility: visible;
        }

        .video-player.inactive {
            opacity: 0;
            z-index: 1;
            visibility: visible;
        }

        /* Player de áudio (escondido) */
        .audio-player {
            position: fixed;
            bottom: -100px;
            left: -100px;
            width: 1px;
            height: 1px;
            opacity: 0;
            pointer-events: none;
            z-index: -1;
        }

        /* Informações do conteúdo atual */
        .content-info {
            position: fixed;
            bottom: 30px;
            left: 30px;
            color: #fff;
            background: rgba(0, 0, 0, 0.85);
            padding: 15px 25px;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 500;
            z-index: 100;
            font-family: monospace;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            pointer-events: none;
            letter-spacing: 1px;
            min-width: 280px;
        }

        .content-info .title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .content-info .subtitle {
            font-size: 14px;
            opacity: 0.8;
            margin-top: 5px;
        }

        .content-info .music-icon {
            display: inline-block;
            margin-right: 8px;
            animation: pulse 1s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }

        /* Indicador de carregamento */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 200;
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            gap: 20px;
        }

        .spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top-color: #fff;
            border-right-color: #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        .loading-text {
            color: #fff;
            font-size: 18px;
            font-family: monospace;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Debug panel */
        .debug-panel {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.85);
            color: #0f0;
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 11px;
            font-family: monospace;
            z-index: 100;
            border: 1px solid rgba(0, 255, 0, 0.3);
            backdrop-filter: blur(5px);
            pointer-events: none;
            max-width: 320px;
            text-align: right;
            line-height: 1.5;
        }

        /* Status indicators */
        .status-indicators {
            position: fixed;
            top: 20px;
            left: 20px;
            display: flex;
            gap: 10px;
            z-index: 100;
        }

        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #0f0;
            box-shadow: 0 0 8px currentColor;
        }

        .status-dot.video {
            background: #00f;
            box-shadow: 0 0 8px #00f;
        }

        .status-dot.audio {
            background: #f0f;
            box-shadow: 0 0 8px #f0f;
        }

        .status-dot.active {
            animation: blink 1.5s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.8); }
        }

        /* Responsividade */
        @media (max-width: 768px) {
            .content-info {
                bottom: 20px;
                left: 20px;
                padding: 12px 18px;
                font-size: 14px;
                min-width: 220px;
            }
            
            .content-info .title {
                font-size: 16px;
            }
            
            .debug-panel {
                font-size: 9px;
                top: 10px;
                right: 10px;
                padding: 6px 10px;
                max-width: 260px;
            }
        }
    </style>
</head>

        // ==================== CONFIGURAÇÕES ====================
        const CONFIG = {
            FADE_DURATION: 800,              // Duração do fade entre vídeos (ms)
            PRELOAD_NEXT: true,              // Pré-carregar próximo vídeo
            MAX_RETRIES: 3,                  // Tentativas máximas em caso de erro
            RETRY_DELAY: 1000,               // Delay entre tentativas (ms)
            PLAYBACK_CHECK_INTERVAL: 3000,   // Verificar playback a cada X ms
            SHOW_DEBUG: true,                // Mostrar painel de debug
            AUTO_PLAY_DELAY: 100,            // Delay inicial para autoplay (ms)
            MUSIC_VOLUME: 0.5,               // Volume das músicas (0 a 1)
            SYNC_MUSIC_WITH_VIDEO: true      // Sincronizar música com vídeo (reiniciar música a cada vídeo)
        };

        // Variáveis globais
        let videoPlayers = [];
        let audioElement = null;
        let currentVideoIndex = 0;
        let currentMusicIndex = 0;
        let activePlayerIndex = 0;
        let isTransitioning = false;
        let retryCount = 0;
        let playbackCheckInterval = null;
        let preloadTimeout = null;
        let isMusicPlaying = false;

        // Detecta tipo de dispositivo
        const userAgent = navigator.userAgent;
        const isTV = /SmartTV|Tizen|WebOS|AppleTV|CrKey|Xbox|PlayStation|BRAVIA|SMART-TV|LG TV|Samsung|GoogleTV|ANDROID TV/i.test(userAgent);
        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(userAgent);
        const isSamsung = /Tizen|Samsung/i.test(userAgent);
        const isLG = /WebOS|LG TV/i.test(userAgent);

        // Ajusta configurações para TV
        if (isTV) {
            CONFIG.FADE_DURATION = 1000;
            CONFIG.PLAYBACK_CHECK_INTERVAL = 5000;
            CONFIG.AUTO_PLAY_DELAY = 200;
            CONFIG.MUSIC_VOLUME = 0.4; // Volume um pouco mais baixo na TV
        }

        // ==================== FUNÇÕES DE UTILIDADE ====================
        
        /**
         * Atualiza o painel de debug
         */
        function updateDebug(message) {
            if (!CONFIG.SHOW_DEBUG) return;
            
            const debugPanel = document.getElementById('debugPanel');
            if (debugPanel) {
                const time = new Date().toLocaleTimeString('pt-BR');
                const deviceType = isTV ? '📺 TV' : (isMobile ? '📱 Mobile' : '💻 PC');
                debugPanel.innerHTML = `${deviceType} | ${time}<br>${message}`;
            }
            console.log(`[${new Date().toLocaleTimeString()}] ${message}`);
        }

        /**
         * Mostra/oculta loading
         */
        function showLoading(show) {
            const loadingOverlay = document.getElementById('loadingOverlay');
            if (loadingOverlay) {
                loadingOverlay.style.display = show ? 'flex' : 'none';
            }
        }

        /**
         * Atualiza informações na tela
         */
        function updateDisplayInfo() {
            const currentMusic = musicasList[currentMusicIndex];
            const currentVideo = videosList[currentVideoIndex];
            
            const musicNameElem = document.getElementById('currentMusicName');
            const videoNameElem = document.getElementById('currentVideoName');
            
            if (musicNameElem) {
                musicNameElem.innerHTML = `${currentMusic.nome} ${currentMusic.artista ? `- ${currentMusic.artista}` : ''}`;
            }
            
            if (videoNameElem) {
                videoNameElem.innerHTML = `${currentVideo.nome} (${currentVideoIndex + 1}/${videosList.length})`;
            }
            
            updateDebug(`🎵 Música: ${currentMusic.nome} | 🎬 Vídeo: ${currentVideo.nome}`);
        }

        /**
         * Atualiza os status indicators
         */
        function updateStatusIndicators(videoPlaying, audioPlaying) {
            const videoDot = document.getElementById('videoStatus');
            const audioDot = document.getElementById('audioStatus');
            
            if (videoDot) {
                videoDot.style.opacity = videoPlaying ? '1' : '0.3';
                if (videoPlaying) videoDot.classList.add('active');
                else videoDot.classList.remove('active');
            }
            
            if (audioDot) {
                audioDot.style.opacity = audioPlaying ? '1' : '0.3';
                if (audioPlaying) audioDot.classList.add('active');
                else audioDot.classList.remove('active');
            }
        }

        // ==================== FUNÇÕES DE ÁUDIO ====================
        
        /**
         * Cria o player de áudio
         */
        function createAudioPlayer() {
            audioElement = document.createElement('audio');
            audioElement.className = 'audio-player';
            audioElement.setAttribute('preload', 'auto');
            audioElement.volume = CONFIG.MUSIC_VOLUME;
            audioElement.loop = false; // Vai tocar uma música por vez
            
            // Eventos de áudio
            audioElement.addEventListener('ended', () => {
                updateDebug(`🎵 Música terminou, próxima...`);
                nextMusic();
            });
            
            audioElement.addEventListener('error', (e) => {
                updateDebug(`❌ Erro na música: ${audioElement.error ? audioElement.error.message : 'desconhecido'}`);
                setTimeout(() => nextMusic(), 3000);
            });
            
            audioElement.addEventListener('playing', () => {
                updateDebug(`🎵 Música reproduzindo: ${musicasList[currentMusicIndex].nome}`);
                updateStatusIndicators(true, true);
                isMusicPlaying = true;
            });
            
            audioElement.addEventListener('pause', () => {
                updateStatusIndicators(true, false);
                isMusicPlaying = false;
            });
            
            document.body.appendChild(audioElement);
            updateDebug(`🎵 Player de áudio criado`);
        }
        
        /**
         * Toca uma música específica
         */
        async function playMusic(index) {
            if (!audioElement) {
                createAudioPlayer();
            }
            
            const music = musicasList[index];
            if (!music) {
                updateDebug(`❌ Música não encontrada no índice ${index}`);
                return false;
            }
            
            updateDebug(`🎵 Tocando música: ${music.nome}`);
            
            try {
                // Se for a mesma música e já está tocando, não faz nada
                if (audioElement.src.includes(music.src) && !audioElement.paused && !audioElement.ended) {
                    return true;
                }
                
                audioElement.src = music.src;
                audioElement.load();
                
                return new Promise((resolve) => {
                    const tryPlay = async () => {
                        try {
                            await audioElement.play();
                            updateDisplayInfo();
                            resolve(true);
                        } catch (error) {
                            updateDebug(`⚠️ Erro ao tocar música: ${error.message}`);
                            if (error.name === 'NotAllowedError') {
                                // Aguarda interação do usuário
                                const playOnInteraction = async () => {
                                    try {
                                        await audioElement.play();
                                        document.removeEventListener('click', playOnInteraction);
                                        document.removeEventListener('touchstart', playOnInteraction);
                                        resolve(true);
                                    } catch (e) {
                                        resolve(false);
                                    }
                                };
                                document.addEventListener('click', playOnInteraction);
                                document.addEventListener('touchstart', playOnInteraction);
                            } else {
                                resolve(false);
                            }
                        }
                    };
                    
                    setTimeout(tryPlay, 500);
                });
            } catch (error) {
                updateDebug(`❌ Erro ao carregar música: ${error.message}`);
                return false;
            }
        }
        
        /**
         * Avança para a próxima música
         */
        function nextMusic() {
            const nextIndex = (currentMusicIndex + 1) % musicasList.length;
            currentMusicIndex = nextIndex;
            playMusic(currentMusicIndex);
        }
        
        /**
         * Reinicia a música atual (usado quando troca de vídeo)
         */
        function restartCurrentMusic() {
            if (CONFIG.SYNC_MUSIC_WITH_VIDEO && audioElement) {
                updateDebug(`🔄 Reiniciando música para sincronizar com vídeo`);
                const currentMusic = musicasList[currentMusicIndex];
                audioElement.src = currentMusic.src;
                audioElement.load();
                setTimeout(() => {
                    audioElement.play().catch(e => updateDebug(`Erro ao reiniciar música: ${e.message}`));
                }, 500);
            }
        }

        // ==================== FUNÇÕES DE VÍDEO ====================
        
        /**
         * Cria os players de vídeo (double buffering)
         */
        function createVideoPlayers() {
            const container = document.getElementById('videoContainer');
            if (!container) {
                console.error('Container não encontrado');
                return false;
            }
            
            container.innerHTML = '';
            
            for (let i = 0; i < 2; i++) {
                const video = document.createElement('video');
                video.id = `videoPlayer${i}`;
                video.className = `video-player ${i === 0 ? 'active' : 'inactive'}`;
                
                // Atributos importantes para TVs e dispositivos móveis
                video.setAttribute('playsinline', '');
                video.setAttribute('webkit-playsinline', '');
                video.setAttribute('x5-playsinline', '');
                video.setAttribute('autoplay', '');
                video.setAttribute('muted', '');
                video.setAttribute('preload', 'auto');
                
                // Event listeners
                video.addEventListener('error', (e) => handleVideoError(e, i));
                video.addEventListener('canplay', () => handleVideoCanPlay(i));
                video.addEventListener('ended', () => handleVideoEnded(i));
                video.addEventListener('playing', () => handleVideoPlaying(i));
                video.addEventListener('waiting', () => handleVideoWaiting(i));
                
                container.appendChild(video);
                videoPlayers.push(video);
            }
            
            updateDebug(`📹 Players de vídeo criados | Modo: ${isTV ? 'TV' : (isMobile ? 'Mobile' : 'Desktop')}`);
            return true;
        }

        /**
         * Trata erros de vídeo
         */
        function handleVideoError(event, playerIndex) {
            const video = event.target;
            updateDebug(`❌ Erro vídeo player ${playerIndex}: ${video.error ? video.error.message : 'desconhecido'}`);
            
            if (retryCount < CONFIG.MAX_RETRIES) {
                retryCount++;
                updateDebug(`🔄 Tentativa ${retryCount}/${CONFIG.MAX_RETRIES}`);
                setTimeout(() => {
                    video.load();
                    video.play().catch(e => updateDebug(`Falha: ${e.message}`));
                }, CONFIG.RETRY_DELAY);
            } else {
                updateDebug(`⚠️ Pulando para próximo vídeo`);
                retryCount = 0;
                nextVideo();
            }
        }

        /**
         * Quando o vídeo está pronto para reproduzir
         */
        function handleVideoCanPlay(playerIndex) {
            updateDebug(`✅ Vídeo player ${playerIndex} pronto`);
            if (playerIndex === activePlayerIndex) {
                showLoading(false);
            }
        }

        /**
         * Quando o vídeo começa a tocar
         */
        function handleVideoPlaying(playerIndex) {
            updateDebug(`▶️ Vídeo player ${playerIndex} reproduzindo`);
            showLoading(false);
            updateStatusIndicators(true, isMusicPlaying);
            
            if (playerIndex === activePlayerIndex) {
                updateDisplayInfo();
            }
        }

        /**
         * Quando o vídeo está em buffer
         */
        function handleVideoWaiting(playerIndex) {
            updateDebug(`⏳ Vídeo player ${playerIndex} em buffer`);
            if (playerIndex === activePlayerIndex) {
                showLoading(true);
                updateStatusIndicators(false, isMusicPlaying);
            }
        }

        /**
         * Quando o vídeo termina
         */
        function handleVideoEnded(playerIndex) {
            updateDebug(`🏁 Vídeo player ${playerIndex} terminou`);
            if (playerIndex === activePlayerIndex && !isTransitioning) {
                nextVideo();
            }
        }

        /**
         * Pré-carrega o próximo vídeo
         */
        function preloadNextVideo() {
            if (!CONFIG.PRELOAD_NEXT) return;
            
            if (preloadTimeout) clearTimeout(preloadTimeout);
            
            preloadTimeout = setTimeout(() => {
                const nextIndex = (currentVideoIndex + 1) % videosList.length;
                const nextVideo = videosList[nextIndex];
                const preloadPlayerIndex = (activePlayerIndex + 1) % 2;
                const preloadPlayer = videoPlayers[preloadPlayerIndex];
                
                if (preloadPlayer && preloadPlayer.src !== nextVideo.src) {
                    updateDebug(`📥 Pré-carregando vídeo: ${nextVideo.nome}`);
                    preloadPlayer.src = nextVideo.src;
                    preloadPlayer.load();
                }
            }, 500);
        }

        /**
         * Reproduz um vídeo específico
         */
        async function playVideo(index, playerIndex) {
            const video = videosList[index];
            const player = videoPlayers[playerIndex];
            
            if (!player || !video) {
                updateDebug(`❌ Player ou vídeo inválido`);
                return false;
            }
            
            updateDebug(`🎬 Reproduzindo vídeo ${video.nome} no player ${playerIndex}`);
            
            if (player.src === video.src && !player.ended) {
                try {
                    await player.play();
                    return true;
                } catch (error) {
                    updateDebug(`Erro ao reproduzir: ${error.message}`);
                }
            }
            
            player.src = video.src;
            player.load();
            
            return new Promise((resolve) => {
                const attemptPlay = async () => {
                    try {
                        await player.play();
                        resolve(true);
                    } catch (error) {
                        updateDebug(`Erro play vídeo: ${error.message}`);
                        if (error.name === 'NotAllowedError') {
                            const playOnInteraction = async () => {
                                try {
                                    await player.play();
                                    document.removeEventListener('click', playOnInteraction);
                                    document.removeEventListener('touchstart', playOnInteraction);
                                    resolve(true);
                                } catch (e) {
                                    resolve(false);
                                }
                            };
                            document.addEventListener('click', playOnInteraction);
                            document.addEventListener('touchstart', playOnInteraction);
                        } else {
                            resolve(false);
                        }
                    }
                };
                
                setTimeout(attemptPlay, CONFIG.AUTO_PLAY_DELAY);
            });
        }

        /**
         * Faz a transição entre vídeos com fade
         */
        async function transitionToVideo(nextIndex) {
            if (isTransitioning) {
                updateDebug(`⏸️ Aguardando transição anterior`);
                return;
            }
            
            isTransitioning = true;
            showLoading(true);
            
            const nextPlayerIndex = (activePlayerIndex + 1) % 2;
            const currentPlayer = videoPlayers[activePlayerIndex];
            const nextPlayer = videoPlayers[nextPlayerIndex];
            
            updateDebug(`🔄 Transição para vídeo: ${videosList[nextIndex].nome}`);
            
            const success = await playVideo(nextIndex, nextPlayerIndex);
            
            if (!success) {
                updateDebug(`❌ Falha ao preparar vídeo`);
                isTransitioning = false;
                showLoading(false);
                setTimeout(() => transitionToVideo(nextIndex), 2000);
                return;
            }
            
            setTimeout(() => {
                currentPlayer.classList.remove('active');
                currentPlayer.classList.add('inactive');
                nextPlayer.classList.remove('inactive');
                nextPlayer.classList.add('active');
                
                setTimeout(() => {
                    currentPlayer.pause();
                    currentPlayer.currentTime = 0;
                    
                    activePlayerIndex = nextPlayerIndex;
                    currentVideoIndex = nextIndex;
                    
                    isTransitioning = false;
                    showLoading(false);
                    
                    updateDebug(`✅ Transição concluída: ${videosList[currentVideoIndex].nome}`);
                    updateDisplayInfo();
                    updateStatusIndicators(true, isMusicPlaying);
                    
                    // Reinicia a música se configurado
                    if (CONFIG.SYNC_MUSIC_WITH_VIDEO) {
                        restartCurrentMusic();
                    }
                    
                    preloadNextVideo();
                }, CONFIG.FADE_DURATION);
            }, 100);
        }

        /**
         * Avança para o próximo vídeo
         */
        function nextVideo() {
            if (isTransitioning) {
                updateDebug(`⏸️ Aguardando transição`);
                return;
            }
            
            const nextIndex = (currentVideoIndex + 1) % videosList.length;
            updateDebug(`⏭️ Avançando para: ${videosList[nextIndex].nome}`);
            transitionToVideo(nextIndex);
        }

        /**
         * Monitora o playback constantemente
         */
        function startPlaybackMonitor() {
            if (playbackCheckInterval) clearInterval(playbackCheckInterval);
            
            playbackCheckInterval = setInterval(() => {
                const activePlayer = videoPlayers[activePlayerIndex];
                
                if (activePlayer && !isTransitioning) {
                    if (activePlayer.paused && !activePlayer.ended && activePlayer.src) {
                        updateDebug(`⚠️ Vídeo pausado, reiniciando...`);
                        activePlayer.play().catch(e => updateDebug(`Erro: ${e.message}`));
                        updateStatusIndicators(false, isMusicPlaying);
                    }
                    
                    if (activePlayer.ended && !isTransitioning) {
                        updateDebug(`🏁 Vídeo terminou (monitor)`);
                        nextVideo();
                    }
                    
                    if (!activePlayer.paused && !activePlayer.ended) {
                        updateStatusIndicators(true, isMusicPlaying);
                    }
                }
                
                // Verifica áudio
                if (audioElement && !isTransitioning) {
                    if (audioElement.paused && !audioElement.ended && audioElement.src) {
                        updateDebug(`⚠️ Música pausada, reiniciando...`);
                        audioElement.play().catch(e => updateDebug(`Erro áudio: ${e.message}`));
                    }
                }
            }, CONFIG.PLAYBACK_CHECK_INTERVAL);
        }

        /**
         * Inicia o sistema completo
         */
        async function initialize() {
            updateDebug(`🚀 Inicializando sistema com vídeos e músicas...`);
            updateDebug(`📺 Dispositivo: ${isTV ? 'Smart TV' : (isMobile ? 'Mobile' : 'Desktop')}`);
            updateDebug(`🎵 Total de músicas: ${musicasList.length}`);
            updateDebug(`🎬 Total de vídeos: ${videosList.length}`);
            
            // Cria players de vídeo
            if (!createVideoPlayers()) {
                updateDebug(`❌ Erro ao criar players de vídeo`);
                return;
            }
            
            // Cria player de áudio
            createAudioPlayer();
            
            await new Promise(resolve => setTimeout(resolve, 200));
            
            // Inicia primeira música
            currentMusicIndex = 0;
            await playMusic(0);
            
            // Inicia primeiro vídeo
            const success = await playVideo(0, 0);
            
            if (success) {
                updateDebug(`✅ Primeiro vídeo iniciado: ${videosList[0].nome}`);
                videoPlayers[0].classList.add('active');
                activePlayerIndex = 0;
                currentVideoIndex = 0;
                
                preloadNextVideo();
                startPlaybackMonitor();
                
                showLoading(false);
                updateDisplayInfo();
                updateStatusIndicators(true, true);
            } else {
                updateDebug(`❌ Falha ao iniciar primeiro vídeo`);
                setTimeout(initialize, 3000);
            }
        }

        // ==================== EVENTOS GLOBAIS ====================
        
        document.addEventListener('DOMContentLoaded', () => {
            updateDebug(`📄 DOM carregado`);
            initialize();
        });
        
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                updateDebug(`👁️ Página oculta`);
            } else {
                updateDebug(`👁️ Página visível`);
                const activePlayer = videoPlayers[activePlayerIndex];
                if (activePlayer && activePlayer.paused && !activePlayer.ended && !isTransitioning) {
                    activePlayer.play().catch(e => updateDebug(`Erro ao retomar vídeo: ${e.message}`));
                }
                if (audioElement && audioElement.paused && !audioElement.ended) {
                    audioElement.play().catch(e => updateDebug(`Erro ao retomar música: ${e.message}`));
                }
            }
        });
        
        // ==================== EXPOSIÇÃO PARA DEBUG ====================
        window.mediaSystem = {
            nextVideo: () => nextVideo(),
            nextMusic: () => nextMusic(),
            current: () => ({
                video: videosList[currentVideoIndex],
                music: musicasList[currentMusicIndex],
                videoIndex: currentVideoIndex,
                musicIndex: currentMusicIndex
            }),
            setMusicVolume: (volume) => {
                if (audioElement) {
                    audioElement.volume = Math.max(0, Math.min(1, volume));
                    updateDebug(`🎵 Volume ajustado para: ${audioElement.volume}`);
                }
            },
            status: () => ({
                videoPlaying: videoPlayers[activePlayerIndex] && !videoPlayers[activePlayerIndex].paused,
                musicPlaying: audioElement && !audioElement.paused,
                isTV,
                isTransitioning
            }),
            list: { videos: videosList, musicas: musicasList }
        };
        
        updateDebug(`✨ Sistema pronto! Use window.mediaSystem no console para controle`);
    </script>

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Clínica Versalis • Sala de Espera</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #000;
        }

        .tv-container {
            position: relative;
            width: 100%;
            height: 100%;
        }

        /* VÍDEOS */
        .video-mp4 {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }

        .video-drive {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            display: none;
        }

        /* Remove TODOS os botões do iframe do Drive */
        .video-drive iframe {
            width: 100%;
            height: 100%;
            pointer-events: none;
            border: none;
        }

        /* RELÓGIO - ÚNICO ELEMENTO NA TELA */
        .clock {
            position: absolute;
            bottom: 20px;
            right: 30px;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(8px);
            padding: 6px 18px;
            border-radius: 40px;
            color: white;
            font-size: 0.9rem;
            z-index: 10;
            font-family: 'Courier New', monospace;
            font-weight: 600;
            letter-spacing: 1px;
            pointer-events: none;
        }

        @media (max-width: 1024px) {
            .clock { bottom: 15px; right: 20px; padding: 5px 14px; font-size: 0.8rem; }
        }
    </style>
</head>
<body>
<div class="tv-container">
    <!-- VÍDEO MP4 LOCAL (bsa.mp4) - INICIAL -->
    <video id="bsaVideo" class="video-mp4" autoplay muted playsinline>
        <source src="bsa.mp4" type="video/mp4">
    </video>
    
    <!-- VÍDEO GOOGLE DRIVE - SEM BOTÕES -->
    <div class="video-drive" id="driveContainer">
        <iframe id="driveFrame" src="https://drive.google.com/file/d/19czRGQGrbT_igU-rPIx3l-qJGH9G1Ago/preview" 
                allow="autoplay; fullscreen" 
                allowfullscreen>
        </iframe>
    </div>

    <!-- RELÓGIO -->
    <div class="clock" id="clock">--:--</div>
</div>

<script>
    // =============================================
    // TELA CHEIA AUTOMÁTICA
    // =============================================
    function entrarTelaCheia() {
        const docEl = document.documentElement;
        if (docEl.requestFullscreen) {
            docEl.requestFullscreen();
        } else if (docEl.webkitRequestFullscreen) {
            docEl.webkitRequestFullscreen();
        } else if (docEl.msRequestFullscreen) {
            docEl.msRequestFullscreen();
        }
    }
    
    // Entrar em tela cheia automaticamente
    entrarTelaCheia();
    
    // =============================================
    // FORÇAR AUTOPLAY DO VÍDEO DO DRIVE
    // =============================================
    function forceDriveAutoplay() {
        const driveFrame = document.getElementById('driveFrame');
        if (driveFrame) {
            const currentSrc = driveFrame.src;
            if (currentSrc && !currentSrc.includes('autoplay=1')) {
                driveFrame.src = currentSrc + (currentSrc.includes('?') ? '&' : '?') + 'autoplay=1';
            }
        }
    }
    
    // =============================================
    // CICLO DE VÍDEOS: bsa.mp4 (15s) → Drive (3min) → volta
    // =============================================
    const TEMPO_VIDEO_BSA = 15;     // 15 segundos
    const TEMPO_ESPERA = 180;       // 3 MINUTOS (180 segundos)
    
    const bsaVideo = document.getElementById('bsaVideo');
    const driveContainer = document.getElementById('driveContainer');
    
    let timeoutAtual = null;
    
    function mostrarVideoBSA() {
        driveContainer.style.display = 'none';
        bsaVideo.style.display = 'block';
        bsaVideo.currentTime = 0;
        bsaVideo.play().catch(e => console.log("bsa:", e));
    }
    
    function mostrarDriveVideo() {
        bsaVideo.pause();
        bsaVideo.style.display = 'none';
        driveContainer.style.display = 'block';
        forceDriveAutoplay();
    }
    
    function executarCiclo() {
        if (timeoutAtual) clearTimeout(timeoutAtual);
        
        // Começa com bsa.mp4
        mostrarVideoBSA();
        
        timeoutAtual = setTimeout(() => {
            // Depois de 15 segundos, troca para Drive
            mostrarDriveVideo();
            
            timeoutAtual = setTimeout(() => {
                // Depois de 3 minutos, volta para bsa.mp4 e repete
                executarCiclo();
            }, TEMPO_ESPERA * 1000);
            
        }, TEMPO_VIDEO_BSA * 1000);
    }
    
    // =============================================
    // RELÓGIO
    // =============================================
    function updateClock() { 
        const now = new Date(); 
        const horas = now.getHours().toString().padStart(2,'0');
        const minutos = now.getMinutes().toString().padStart(2,'0');
        document.getElementById('clock').textContent = `${horas}:${minutos}`; 
    }
    updateClock();
    setInterval(updateClock, 1000);
    
    // =============================================
    // INICIAR SISTEMA
    // =============================================
    setTimeout(() => {
        executarCiclo();
    }, 500);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>MUTV Playlist • Modo TV</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: #000000;
            overflow: hidden;
            position: fixed;
            width: 100%;
            height: 100%;
        }

        /* Temas de cor */
        body.theme-red { --primary-color: #e63946; --primary-dark: #b71c1c; }
        body.theme-lilac { --primary-color: #b380ff; --primary-dark: #7a4db3; }
        body.theme-blue { --primary-color: #00a8ff; --primary-dark: #0077be; }
        body.theme-green { --primary-color: #00ff88; --primary-dark: #00cc6a; }
        body.theme-orange { --primary-color: #ff7700; --primary-dark: #cc5500; }
        body.theme-pink { --primary-color: #ff44aa; --primary-dark: #cc0088; }
        body.theme-purple { --primary-color: #aa44ff; --primary-dark: #7700cc; }
        body.theme-yellow { --primary-color: #ffdd44; --primary-dark: #ccaa00; }
        body.theme-white { --primary-color: #ffffff; --primary-dark: #cccccc; }
        body { --primary-color: #e63946; --primary-dark: #b71c1c; --text-primary: #ffffff; --text-secondary: #cccccc; }

        /* Container principal em modo TV - vídeo ocupa toda a tela */
        .tv-app {
            width: 100%;
            height: 100vh;
            background: #000;
            position: relative;
            overflow: hidden;
        }

        /* Vídeo principal em tela cheia */
        .fullscreen-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }

        /* Overlay com gradiente para melhor legibilidade */
        .overlay-gradient {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 30%;
            background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
            z-index: 2;
            pointer-events: none;
        }

        /* Rodapé com a frase principal */
        .footer-tagline {
            position: absolute;
            bottom: 20px;
            left: 0;
            right: 0;
            text-align: center;
            z-index: 3;
            pointer-events: none;
        }

        .footer-tagline p {
            color: var(--primary-color);
            font-size: 1.2rem;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            letter-spacing: 2px;
            background: rgba(0,0,0,0.5);
            display: inline-block;
            padding: 8px 20px;
            border-radius: 40px;
            backdrop-filter: blur(5px);
            font-family: 'Segoe UI', sans-serif;
        }

        @media (min-width: 768px) {
            .footer-tagline p { font-size: 1.5rem; padding: 12px 30px; }
        }
        @media (min-width: 1200px) {
            .footer-tagline p { font-size: 1.8rem; padding: 15px 40px; }
        }

        /* Barra superior com ticker (letreiro) */
        .top-ticker {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(8px);
            overflow: hidden;
            white-space: nowrap;
            color: #fff;
            font-weight: 800;
            font-size: 1rem;
            padding: 10px 0;
            z-index: 10;
            border-bottom: 1px solid var(--primary-color);
            pointer-events: none;
        }

        .top-ticker span {
            display: inline-block;
            padding-left: 100%;
            animation: ticker-scroll 25s linear infinite;
        }

        @keyframes ticker-scroll {
            0% { transform: translateX(0); }
            100% { transform: translateX(-100%); }
        }

        /* Botões de controle de música - pequenos, transparentes, no canto inferior esquerdo */
        .music-controls {
            position: absolute;
            bottom: 80px;
            left: 15px;
            display: flex;
            gap: 8px;
            z-index: 20;
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(5px);
            padding: 8px 12px;
            border-radius: 50px;
            border: 1px solid rgba(255,255,255,0.2);
            transition: opacity 0.3s;
        }

        .music-controls:hover {
            background: rgba(0,0,0,0.6);
        }

        .tv-control-btn {
            background: rgba(0,0,0,0.5);
            border: none;
            color: rgba(255,255,255,0.8);
            font-size: 1.2rem;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .tv-control-btn:active {
            transform: scale(0.95);
            background: var(--primary-color);
            color: #000;
        }

        .tv-control-btn.play-pause {
            background: var(--primary-color);
            color: #000;
            font-size: 1.1rem;
        }

        /* Informação da música atual - pequena e discreta */
        .current-track-info {
            position: absolute;
            bottom: 80px;
            left: 140px;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(4px);
            padding: 6px 15px;
            border-radius: 30px;
            font-size: 0.7rem;
            color: #fff;
            z-index: 20;
            pointer-events: none;
            border-left: 3px solid var(--primary-color);
            white-space: nowrap;
            max-width: 50%;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        @media (min-width: 768px) {
            .current-track-info { font-size: 0.85rem; bottom: 85px; left: 160px; }
            .tv-control-btn { width: 42px; height: 42px; font-size: 1.3rem; }
        }

        /* Menu lateral (drawer) - igual ao original */
        .drawer {
            position: fixed;
            top: 0;
            left: 0;
            width: 300px;
            height: 100vh;
            background: rgba(0,0,0,0.95);
            backdrop-filter: blur(10px);
            transform: translateX(-100%);
            transition: transform 0.3s ease;
            z-index: 1000;
            padding: 20px;
            overflow-y: auto;
            border-right: 2px solid var(--primary-color);
        }

        .drawer.open {
            transform: translateX(0);
        }

        .drawer-header {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 20px;
        }

        .close-drawer {
            background: none;
            border: none;
            color: var(--text-primary);
            font-size: 1.8rem;
            cursor: pointer;
        }

        .drawer-item {
            background: rgba(255,255,255,0.1);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 12px 14px;
            width: 100%;
            text-align: left;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            border-radius: 8px;
        }

        .mode-toggle-btn {
            background: var(--primary-color);
            color: #000;
            font-weight: bold;
            border: none;
            padding: 10px;
            border-radius: 40px;
            margin: 10px 0;
            width: 100%;
            cursor: pointer;
        }

        .playlist-container {
            margin-top: 15px;
            max-height: 350px;
            overflow-y: auto;
        }

        .playlist-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px;
            border: 1px solid #333;
            border-radius: 30px;
            margin-bottom: 8px;
            cursor: pointer;
            background: rgba(20,20,20,0.8);
        }

        .playlist-item.playing {
            border-color: var(--primary-color);
            background: rgba(var(--primary-color), 0.2);
        }

        .music-number {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--primary-color);
            color: #000;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
        }

        .playlist-info {
            flex: 1;
        }

        .playlist-title {
            font-size: 0.85rem;
            color: var(--text-primary);
        }

        .playlist-artist {
            font-size: 0.7rem;
            color: var(--text-secondary);
        }

        .color-picker {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin: 15px 0;
            padding: 15px 0;
            border-top: 1px solid #333;
            border-bottom: 1px solid #333;
        }

        .color-option {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid transparent;
        }

        .color-option.active {
            border-color: white;
        }

        .color-option.red { background: #e63946; }
        .color-option.lilac { background: #b380ff; }
        .color-option.blue { background: #00a8ff; }
        .color-option.green { background: #00ff88; }
        .color-option.orange { background: #ff7700; }
        .color-option.pink { background: #ff44aa; }
        .color-option.purple { background: #aa44ff; }
        .color-option.yellow { background: #ffdd44; }
        .color-option.white { background: #ffffff; border: 1px solid #888; }

        .ad-panel {
            background: rgba(255,255,255,0.1);
            border-radius: 8px;
            padding: 10px;
            margin: 15px 0;
        }

        .ad-timer {
            font-size: 1.3rem;
            font-weight: bold;
            text-align: center;
            color: var(--primary-color);
        }

        .ad-status {
            font-size: 0.75rem;
            text-align: center;
            color: #ccc;
        }

        .ad-buttons {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 8px;
        }

        .ad-btn {
            background: none;
            border: 1px solid #555;
            color: #fff;
            padding: 4px 10px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 0.7rem;
        }

        .notification {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(0,0,0,0.8);
            color: #fff;
            padding: 8px 16px;
            border-radius: 30px;
            z-index: 2000;
            transform: translateX(200px);
            transition: transform 0.3s;
            border-left: 3px solid var(--primary-color);
            font-size: 0.8rem;
        }

        .notification.show {
            transform: translateX(0);
        }

        .menu-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(5px);
            color: white;
            border: 1px solid var(--primary-color);
            font-size: 1.3rem;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            z-index: 15;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Esconder elementos não usados no modo TV */
        .hide-on-tv {
            display: none;
        }
    </style>
</head>

{ id: 187, title: "Maria Rita Cara Valente", artist: "Unknown", src: "Maria_Rita_Cara_Valente_muzzik.m4a", periodo: "todos" },

{ id: 191, title: "Onde Anda Onde Anda Voc Clipe", artist: "Unknown", src: "Onde_Anda_Onde_Anda_Voc_Clipe_muzzik.m4a", periodo: "todos" },
{ id: 192, title: "Take That Back for Good", artist: "Unknown", src: "Take_That_Back_for_Good_muzzik.m4a", periodo: "todos" },
{ id: 193, title: "Touchy Touchy", artist: "Unknown", src: "Touchy_Touchy__muzzik.m4a", periodo: "todos" },
{ id: 194, title: "eWoman in Woman in Love muzzik.m", artist: "Unknown", src: "eWoman_in_Woman_in_Love_muzzik.m", periodo: "todos" },
{ id: 195, title: "ELECTRIC LOCO s Hits muzzik (1)", artist: "Unknown", src: "ELECTRIC_LOCO_s_Hits_muzzik (1).m4a", periodo: "todos" },
{ id: 196, title: "Freddie Mercury Montserrat Caball How Can I Go On", artist: "Unknown", src: "Freddie_Mercury_Montserrat_Caball_How_Can_I_Go_On_muzzik.m4a", periodo: "todos" }
   
        ];
        
        for(let i = musicas.length + 1; i <= 50; i++) {
            musicas.push({ id: i, title: `Música Especial ${i}`, artist: `Artista ${i}`, src: `track${i}.m4a`, periodo: "todos" });
        }
        
        // ==================== ANÚNCIOS DE ÁUDIO ====================
        const anunciosAudio = [
            { src: "zzcv.mp3", nome: "Oferta Especial" },
            { src: "zzcv.mp3", nome: "Promoção Relâmpago" }
        ];
        
        // ==================== ELEMENTOS ====================
        const mainVideo = document.getElementById('mainVideo');
        const musicPlayer = document.getElementById('musicPlayer');
        const adPlayer = document.getElementById('adPlayer');
        const playPauseBtn = document.getElementById('tvPlayPauseBtn');
        const prevBtn = document.getElementById('tvPrevBtn');
        const nextBtn = document.getElementById('tvNextBtn');
        const shuffleBtn = document.getElementById('tvShuffleBtn');
        const currentTrackInfo = document.getElementById('currentTrackInfo');
        const playlistContainer = document.getElementById('playlistContainer');
        const toggleAllSongsBtn = document.getElementById('toggleAllSongsBtn');
        
        let currentMusicIndex = 0;
        let isPlaying = false;
        let shuffle = false;
        let allSongsMode = true;
        let filteredPlaylist = [];
        let isAdPlaying = false;
        let adsEnabled = true;
        let adIntervalSeconds = 900;
        let musicPlayedSeconds = 0;
        let adTimerInterval = null;
        let currentAdIndex = 0;
        let shouldResumeMusic = false;
        let musicPausedTime = 0;
        
        musicPlayer.volume = 0.85;
        adPlayer.volume = 0.85;
        
        // ==================== FUNÇÕES DOS VÍDEOS (alternância automática) ====================
        function alternarVideo() {
            currentVideoIndex = (currentVideoIndex + 1) % videosList.length;
            const novoVideo = videosList[currentVideoIndex];
            if(mainVideo && novoVideo.src) {
                const wasPlaying = !mainVideo.paused;
                mainVideo.src = novoVideo.src;
                mainVideo.load();
                mainVideo.play().catch(e => console.log("Vídeo em loop"));
            }
        }
        
        function iniciarAlternanciaVideos() {
            if(videoInterval) clearInterval(videoInterval);
            videoInterval = setInterval(alternarVideo, 12000); // Troca a cada 12 segundos
        }
        
        // Carregar primeiro vídeo
        if(videosList.length > 0) {
            mainVideo.src = videosList[0].src;
            mainVideo.load();
            mainVideo.play().catch(e => console.log);
        }
        
        // ==================== FUNÇÕES DA PLAYLIST ====================
        function updateFilteredPlaylist() {
            if(allSongsMode) {
                filteredPlaylist = [...musicas];
            } else {
                const hora = new Date().getHours();
                let periodo = "manha";
                if(hora >= 12 && hora < 18) periodo = "tarde";
                else if(hora >= 18) periodo = "noite";
                filteredPlaylist = musicas.filter(m => m.periodo === periodo || m.periodo === "todos");
                if(filteredPlaylist.length === 0) filteredPlaylist = [...musicas];
            }
            renderPlaylist();
        }
        
        function renderPlaylist() {
            let html = '';
            filteredPlaylist.forEach((m, idx) => {
                const globalIdx = musicas.findIndex(p => p.id === m.id);
                const isActive = (globalIdx === currentMusicIndex);
                html += `<div class="playlist-item ${isActive ? 'playing' : ''}" onclick="window.selectSong(${globalIdx})">
                            <div class="music-number">${(idx+1).toString().padStart(2,'0')}</div>
                            <div class="playlist-info">
                                <div class="playlist-title">${m.title}</div>
                                <div class="playlist-artist">${m.artist}</div>
                            </div>
                        </div>`;
            });
            playlistContainer.innerHTML = html;
        }
        
        function loadMusic(index) {
            if(index >= musicas.length) index = 0;
            if(index < 0) index = musicas.length - 1;
            currentMusicIndex = index;
            const track = musicas[currentMusicIndex];
            musicPlayer.src = track.src;
            currentTrackInfo.innerHTML = `🎵 ${track.title} - ${track.artist}`;
            renderPlaylist();
        }
        
        function playMusic() {
            if(isAdPlaying) {
                showNotification('⏸️ Aguarde o anúncio terminar');
                return;
            }
            const track = musicas[currentMusicIndex];
            musicPlayer.src = track.src;
            musicPlayer.load();
            musicPlayer.play()
                .then(() => {
                    isPlaying = true;
                    playPauseBtn.innerHTML = '<i class="fas fa-pause"></i>';
                    showNotification(`▶️ Tocando: ${track.title}`);
                })
                .catch(e => showNotification('⚠️ Erro ao tocar música'));
        }
        
        function pauseMusic() {
            musicPlayer.pause();
            isPlaying = false;
            playPauseBtn.innerHTML = '<i class="fas fa-play"></i>';
        }
        
        function togglePlayPause() {
            if(isAdPlaying) {
                showNotification('⏸️ Aguarde o anúncio');
                return;
            }
            isPlaying ? pauseMusic() : playMusic();
        }
        
        function nextTrack() {
            if(isAdPlaying) return;
            pauseMusic();
            let filteredIdx = filteredPlaylist.findIndex(m => m.id === musicas[currentMusicIndex].id);
            if(filteredIdx === -1) filteredIdx = 0;
            if(shuffle && filteredPlaylist.length > 1) {
                let newIdx;
                do { newIdx = Math.floor(Math.random() * filteredPlaylist.length); } while(newIdx === filteredIdx);
                filteredIdx = newIdx;
            } else {
                filteredIdx = (filteredIdx + 1) % filteredPlaylist.length;
            }
            const newGlobal = musicas.findIndex(m => m.id === filteredPlaylist[filteredIdx].id);
            currentMusicIndex = newGlobal;
            loadMusic(currentMusicIndex);
            if(isPlaying) playMusic();
        }
        
        function prevTrack() {
            if(isAdPlaying) return;
            pauseMusic();
            let filteredIdx = filteredPlaylist.findIndex(m => m.id === musicas[currentMusicIndex].id);
            if(filteredIdx === -1) filteredIdx = 0;
            if(shuffle && filteredPlaylist.length > 1) {
                let newIdx;
                do { newIdx = Math.floor(Math.random() * filteredPlaylist.length); } while(newIdx === filteredIdx);
                filteredIdx = newIdx;
            } else {
                filteredIdx = (filteredIdx - 1 + filteredPlaylist.length) % filteredPlaylist.length;
            }
            const newGlobal = musicas.findIndex(m => m.id === filteredPlaylist[filteredIdx].id);
            currentMusicIndex = newGlobal;
            loadMusic(currentMusicIndex);
            if(isPlaying) playMusic();
        }
        
        window.selectSong = function(globalIdx) {
            if(isAdPlaying) return;
            pauseMusic();
            currentMusicIndex = globalIdx;
            loadMusic(currentMusicIndex);
            if(isPlaying) playMusic();
            closeDrawer();
        };
        
        // ==================== ANÚNCIOS ====================
        function startAdTimer() {
            if(adTimerInterval) clearInterval(adTimerInterval);
            adTimerInterval = setInterval(() => {
                if(!adsEnabled || isAdPlaying) return;
                if(isPlaying && !isAdPlaying) {
                    musicPlayedSeconds++;
                    const remaining = adIntervalSeconds - musicPlayedSeconds;
                    const adTimerEl = document.getElementById('adTimer');
                    if(adTimerEl) adTimerEl.textContent = formatTime(remaining);
                    if(musicPlayedSeconds >= adIntervalSeconds) {
                        musicPlayedSeconds = 0;
                        playAudioAd();
                    }
                }
            }, 1000);
        }
        
        function formatTime(seconds) {
            if(isNaN(seconds)) return '0:00';
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins.toString().padStart(2,'0')}:${secs.toString().padStart(2,'0')}`;
        }
        
        function playAudioAd() {
            if(!adsEnabled || isAdPlaying) return;
            const ad = anunciosAudio[currentAdIndex];
            if(!ad) return;
            
            if(isPlaying) {
                musicPausedTime = musicPlayer.currentTime;
                pauseMusic();
                shouldResumeMusic = true;
            }
            
            adPlayer.src = ad.src;
            adPlayer.load();
            isAdPlaying = true;
            const adStatus = document.getElementById('adStatus');
            if(adStatus) adStatus.innerHTML = `<i class="fas fa-volume-up"></i> Tocando: ${ad.nome}`;
            showNotification(`📢 Anúncio: ${ad.nome}`);
            adPlayer.play().catch(() => finishAudioAd());
            adPlayer.onended = finishAudioAd;
        }
        
        function finishAudioAd() {
            isAdPlaying = false;
            const adStatus = document.getElementById('adStatus');
            if(adStatus) adStatus.innerHTML = '<i class="fas fa-compact-disc fa-spin"></i> Aguardando...';
            if(shouldResumeMusic) {
                musicPlayer.currentTime = musicPausedTime;
                playMusic();
                shouldResumeMusic = false;
            }
            currentAdIndex = (currentAdIndex + 1) % anunciosAudio.length;
            musicPlayedSeconds = 0;
        }
        
        function toggleAds() {
            adsEnabled = !adsEnabled;
            const toggleBtn = document.getElementById('toggleAdsBtn');
            if(toggleBtn) toggleBtn.innerHTML = adsEnabled ? 'Ativo' : 'Inativo';
            if(!adsEnabled && isAdPlaying) {
                adPlayer.pause();
                finishAudioAd();
            }
            showNotification(adsEnabled ? '📢 Anúncios ATIVOS' : '🔇 Anúncios DESATIVADOS');
        }
        
        function testAd() {
            if(!isAdPlaying) {
                musicPlayedSeconds = adIntervalSeconds;
                playAudioAd();
            }
        }
        
        function toggleAllSongsMode() {
            allSongsMode = !allSongsMode;
            updateFilteredPlaylist();
            toggleAllSongsBtn.innerHTML = allSongsMode ? '🌎 Modo: TODAS as músicas' : '⏰ Modo: Período do dia';
            showNotification(allSongsMode ? "Todas as músicas" : "Modo período");
            const exists = filteredPlaylist.some(m => m.id === musicas[currentMusicIndex].id);
            if(!exists && filteredPlaylist.length) {
                const newGlobal = musicas.findIndex(m => m.id === filteredPlaylist[0].id);
                currentMusicIndex = newGlobal;
                loadMusic(currentMusicIndex);
                if(isPlaying) playMusic();
            }
        }
        
        function showNotification(msg) {
            const n = document.getElementById('notification');
            const text = document.getElementById('notificationText');
            if(text) text.innerText = msg;
            if(n) {
                n.classList.add('show');
                setTimeout(() => n.classList.remove('show'), 2500);
            }
        }
        
        function closeDrawer() {
            document.getElementById('drawer').classList.remove('open');
        }
        
        // ==================== EVENTOS ====================
        playPauseBtn.addEventListener('click', togglePlayPause);
        prevBtn.addEventListener('click', prevTrack);
        nextBtn.addEventListener('click', nextTrack);
        shuffleBtn.addEventListener('click', () => {
            shuffle = !shuffle;
            shuffleBtn.style.background = shuffle ? 'var(--primary-color)' : 'rgba(0,0,0,0.5)';
            showNotification(shuffle ? '🔀 Aleatório ON' : '➡️ Sequencial');
        });
        
        document.getElementById('menuBtn').addEventListener('click', () => {
            document.getElementById('drawer').classList.add('open');
        });
        document.getElementById('closeDrawer').addEventListener('click', closeDrawer);
        document.getElementById('fullscreenDrawerBtn').addEventListener('click', () => {
            if(document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
        });
        document.getElementById('shareDrawerBtn').addEventListener('click', () => {
            if(navigator.share) navigator.share({title:'MUTV Playlist', url:location.href});
            else { navigator.clipboard.writeText(location.href); showNotification('Link copiado!'); }
        });
        document.getElementById('toggleAdsBtn').addEventListener('click', toggleAds);
        document.getElementById('testAdBtn').addEventListener('click', testAd);
        toggleAllSongsBtn.addEventListener('click', toggleAllSongsMode);
        
        // Temas
        const colorOptions = document.querySelectorAll('.color-option');
        function setTheme(themeClass) {
            document.body.className = themeClass;
            localStorage.setItem('tvTheme', themeClass);
            colorOptions.forEach(opt => opt.classList.toggle('active', opt.dataset.theme === themeClass));
        }
        const savedTheme = localStorage.getItem('tvTheme') || 'theme-red';
        setTheme(savedTheme);
        colorOptions.forEach(opt => opt.addEventListener('click', () => setTheme(opt.dataset.theme)));
        
        // ==================== INICIALIZAÇÃO ====================
        window.addEventListener('load', () => {
            updateFilteredPlaylist();
            const randomIndex = Math.floor(Math.random() * filteredPlaylist.length);
            currentMusicIndex = musicas.findIndex(m => m.id === filteredPlaylist[randomIndex].id);
            loadMusic(currentMusicIndex);
            startAdTimer();
            iniciarAlternanciaVideos();
            
            // Auto-play da primeira música após interação? Melhor deixar o usuário clicar
            showNotification('🎬 Clique no play para iniciar a música');
        });
    </script>
</body>

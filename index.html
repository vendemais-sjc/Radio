<head>
    <meta charset="UTF-8">

    <title>Sistema Otimizado para Vídeos Curtos - TV</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #000;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .video-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
            z-index: 1;
        }

        .video-player {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: opacity 0.5s ease-in-out;
            background: #000;
        }

        .video-player.active {
            opacity: 1;
            z-index: 2;
        }

        .video-player.inactive {
            opacity: 0;
            z-index: 1;
        }

        .audio-player {
            position: fixed;
            bottom: -100px;
            left: -100px;
            width: 1px;
            height: 1px;
            opacity: 0;
            pointer-events: none;
        }

        .content-info {
            position: fixed;
            bottom: 30px;
            left: 30px;
            color: #fff;
            background: rgba(0, 0, 0, 0.85);
            padding: 15px 25px;
            border-radius: 12px;
            font-size: 16px;
            z-index: 100;
            font-family: monospace;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            pointer-events: none;
            min-width: 280px;
        }

        .content-info .title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .content-info .subtitle {
            font-size: 13px;
            opacity: 0.8;
            margin-top: 5px;
        }

        .content-info .counter {
            font-size: 12px;
            margin-top: 5px;
            color: #ff0;
        }

        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 200;
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            gap: 20px;
        }

        .spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .debug-panel {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.85);
            color: #0f0;
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 11px;
            font-family: monospace;
            z-index: 100;
            border: 1px solid rgba(0, 255, 0, 0.3);
            pointer-events: none;
            max-width: 320px;
            text-align: right;
            line-height: 1.5;
        }

        .status-dot {
            position: fixed;
            top: 20px;
            left: 20px;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #0f0;
            z-index: 100;
            box-shadow: 0 0 8px currentColor;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.8); }
        }

        @media (max-width: 768px) {
            .content-info {
                bottom: 20px;
                left: 20px;
                padding: 10px 15px;
                font-size: 12px;
                min-width: 240px;
            }
            .content-info .title {
                font-size: 14px;
            }
            .debug-panel {
                font-size: 9px;
                top: 10px;
                right: 10px;
                padding: 6px 10px;
            }
        }
    </style>
</head>

        ];

        // ==================== CONFIGURAÇÕES OTIMIZADAS PARA VÍDEOS CURTOS ====================
        const CONFIG = {
            FADE_DURATION: 300,              // Fade mais rápido para vídeos curtos (300ms)
            PRELOAD_ADVANCE: 2000,           // Pré-carrega 2 segundos antes do fim
            MAX_RETRIES: 5,                  // Mais tentativas para vídeos curtos
            RETRY_DELAY: 500,                // Delay menor entre tentativas
            PLAYBACK_CHECK_INTERVAL: 1000,   // Verifica a cada 1 segundo (mais frequente)
            SHOW_DEBUG: true,
            AUTO_PLAY_DELAY: 50,             // Delay mínimo para autoplay
            MUSIC_VOLUME: 0.4,
            SYNC_MUSIC_WITH_VIDEO: false,    // Não reinicia música a cada vídeo (evita cortes)
            BUFFER_TIME: 0.5                 // Tempo mínimo de buffer (segundos)
        };

        // Variáveis globais
        let videoPlayers = [];
        let audioElement = null;
        let currentVideoIndex = 0;
        let currentMusicIndex = 0;
        let activePlayerIndex = 0;
        let isTransitioning = false;
        let retryCount = 0;
        let playbackCheckInterval = null;
        let preloadTimer = null;
        let videoEndTimer = null;
        let isMusicPlaying = false;
        let videoLoadQueue = []; // Fila de pré-carregamento

        // Detecta dispositivo
        const isTV = /SmartTV|Tizen|WebOS|AppleTV|CrKey|Xbox|PlayStation|BRAVIA|SMART-TV|LG TV|Samsung/i.test(navigator.userAgent);
        
        if (isTV) {
            CONFIG.FADE_DURATION = 500;
            CONFIG.PLAYBACK_CHECK_INTERVAL = 1500;
            CONFIG.PRELOAD_ADVANCE = 3000;
        }

        // ==================== FUNÇÕES DE UTILIDADE ====================
        
        function updateDebug(message) {
            if (!CONFIG.SHOW_DEBUG) return;
            const debugPanel = document.getElementById('debugPanel');
            if (debugPanel) {
                const time = new Date().toLocaleTimeString('pt-BR');
                debugPanel.innerHTML = `${isTV ? '📺 TV' : '💻 PC'} | ${time}<br>${message}`;
            }
            console.log(`[${time}] ${message}`);
        }

        function showLoading(show) {
            const loadingOverlay = document.getElementById('loadingOverlay');
            if (loadingOverlay) loadingOverlay.style.display = show ? 'flex' : 'none';
        }

        function updateDisplayInfo() {
            const currentMusic = musicasList[currentMusicIndex];
            const currentVideo = videosList[currentVideoIndex];
            
            document.getElementById('currentMusicName').innerHTML = `${currentMusic.nome}`;
            document.getElementById('currentVideoName').innerHTML = `${currentVideo.nome} (${currentVideoIndex + 1}/${videosList.length})`;
        }

        function updateCounter(message) {
            const counter = document.getElementById('videoCounter');
            if (counter) counter.innerHTML = message;
        }

        // ==================== SISTEMA DE PRÉ-CARREGAMENTO AVANÇADO ====================
        
        /**
         * Pré-carrega múltiplos vídeos (para garantir transição suave)
         */
        function preloadVideosInBackground() {
            // Pré-carrega os próximos 2 vídeos para garantir
            const nextIndex1 = (currentVideoIndex + 1) % videosList.length;
            const nextIndex2 = (currentVideoIndex + 2) % videosList.length;
            
            const preloadPlayers = [0, 1].filter(i => i !== activePlayerIndex);
            
            preloadPlayers.forEach((playerIdx, idx) => {
                const videoToLoad = idx === 0 ? nextIndex1 : nextIndex2;
                const video = videosList[videoToLoad];
                const player = videoPlayers[playerIdx];
                
                if (player && player.src !== video.src) {
                    updateDebug(`📥 Pré-carregando: ${video.nome} no player ${playerIdx}`);
                    player.preload = 'auto';
                    player.src = video.src;
                    player.load();
                }
            });
        }
        
        /**
         * Pré-carrega especificamente o próximo vídeo
         */
        function preloadNextVideo() {
            const nextIndex = (currentVideoIndex + 1) % videosList.length;
            const nextVideo = videosList[nextIndex];
            const preloadPlayerIndex = (activePlayerIndex + 1) % 2;
            const preloadPlayer = videoPlayers[preloadPlayerIndex];
            
            if (preloadPlayer && preloadPlayer.src !== nextVideo.src) {
                updateDebug(`🎬 Pré-carregando próximo: ${nextVideo.nome}`);
                preloadPlayer.preload = 'auto';
                preloadPlayer.src = nextVideo.src;
                preloadPlayer.load();
            }
            
            // Também pré-carrega o segundo próximo
            setTimeout(() => {
                const secondNext = (currentVideoIndex + 2) % videosList.length;
                const secondVideo = videosList[secondNext];
                const otherPlayer = videoPlayers[activePlayerIndex];
                if (otherPlayer && otherPlayer.src !== secondVideo.src) {
                    updateDebug(`📦 Pré-carregando segundo: ${secondVideo.nome}`);
                    otherPlayer.preload = 'auto';
                    otherPlayer.src = secondVideo.src;
                    otherPlayer.load();
                }
            }, 500);
        }

        // ==================== FUNÇÕES DE VÍDEO OTIMIZADAS ====================
        
        function createVideoPlayers() {
            const container = document.getElementById('videoContainer');
            if (!container) return false;
            
            container.innerHTML = '';
            
            for (let i = 0; i < 2; i++) {
                const video = document.createElement('video');
                video.id = `videoPlayer${i}`;
                video.className = `video-player ${i === 0 ? 'active' : 'inactive'}`;
                video.setAttribute('playsinline', '');
                video.setAttribute('webkit-playsinline', '');
                video.setAttribute('autoplay', '');
                video.setAttribute('muted', '');
                video.preload = 'auto';
                
                // Eventos críticos
                video.addEventListener('error', (e) => handleVideoError(e, i));
                video.addEventListener('canplaythrough', () => handleVideoReady(i)); // Canplaythrough é mais confiável
                video.addEventListener('ended', () => handleVideoEnded(i));
                video.addEventListener('playing', () => handleVideoPlaying(i));
                
                container.appendChild(video);
                videoPlayers.push(video);
            }
            
            updateDebug(`✅ Players criados (modo vídeos curtos)`);
            return true;
        }

        function handleVideoError(event, playerIndex) {
            updateDebug(`❌ Erro player ${playerIndex}`);
            if (retryCount < CONFIG.MAX_RETRIES) {
                retryCount++;
                setTimeout(() => {
                    videoPlayers[playerIndex].load();
                    videoPlayers[playerIndex].play().catch(e => {});
                }, CONFIG.RETRY_DELAY);
            } else {
                retryCount = 0;
                nextVideo();
            }
        }

        function handleVideoReady(playerIndex) {
            updateDebug(`✅ Player ${playerIndex} pronto (canplaythrough)`);
            if (playerIndex === activePlayerIndex && !isTransitioning) {
                showLoading(false);
            }
        }

        function handleVideoPlaying(playerIndex) {
            updateDebug(`▶️ Player ${playerIndex} rodando`);
            showLoading(false);
            
            // Configura timer para pré-carregar próximo ANTES do vídeo acabar
            if (playerIndex === activePlayerIndex && videoPlayers[activePlayerIndex]) {
                const currentVideo = videoPlayers[activePlayerIndex];
                const duration = currentVideo.duration;
                
                if (duration && duration > 0) {
                    const preloadTime = Math.max(0, duration - (CONFIG.PRELOAD_ADVANCE / 1000));
                    if (preloadTime > 0) {
                        if (preloadTimer) clearTimeout(preloadTimer);
                        preloadTimer = setTimeout(() => {
                            updateDebug(`⏰ Pré-carregando (${CONFIG.PRELOAD_ADVANCE/1000}s antes do fim)`);
                            preloadNextVideo();
                            updateCounter(`⏳ Preparando próximo vídeo...`);
                        }, preloadTime * 1000);
                    }
                }
            }
        }

        function handleVideoEnded(playerIndex) {
            updateDebug(`🏁 Vídeo terminou player ${playerIndex}`);
            
            // Limpa timers
            if (preloadTimer) clearTimeout(preloadTimer);
            
            if (playerIndex === activePlayerIndex && !isTransitioning) {
                // Pequeno delay para garantir que o próximo está pronto
                setTimeout(() => {
                    nextVideo();
                }, 50);
            }
        }

        async function playVideo(index, playerIndex) {
            const video = videosList[index];
            const player = videoPlayers[playerIndex];
            
            if (!player || !video) return false;
            
            updateDebug(`🎬 Reproduzindo: ${video.nome}`);
            
            // Se já está tocando o mesmo vídeo
            if (player.src.includes(video.src) && !player.paused && !player.ended) {
                return true;
            }
            
            player.src = video.src;
            player.load();
            
            return new Promise((resolve) => {
                const tryPlay = () => {
                    player.play()
                        .then(() => resolve(true))
                        .catch((error) => {
                            updateDebug(`Erro: ${error.message}`);
                            if (error.name === 'NotAllowedError') {
                                const playOnClick = () => {
                                    player.play().then(() => resolve(true)).catch(() => resolve(false));
                                    document.removeEventListener('click', playOnClick);
                                };
                                document.addEventListener('click', playOnClick);
                            } else {
                                resolve(false);
                            }
                        });
                };
                
                // Aguarda um pouco para o vídeo carregar
                setTimeout(tryPlay, CONFIG.AUTO_PLAY_DELAY);
            });
        }

        async function transitionToVideo(nextIndex) {
            if (isTransitioning) return;
            
            isTransitioning = true;
            updateDebug(`🔄 Transição para: ${videosList[nextIndex].nome}`);
            
            const nextPlayerIndex = (activePlayerIndex + 1) % 2;
            const currentPlayer = videoPlayers[activePlayerIndex];
            const nextPlayer = videoPlayers[nextPlayerIndex];
            
            // Toca o próximo vídeo
            const success = await playVideo(nextIndex, nextPlayerIndex);
            
            if (!success) {
                updateDebug(`❌ Falha, tentando novamente...`);
                isTransitioning = false;
                setTimeout(() => transitionToVideo(nextIndex), 500);
                return;
            }
            
            // Pequeno delay para garantir que o próximo vídeo começou
            setTimeout(() => {
                // Transição rápida
                currentPlayer.classList.remove('active');
                currentPlayer.classList.add('inactive');
                nextPlayer.classList.remove('inactive');
                nextPlayer.classList.add('active');
                
                // Atualiza após transição
                setTimeout(() => {
                    currentPlayer.pause();
                    currentPlayer.currentTime = 0;
                    
                    activePlayerIndex = nextPlayerIndex;
                    currentVideoIndex = nextIndex;
                    isTransitioning = false;
                    
                    updateDebug(`✅ Agora: ${videosList[currentVideoIndex].nome}`);
                    updateDisplayInfo();
                    updateCounter(`🎬 Reproduzindo...`);
                    
                    // Pré-carrega o próximo
                    preloadNextVideo();
                }, CONFIG.FADE_DURATION);
            }, 50);
        }

        function nextVideo() {
            if (isTransitioning) return;
            const nextIndex = (currentVideoIndex + 1) % videosList.length;
            transitionToVideo(nextIndex);
        }

        // ==================== SISTEMA DE ÁUDIO ====================
        
        function createAudioPlayer() {
            audioElement = document.createElement('audio');
            audioElement.className = 'audio-player';
            audioElement.volume = CONFIG.MUSIC_VOLUME;
            audioElement.preload = 'auto';
            
            audioElement.addEventListener('ended', () => {
                currentMusicIndex = (currentMusicIndex + 1) % musicasList.length;
                playMusic(currentMusicIndex);
            });
            
            audioElement.addEventListener('error', () => {
                setTimeout(() => {
                    currentMusicIndex = (currentMusicIndex + 1) % musicasList.length;
                    playMusic(currentMusicIndex);
                }, 2000);
            });
            
            document.body.appendChild(audioElement);
            updateDebug(`🎵 Player de áudio criado`);
        }
        
        async function playMusic(index) {
            if (!audioElement) createAudioPlayer();
            
            const music = musicasList[index];
            if (!music) return;
            
            try {
                audioElement.src = music.src;
                audioElement.load();
                await audioElement.play();
                isMusicPlaying = true;
                updateDebug(`🎵 Tocando: ${music.nome}`);
                updateDisplayInfo();
            } catch (error) {
                updateDebug(`⚠️ Erro áudio: ${error.message}`);
            }
        }

        // ==================== MONITOR DE PLAYBACK ====================
        
        function startPlaybackMonitor() {
            if (playbackCheckInterval) clearInterval(playbackCheckInterval);
            
            playbackCheckInterval = setInterval(() => {
                const activePlayer = videoPlayers[activePlayerIndex];
                const statusDot = document.getElementById('statusDot');
                
                if (activePlayer && !isTransitioning) {
                    if (activePlayer.paused && !activePlayer.ended && activePlayer.src) {
                        updateDebug(`⚠️ Vídeo pausado, reiniciando...`);
                        activePlayer.play().catch(e => {});
                        if (statusDot) statusDot.style.background = '#ff0';
                    } else if (!activePlayer.paused && !activePlayer.ended) {
                        if (statusDot) statusDot.style.background = '#0f0';
                    }
                    
                    if (activePlayer.ended && !isTransitioning) {
                        nextVideo();
                    }
                }
            }, CONFIG.PLAYBACK_CHECK_INTERVAL);
        }

        // ==================== INICIALIZAÇÃO ====================
        
        async function initialize() {
            updateDebug(`🚀 Iniciando sistema otimizado para vídeos curtos...`);
            updateDebug(`📊 Total: ${videosList.length} vídeos | ${musicasList.length} músicas`);
            
            if (!createVideoPlayers()) {
                updateDebug(`❌ Erro crítico`);
                return;
            }
            
            createAudioPlayer();
            
            await new Promise(r => setTimeout(r, 200));
            
            // Inicia música
            await playMusic(0);
            
            // Inicia vídeo
            const success = await playVideo(0, 0);
            
            if (success) {
                videoPlayers[0].classList.add('active');
                activePlayerIndex = 0;
                currentVideoIndex = 0;
                
                preloadNextVideo();
                startPlaybackMonitor();
                
                updateDisplayInfo();
                showLoading(false);
                updateDebug(`✅ Sistema pronto!`);
            } else {
                updateDebug(`❌ Falha, tentando novamente...`);
                setTimeout(initialize, 2000);
            }
        }
        
        // Inicia tudo
        document.addEventListener('DOMContentLoaded', initialize);
        
        // Controles via console
        window.tvSystem = {
            next: () => nextVideo(),
            nextMusic: () => {
                currentMusicIndex = (currentMusicIndex + 1) % musicasList.length;
                playMusic(currentMusicIndex);
            },
            status: () => ({
                video: videosList[currentVideoIndex].nome,
                music: musicasList[currentMusicIndex].nome,
                isPlaying: videoPlayers[activePlayerIndex] && !videoPlayers[activePlayerIndex].paused
            })
        };
    </script>
</body>
</html>

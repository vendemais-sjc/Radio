<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rádio Simples</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: #000; 
            color: #fff; 
            font-family: sans-serif; 
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .player {
            background: #111;
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            border: 2px solid #e63946;
            width: 90%;
            max-width: 400px;
        }
        .track { font-size: 1.2rem; margin: 20px 0; }
        .progress { 
            width: 100%; 
            height: 4px; 
            background: #333; 
            margin: 15px 0;
            cursor: pointer;
            border-radius: 2px;
        }
        .progress-fill { 
            width: 0%; 
            height: 100%; 
            background: #e63946; 
            border-radius: 2px;
        }
        .time { display: flex; justify-content: space-between; font-size: 0.7rem; margin-top: 5px; }
        button {
            background: #e63946;
            border: none;
            color: white;
            font-size: 1.5rem;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            margin: 10px;
            cursor: pointer;
        }
        button:active { transform: scale(0.95); }
        .play { width: 70px; height: 70px; font-size: 2rem; background: #e63946; }
        .info { font-size: 0.8rem; color: #888; margin-top: 15px; }
    </style>
</head>
<body>
    <div class="player">
        <h2 style="color: #e63946;">🎵 Rádio Playlist</h2>
        <div class="track" id="trackName">Carregando...</div>
        <div class="progress" id="progressBar">
            <div class="progress-fill" id="progressFill"></div>
        </div>
        <div class="time">
            <span id="currentTime">0:00</span>
            <span id="totalTime">0:00</span>
        </div>
        <div>
            <button id="prevBtn">⏮</button>
            <button class="play" id="playBtn">▶</button>
            <button id="nextBtn">⏭</button>
        </div>
        <div>
            <button id="shuffleBtn" style="background: #333;">🔀</button>
        </div>
        <div class="info" id="status">Clique em PLAY para começar</div>
    </div>

    <audio id="audio" preload="auto"></audio>

    <script>
        // ==================== PLAYLIST (SÓ AS PRIMEIRAS PARA TESTE) ====================
        const musicas = [
            { id: 1, title: "Flavio Venturini Feat Jota Quest", artist: "Flavio Venturini & Jota Quest", src: "9Flavio_Venturini_Flavio_Venturini_Feat_Jota_muzzik.m4a" },
            { id: 2, title: "Me Ensina Me Ensina a Escreve", artist: "Osvaldo Montenegro", src: "Me_Ensina_Me_Ensina_a_Escrever_muzzik.m4a" },
            { id: 3, title: "Someone Like You", artist: "Adele", src: "Adele_Someone_Like_You_muzzik.m4a" },
            { id: 4, title: "Esquadros", artist: "Adriana Calcanhotto", src: "Adriana_Calcanhotto_Esquadros.m4a" },
            { id: 5, title: "I Love You", artist: "Jim Diamond", src: "Jim_Diamond_Remember_I_Love_You_muzzik.m4a" }
        ];

        // ==================== ELEMENTOS ====================
        const audio = document.getElementById('audio');
        const playBtn = document.getElementById('playBtn');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const shuffleBtn = document.getElementById('shuffleBtn');
        const trackName = document.getElementById('trackName');
        const progressFill = document.getElementById('progressFill');
        const currentTimeEl = document.getElementById('currentTime');
        const totalTimeEl = document.getElementById('totalTime');
        const statusDiv = document.getElementById('status');

        // ==================== VARIÁVEIS ====================
        let currentIndex = 0;
        let isPlaying = false;
        let shuffle = false;
        let timerInterval = null;

        // ==================== FUNÇÕES ====================
        function loadTrack(index) {
            if (index >= musicas.length) index = 0;
            if (index < 0) index = musicas.length - 1;
            currentIndex = index;
            const track = musicas[currentIndex];
            
            audio.src = track.src;
            audio.load();
            trackName.textContent = `${track.title} - ${track.artist}`;
            currentTimeEl.textContent = '0:00';
            progressFill.style.width = '0%';
            statusDiv.textContent = `Carregando: ${track.title}`;
            
            // Quando carregar, mostra duração real
            audio.addEventListener('loadedmetadata', function onMeta() {
                if (audio.duration && !isNaN(audio.duration)) {
                    const mins = Math.floor(audio.duration / 60);
                    const secs = Math.floor(audio.duration % 60);
                    totalTimeEl.textContent = `${mins}:${secs < 10 ? '0' : ''}${secs}`;
                    statusDiv.textContent = `Pronto: ${track.title}`;
                }
                audio.removeEventListener('loadedmetadata', onMeta);
            });
        }

        // TIMER que monitora o progresso e fim da música
        function startTimer() {
            if (timerInterval) clearInterval(timerInterval);
            
            timerInterval = setInterval(() => {
                if (isPlaying && !audio.paused && audio.duration) {
                    // Atualiza barra de progresso
                    const percent = (audio.currentTime / audio.duration) * 100;
                    progressFill.style.width = percent + '%';
                    
                    const mins = Math.floor(audio.currentTime / 60);
                    const secs = Math.floor(audio.currentTime % 60);
                    currentTimeEl.textContent = `${mins}:${secs < 10 ? '0' : ''}${secs}`;
                    
                    // Quando a música está no fim (últimos 0.3 segundos)
                    if (audio.duration - audio.currentTime <= 0.3) {
                        console.log("🎵 Música terminou! Próxima...");
                        clearInterval(timerInterval);
                        timerInterval = null;
                        nextTrack();
                    }
                }
            }, 100);
        }

        function stopTimer() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
        }

        function playMusic() {
            audio.play().then(() => {
                isPlaying = true;
                playBtn.innerHTML = '⏸';
                startTimer();
                statusDiv.textContent = `Tocando: ${musicas[currentIndex].title}`;
                
                // Atualiza Media Session
                if ('mediaSession' in navigator) {
                    navigator.mediaSession.metadata = new MediaMetadata({
                        title: musicas[currentIndex].title,
                        artist: musicas[currentIndex].artist,
                        album: 'Rádio Playlist'
                    });
                    navigator.mediaSession.playbackState = 'playing';
                }
            }).catch(e => {
                console.log("Erro ao tocar:", e);
                statusDiv.textContent = "Erro: " + e.message;
            });
        }

        function pauseMusic() {
            audio.pause();
            isPlaying = false;
            playBtn.innerHTML = '▶';
            stopTimer();
            statusDiv.textContent = `Pausado: ${musicas[currentIndex].title}`;
            
            if ('mediaSession' in navigator) {
                navigator.mediaSession.playbackState = 'paused';
            }
        }

        function togglePlayPause() {
            if (isPlaying) {
                pauseMusic();
            } else {
                playMusic();
            }
        }

        function nextTrack() {
            stopTimer();
            
            let nextIndex;
            if (shuffle) {
                do {
                    nextIndex = Math.floor(Math.random() * musicas.length);
                } while (nextIndex === currentIndex && musicas.length > 1);
            } else {
                nextIndex = (currentIndex + 1) % musicas.length;
            }
            
            currentIndex = nextIndex;
            loadTrack(currentIndex);
            
            if (isPlaying) {
                playMusic();
            }
        }

        function prevTrack() {
            stopTimer();
            
            let prevIndex;
            if (shuffle) {
                do {
                    prevIndex = Math.floor(Math.random() * musicas.length);
                } while (prevIndex === currentIndex && musicas.length > 1);
            } else {
                prevIndex = (currentIndex - 1 + musicas.length) % musicas.length;
            }
            
            currentIndex = prevIndex;
            loadTrack(currentIndex);
            
            if (isPlaying) {
                playMusic();
            }
        }

        // Barra de progresso clicável
        document.getElementById('progressBar').addEventListener('click', (e) => {
            const rect = e.currentTarget.getBoundingClientRect();
            const percent = (e.clientX - rect.left) / rect.width;
            if (audio.duration) {
                audio.currentTime = percent * audio.duration;
            }
        });

        // Aleatório
        shuffleBtn.addEventListener('click', () => {
            shuffle = !shuffle;
            shuffleBtn.style.background = shuffle ? '#e63946' : '#333';
            statusDiv.textContent = shuffle ? '🔀 Aleatório ON' : '➡️ Sequencial';
            setTimeout(() => {
                if (!isPlaying) statusDiv.textContent = `Parado: ${musicas[currentIndex].title}`;
            }, 1500);
        });

        // ==================== ÁUDIO EM SEGUNDO PLANO (TELA BLOQUEADA) ====================
        let audioCtx = null;
        let silentSource = null;
        
        function startBackgroundAudio() {
            if (silentSource) return;
            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const bufferSize = audioCtx.sampleRate * 2;
                const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const channelData = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) channelData[i] = 0;
                
                const source = audioCtx.createBufferSource();
                source.buffer = buffer;
                source.loop = true;
                source.connect(audioCtx.destination);
                source.start();
                silentSource = source;
                console.log("✅ Áudio de fundo ativado");
            } catch(e) { console.log("Erro áudio fundo:", e); }
        }
        
        // Quando tocar, ativa o áudio de fundo
        const originalPlayMusic = playMusic;
        window.playMusic = function() {
            startBackgroundAudio();
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            originalPlayMusic();
        };
        playMusic = window.playMusic;
        
        // Mantém ativo quando a tela é bloqueada
        document.addEventListener('visibilitychange', () => {
            if (document.hidden && isPlaying && audio.paused) {
                console.log("Tela bloqueada, retomando...");
                audio.play().catch(e => console.log);
            }
        });
        
        // Verifica a cada 5 segundos
        setInterval(() => {
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            if (isPlaying && audio.paused && !document.hidden) {
                audio.play().catch(e => console.log);
            }
        }, 5000);

        // ==================== MEDIA SESSION API ====================
        if ('mediaSession' in navigator) {
            navigator.mediaSession.setActionHandler('play', () => playMusic());
            navigator.mediaSession.setActionHandler('pause', () => pauseMusic());
            navigator.mediaSession.setActionHandler('previoustrack', () => prevTrack());
            navigator.mediaSession.setActionHandler('nexttrack', () => nextTrack());
        }

        // ==================== EVENTOS ====================
        playBtn.addEventListener('click', togglePlayPause);
        prevBtn.addEventListener('click', prevTrack);
        nextBtn.addEventListener('click', nextTrack);
        
        // Quando a música termina pelo evento nativo (fallback)
        audio.addEventListener('ended', () => {
            console.log("Evento 'ended' disparado");
            if (isPlaying) {
                stopTimer();
                nextTrack();
            }
        });

        // ==================== INICIAR ====================
        loadTrack(0);
        statusDiv.textContent = "✅ Pronto! Clique em PLAY";
        
        console.log("🎵 Rádio carregada! Teste com tela bloqueada.");
    </script>
</body>
</html>

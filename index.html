<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>MUTV Playlist • Vídeo Player</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            min-height: 100vh;
            background-color: #000000;
            overflow: hidden;
            position: fixed;
            width: 100%;
            height: 100%;
        }

        /* Tema Vermelho (padrão) */
        body {
            --primary-color: #e63946;
            --primary-dark: #b71c1c;
        }

        .app {
            width: 100%;
            height: 100vh;
            background: #000000;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* LETREIRO SUPERIOR */
        .top-bar {
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(5px);
            border-bottom: 1px solid var(--primary-color);
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            z-index: 10;
        }

        .top-ticker {
            width: 100%;
            overflow: hidden;
            white-space: nowrap;
            color: #fff;
            font-weight: 800;
            font-size: 1.2rem;
            padding: 12px 16px;
        }

        .top-ticker span {
            display: inline-block;
            padding-left: 100%;
            animation: ticker-scroll 25s linear infinite;
        }

        @keyframes ticker-scroll {
            0% { transform: translateX(0); }
            100% { transform: translateX(-100%); }
        }

        /* CONTAINER DO VÍDEO - RESOLUÇÃO 2560x1440 */
        .video-container {
            width: 100%;
            height: 100%;
            background: #000;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        /* CONTROLES SOBRE O VÍDEO (PEQUENOS E DISCRETOS) */
        .video-controls {
            position: absolute;
            bottom: 20px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            gap: 20px;
            padding: 8px 16px;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(8px);
            border-radius: 50px;
            margin: 0 auto;
            width: fit-content;
            z-index: 20;
            transition: opacity 0.3s ease;
            opacity: 0;
            pointer-events: none;
        }

        .video-controls.visible {
            opacity: 1;
            pointer-events: auto;
        }

        .control-btn {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            font-size: 1.2rem;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .control-btn:active {
            transform: scale(0.9);
            background: var(--primary-color);
        }

        .play-btn {
            background: var(--primary-color);
            font-size: 1.3rem;
            width: 48px;
            height: 48px;
        }

        /* BOTÃO TELA CHEIA */
        .fullscreen-btn {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(8px);
            border: none;
            color: white;
            font-size: 1.2rem;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            z-index: 20;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.3s ease;
            opacity: 0;
            pointer-events: none;
        }

        .fullscreen-btn.visible {
            opacity: 1;
            pointer-events: auto;
        }

        .fullscreen-btn:active {
            transform: scale(0.9);
            background: var(--primary-color);
        }

        /* BOTÃO MÚSICA (MENU) - PEQUENO E DISCRETO */
        .music-menu-btn {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(8px);
            border: none;
            color: white;
            font-size: 1.2rem;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            z-index: 20;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.3s ease;
            opacity: 0;
            pointer-events: none;
        }

        .music-menu-btn.visible {
            opacity: 1;
            pointer-events: auto;
        }

        .music-menu-btn:active {
            transform: scale(0.9);
            background: var(--primary-color);
        }

        /* DRAWER (MUSICAS) */
        .drawer {
            position: fixed;
            top: 0;
            right: 0;
            width: 280px;
            height: 100vh;
            background: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(10px);
            transform: translateX(100%);
            transition: transform 0.3s ease;
            z-index: 2000;
            padding: 60px 20px 20px;
            overflow-y: auto;
            border-left: 1px solid var(--primary-color);
        }

        .drawer.open {
            transform: translateX(0);
        }

        .drawer-header {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 20px;
        }

        .close-drawer {
            background: none;
            border: none;
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
        }

        .drawer h3 {
            color: var(--primary-color);
            margin-bottom: 15px;
            font-size: 1.1rem;
        }

        .playlist-container {
            max-height: calc(100vh - 120px);
            overflow-y: auto;
        }

        .playlist-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 12px;
            margin-bottom: 8px;
            cursor: pointer;
            background: rgba(255,255,255,0.05);
            transition: all 0.2s;
        }

        .playlist-item.playing {
            border-color: var(--primary-color);
            background: rgba(255,255,255,0.1);
        }

        .music-number {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--primary-color);
            color: #000;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
        }

        .playlist-info {
            flex: 1;
        }

        .playlist-title {
            font-size: 0.85rem;
            color: white;
            font-weight: 600;
        }

        .playlist-artist {
            font-size: 0.7rem;
            color: #aaa;
        }

        .drawer-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            z-index: 1999;
            display: none;
        }

        .drawer-overlay.active {
            display: block;
        }

        /* NOTIFICAÇÃO */
        .notification {
            position: fixed;
            bottom: 90px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(10px);
            color: white;
            padding: 8px 20px;
            border-radius: 30px;
            font-size: 0.8rem;
            z-index: 3000;
            transition: opacity 0.3s;
            opacity: 0;
            pointer-events: none;
            white-space: nowrap;
            border: 1px solid var(--primary-color);
        }

        .notification.show {
            opacity: 1;
        }

        /* SPLASH */
        #splash {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }

        #splash.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .splash-content {
            text-align: center;
            color: #fff;
        }

        .splash-content i {
            font-size: 3rem;
            color: var(--primary-color);
            margin-bottom: 1rem;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.6; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.1); }
            100% { opacity: 0.6; transform: scale(1); }
        }

        /* RESPONSIVO */
        @media (min-width: 1024px) {
            .control-btn { width: 50px; height: 50px; font-size: 1.4rem; }
            .play-btn { width: 60px; height: 60px; font-size: 1.6rem; }
            .top-ticker { font-size: 1.4rem; }
        }
    </style>
</head>

            // ==================== ELEMENTOS ====================
            const musicPlayer = document.getElementById('musicPlayer');
            const mainVideo = document.getElementById('mainVideo');
            const playBtn = document.getElementById('playPauseBtn');
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');
            const fullscreenBtn = document.getElementById('fullscreenBtn');
            const musicMenuBtn = document.getElementById('musicMenuBtn');
            const drawer = document.getElementById('drawer');
            const drawerOverlay = document.getElementById('drawerOverlay');
            const closeDrawer = document.getElementById('closeDrawer');
            const playlistContainer = document.getElementById('playlistContainer');
            const videoControls = document.getElementById('videoControls');
            const splash = document.getElementById('splash');
            const notification = document.getElementById('notification');
            const notificationText = document.getElementById('notificationText');

            let currentIndex = 0;
            let isPlaying = false;
            let controlsTimeout = null;

            // ==================== FUNÇÕES ====================
            function showNotification(msg) {
                notificationText.textContent = msg;
                notification.classList.add('show');
                setTimeout(() => notification.classList.remove('show'), 2000);
            }

            function showControls() {
                videoControls.classList.add('visible');
                fullscreenBtn.classList.add('visible');
                musicMenuBtn.classList.add('visible');
                if (controlsTimeout) clearTimeout(controlsTimeout);
                controlsTimeout = setTimeout(() => {
                    videoControls.classList.remove('visible');
                    fullscreenBtn.classList.remove('visible');
                    musicMenuBtn.classList.remove('visible');
                }, 3000);
            }

            function renderPlaylist() {
                let html = '';
                musicas.forEach((m, idx) => {
                    const isActive = (idx === currentIndex && isPlaying);
                    html += `<div class="playlist-item ${isActive ? 'playing' : ''}" onclick="window.selectSong(${idx})">
                                <div class="music-number">${(idx+1).toString().padStart(2,'0')}</div>
                                <div class="playlist-info">
                                    <div class="playlist-title">${m.title}</div>
                                    <div class="playlist-artist">${m.artist}</div>
                                </div>
                            </div>`;
                });
                playlistContainer.innerHTML = html;
            }

            function loadTrack(index) {
                if (index >= musicas.length) index = 0;
                if (index < 0) index = musicas.length - 1;
                currentIndex = index;
                const track = musicas[currentIndex];
                musicPlayer.src = track.src;
                musicPlayer.load();
                renderPlaylist();
                showNotification(`🎵 ${track.title} - ${track.artist}`);
            }

            function playMusic() {
                musicPlayer.play()
                    .then(() => {
                        isPlaying = true;
                        playBtn.innerHTML = '<i class="fas fa-pause"></i>';
                        splash.classList.add('hidden');
                        showNotification('🎶 Tocando música');
                    })
                    .catch(e => {
                        console.log('Erro:', e);
                        showNotification('⚠️ Toque na tela para iniciar');
                    });
            }

            function pauseMusic() {
                musicPlayer.pause();
                isPlaying = false;
                playBtn.innerHTML = '<i class="fas fa-play"></i>';
                showNotification('⏸️ Pausado');
            }

            function togglePlayPause() {
                isPlaying ? pauseMusic() : playMusic();
            }

            function nextTrack() {
                currentIndex = (currentIndex + 1) % musicas.length;
                loadTrack(currentIndex);
                if (isPlaying) playMusic();
                showControls();
            }

            function prevTrack() {
                currentIndex = (currentIndex - 1 + musicas.length) % musicas.length;
                loadTrack(currentIndex);
                if (isPlaying) playMusic();
                showControls();
            }

            window.selectSong = function(index) {
                currentIndex = index;
                loadTrack(currentIndex);
                if (isPlaying) playMusic();
                drawer.classList.remove('open');
                drawerOverlay.classList.remove('active');
                showControls();
            };

            function openDrawer() {
                drawer.classList.add('open');
                drawerOverlay.classList.add('active');
                renderPlaylist();
            }

            function closeDrawerFunc() {
                drawer.classList.remove('open');
                drawerOverlay.classList.remove('active');
            }

            // TELA CHEIA
            function toggleFullscreen() {
                const container = document.getElementById('videoContainer');
                if (!document.fullscreenElement) {
                    container.requestFullscreen().catch(err => {
                        console.log(`Erro ao entrar em tela cheia: ${err.message}`);
                    });
                    fullscreenBtn.innerHTML = '<i class="fas fa-compress"></i>';
                } else {
                    document.exitFullscreen();
                    fullscreenBtn.innerHTML = '<i class="fas fa-expand"></i>';
                }
            }

            document.addEventListener('fullscreenchange', () => {
                if (document.fullscreenElement) {
                    fullscreenBtn.innerHTML = '<i class="fas fa-compress"></i>';
                } else {
                    fullscreenBtn.innerHTML = '<i class="fas fa-expand"></i>';
                }
            });

            // ==================== EVENTOS ====================
            playBtn.addEventListener('click', togglePlayPause);
            prevBtn.addEventListener('click', prevTrack);
            nextBtn.addEventListener('click', nextTrack);
            fullscreenBtn.addEventListener('click', toggleFullscreen);
            musicMenuBtn.addEventListener('click', openDrawer);
            closeDrawer.addEventListener('click', closeDrawerFunc);
            drawerOverlay.addEventListener('click', closeDrawerFunc);

            // Mostrar controles ao tocar no vídeo
            const videoContainer = document.getElementById('videoContainer');
            videoContainer.addEventListener('click', showControls);
            videoContainer.addEventListener('touchstart', showControls);

            // Eventos do player de áudio
            musicPlayer.addEventListener('ended', () => {
                nextTrack();
            });

            musicPlayer.addEventListener('error', () => {
                showNotification('⚠️ Erro na música, pulando...');
                setTimeout(nextTrack, 1000);
            });

            // Eventos de toque para iniciar áudio
            document.addEventListener('click', () => {
                if (!isPlaying && musicPlayer.paused) {
                    playMusic();
                }
            }, { once: true });

            document.addEventListener('touchstart', () => {
                if (!isPlaying && musicPlayer.paused) {
                    playMusic();
                }
            }, { once: true });

            // Inicialização
            window.addEventListener('load', () => {
                loadTrack(0);
                renderPlaylist();
                
                // Esconde splash após 2 segundos
                setTimeout(() => {
                    splash.classList.add('hidden');
                }, 2000);
                
                // Tenta iniciar áudio automaticamente
                setTimeout(() => {
                    if (!isPlaying && musicPlayer.paused) {
                        playMusic();
                    }
                }, 1000);
            });
        })();
    </script>
</body>
</html>

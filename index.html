<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>MUTV • Modo TV</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        /* CORPO CENTRALIZADO COM FUNDO PRETO */
        body {
            background-color: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            height: 100vh;
            margin: 0;
        }

        body.theme-red { --primary-color: #e63946; --primary-dark: #b71c1c; }
        body.theme-blue { --primary-color: #00a8ff; --primary-dark: #0077be; }
        body.theme-green { --primary-color: #00ff88; --primary-dark: #00cc6a; }
        body.theme-purple { --primary-color: #aa44ff; --primary-dark: #7700cc; }
        body { --primary-color: #e63946; --primary-dark: #b71c1c; }

        /* CONTÊINER PRINCIPAL COM PROPORÇÃO 16:9 */
        .tv-app {
            width: 100%;
            max-width: 1920px;     /* limite máximo da largura */
            max-height: 100vh;
            aspect-ratio: 16 / 9;  /* 1920x1080 = 16:9 */
            background: #000;
            position: relative;
            overflow: hidden;
            margin: auto;
        }

        .fullscreen-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }

        .overlay-gradient {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 70px;
            background: linear-gradient(to top, rgba(0,0,0,0.4), transparent);
            z-index: 2;
            pointer-events: none;
        }

        /* Letreiro superior */
        .top-ticker {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(6px);
            overflow: hidden;
            white-space: nowrap;
            color: #fff;
            font-weight: 600;
            font-size: 0.8rem;
            padding: 6px 0;
            z-index: 10;
            border-bottom: 1px solid var(--primary-color);
            pointer-events: none;
        }

        .top-ticker span {
            display: inline-block;
            padding-left: 100%;
            animation: ticker-scroll 25s linear infinite;
        }

        @keyframes ticker-scroll {
            0% { transform: translateX(0); }
            100% { transform: translateX(-100%); }
        }

        /* Barra de controles */
        .music-controls-bar {
            position: absolute;
            bottom: 12px;
            left: 12px;
            right: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            z-index: 20;
            background: rgba(0,0,0,0.35);
            backdrop-filter: blur(8px);
            padding: 4px 10px;
            border-radius: 30px;
            border: none;
        }

        .buttons-group {
            display: flex;
            gap: 4px;
        }

        .tv-control-btn {
            background: rgba(0,0,0,0.4);
            border: none;
            color: rgba(255,255,255,0.85);
            font-size: 0.85rem;
            width: 28px;
            height: 28px;
            border-radius: 0;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .tv-control-btn:hover {
            transform: scale(1.1);
            color: var(--primary-color);
            background: transparent;
        }

        .tv-control-btn.play-pause {
            background: transparent;
            color: var(--primary-color);
            font-size: 1rem;
            width: 30px;
        }

        .tv-control-btn.play-pause:hover {
            transform: scale(1.15);
            color: white;
        }

        .current-track-info {
            flex: 1;
            background: rgba(0,0,0,0.3);
            padding: 4px 8px;
            border-radius: 20px;
            font-size: 0.65rem;
            color: rgba(255,255,255,0.9);
            border-left: 2px solid var(--primary-color);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            letter-spacing: 0.3px;
        }

        .fullscreen-btn {
            background: rgba(0,0,0,0.4);
            border: none;
            color: rgba(255,255,255,0.85);
            font-size: 0.85rem;
            width: 28px;
            height: 28px;
            border-radius: 0;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .fullscreen-btn:hover {
            transform: scale(1.1);
            color: var(--primary-color);
            background: transparent;
        }

        .menu-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: transparent;
            color: rgba(255,255,255,0.7);
            border: none;
            font-size: 1.2rem;
            cursor: pointer;
            z-index: 15;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4px;
            opacity: 0.6;
            transition: opacity 0.2s;
        }

        .menu-btn:hover {
            opacity: 1;
            color: var(--primary-color);
        }

        /* Drawer (menu lateral) */
        .drawer {
            position: fixed;
            top: 0;
            right: -100%;
            width: 300px;
            height: 100vh;
            background: rgba(0,0,0,0.92);
            backdrop-filter: blur(20px);
            transition: right 0.3s ease;
            z-index: 1000;
            padding: 20px;
            overflow-y: auto;
            border-left: 1px solid var(--primary-color);
        }

        .drawer.open {
            right: 0;
        }

        .drawer-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid #333;
        }

        .drawer-header h3 {
            color: var(--primary-color);
            font-size: 0.95rem;
        }

        .close-drawer {
            background: none;
            border: none;
            color: white;
            font-size: 1.2rem;
            cursor: pointer;
            opacity: 0.7;
        }

        .close-drawer:hover {
            opacity: 1;
            color: var(--primary-color);
        }

        /* Seção de vídeos */
        .videos-section {
            margin-bottom: 25px;
        }

        .videos-section h4 {
            color: var(--primary-color);
            margin-bottom: 10px;
            font-size: 0.8rem;
        }

        .video-list {
            max-height: 200px;
            overflow-y: auto;
        }

        .video-item {
            background: rgba(255,255,255,0.08);
            border: 1px solid #333;
            border-radius: 20px;
            padding: 7px 12px;
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .video-item:hover {
            background: rgba(255,255,255,0.15);
            border-color: var(--primary-color);
        }

        .video-item.active {
            border-color: var(--primary-color);
            background: rgba(220, 20, 60, 0.15);
        }

        .video-name {
            color: white;
            font-size: 0.7rem;
            flex: 1;
        }

        .video-actions button {
            background: none;
            border: none;
            color: #888;
            cursor: pointer;
            font-size: 0.7rem;
            padding: 4px;
        }

        .video-actions button:hover {
            color: var(--primary-color);
        }

        .add-video-btn {
            background: var(--primary-color);
            color: #000;
            border: none;
            padding: 7px;
            border-radius: 20px;
            width: 100%;
            margin-top: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.7rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            opacity: 0.9;
        }

        .add-video-btn:hover {
            opacity: 1;
        }

        /* Playlist de músicas */
        .music-section {
            margin-top: 15px;
            border-top: 1px solid #333;
            padding-top: 15px;
        }

        .music-section h4 {
            color: var(--primary-color);
            margin-bottom: 10px;
            font-size: 0.8rem;
        }

        .playlist-container {
            max-height: 260px;
            overflow-y: auto;
        }

        .playlist-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 7px 12px;
            border: 1px solid #333;
            border-radius: 20px;
            margin-bottom: 6px;
            cursor: pointer;
            background: rgba(255,255,255,0.05);
            transition: all 0.2s;
        }

        .playlist-item:hover {
            background: rgba(255,255,255,0.1);
            border-color: var(--primary-color);
        }

        .playlist-item.playing {
            border-color: var(--primary-color);
            background: rgba(220, 20, 60, 0.15);
        }

        .music-number {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: var(--primary-color);
            color: #000;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.6rem;
        }

        .playlist-info {
            flex: 1;
        }

        .playlist-title {
            font-size: 0.7rem;
            color: white;
        }

        .playlist-artist {
            font-size: 0.55rem;
            color: #aaa;
        }

        /* Modal */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 2000;
            display: none;
            align-items: center;
            justify-content: center;
        }

        .modal.open {
            display: flex;
        }

        .modal-content {
            background: #1a1a1a;
            border: 1px solid var(--primary-color);
            border-radius: 20px;
            padding: 20px;
            width: 90%;
            max-width: 360px;
        }

        .modal-content h3 {
            color: var(--primary-color);
            margin-bottom: 15px;
            font-size: 0.95rem;
        }

        .modal-content input {
            width: 100%;
            padding: 8px 12px;
            background: #2a2a2a;
            border: 1px solid #444;
            border-radius: 20px;
            color: white;
            margin-bottom: 12px;
            font-size: 0.8rem;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }

        .modal-buttons button {
            padding: 6px 16px;
            border-radius: 20px;
            cursor: pointer;
            border: none;
            font-size: 0.75rem;
        }

        .modal-buttons .confirm {
            background: var(--primary-color);
            color: #000;
            font-weight: bold;
        }

        .modal-buttons .cancel {
            background: #333;
            color: white;
        }

        .notification {
            position: fixed;
            bottom: 70px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: rgba(0,0,0,0.75);
            color: #fff;
            padding: 5px 16px;
            border-radius: 30px;
            z-index: 2000;
            transition: transform 0.3s;
            border-left: 2px solid var(--primary-color);
            font-size: 0.7rem;
            white-space: nowrap;
            backdrop-filter: blur(4px);
        }

        .notification.show {
            transform: translateX(-50%) translateY(0);
        }

        @media (min-width: 768px) {
            .tv-control-btn { width: 30px; height: 30px; font-size: 0.9rem; }
            .fullscreen-btn { width: 30px; height: 30px; font-size: 0.9rem; }
            .current-track-info { font-size: 0.7rem; }
            .top-ticker { font-size: 0.85rem; padding: 7px 0; }
        }
    </style>
</head>

        ];
        
        // ==================== ELEMENTOS ====================
        const mainVideo = document.getElementById('mainVideo');
        const musicPlayer = document.getElementById('musicPlayer');
        const playPauseBtn = document.getElementById('tvPlayPauseBtn');
        const prevBtn = document.getElementById('tvPrevBtn');
        const nextBtn = document.getElementById('tvNextBtn');
        const shuffleBtn = document.getElementById('tvShuffleBtn');
        const currentTrackInfo = document.getElementById('currentTrackInfo');
        const playlistContainer = document.getElementById('playlistContainer');
        const videoListContainer = document.getElementById('videoList');
        const fullscreenBtn = document.getElementById('fullscreenBtn');
        
        let currentMusicIndex = 0;
        let isPlaying = false;
        let shuffleActive = false;
        
        // ==================== FUNÇÕES DOS VÍDEOS ====================
        function carregarVideo(index) {
            if(index >= videosList.length) index = 0;
            if(index < 0) index = videosList.length - 1;
            currentVideoIndex = index;
            const video = videosList[currentVideoIndex];
            if(mainVideo && video.src) {
                mainVideo.src = video.src;
                mainVideo.load();
                mainVideo.play().catch(e => console.log("Erro vídeo:", e));
            }
            renderVideoList();
        }
        
        function alternarVideo() {
            if(videosList.length > 0) {
                currentVideoIndex = (currentVideoIndex + 1) % videosList.length;
                carregarVideo(currentVideoIndex);
            }
        }
        
        function iniciarAlternanciaVideos() {
            if(videoInterval) clearInterval(videoInterval);
            videoInterval = setInterval(alternarVideo, 15000);
        }
        
        function renderVideoList() {
            if(!videoListContainer) return;
            let html = '';
            videosList.forEach((video, idx) => {
                const isActive = (idx === currentVideoIndex);
                html += `
                    <div class="video-item ${isActive ? 'active' : ''}" onclick="window.selecionarVideo(${idx})">
                        <span class="video-name"><i class="fas fa-play-circle"></i> ${escapeHtml(video.nome)}</span>
                        <div class="video-actions">
                            <button onclick="event.stopPropagation(); window.removerVideo(${idx})" title="Remover"><i class="fas fa-trash-alt"></i></button>
                        </div>
                    </div>
                `;
            });
            videoListContainer.innerHTML = html;
        }
        
        window.selecionarVideo = function(idx) {
            carregarVideo(idx);
            showNotification(`🎬 Vídeo: ${videosList[idx].nome}`);
            closeDrawer();
        };
        
        window.removerVideo = function(idx) {
            if(videosList.length <= 1) {
                showNotification('⚠️ Mantenha pelo menos 1 vídeo');
                return;
            }
            videosList.splice(idx, 1);
            if(currentVideoIndex >= videosList.length) currentVideoIndex = 0;
            carregarVideo(currentVideoIndex);
            renderVideoList();
            showNotification('🗑️ Vídeo removido');
        };
        
        function adicionarVideo(nome, caminho) {
            if(!nome.trim() || !caminho.trim()) {
                showNotification('⚠️ Preencha nome e caminho');
                return false;
            }
            videosList.push({ src: caminho.trim(), nome: nome.trim() });
            renderVideoList();
            showNotification(`✅ Vídeo "${nome}" adicionado`);
            return true;
        }
        
        function escapeHtml(str) {
            if(!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if(m === '&') return '&amp;';
                if(m === '<') return '&lt;';
                if(m === '>') return '&gt;';
                return m;
            });
        }
        
        // ==================== FUNÇÕES DA MÚSICA ====================
        function renderPlaylist() {
            let html = '';
            musicas.forEach((m, idx) => {
                const isActive = (idx === currentMusicIndex);
                html += `
                    <div class="playlist-item ${isActive ? 'playing' : ''}" onclick="window.selecionarMusica(${idx})">
                        <div class="music-number">${(idx+1).toString().padStart(2,'0')}</div>
                        <div class="playlist-info">
                            <div class="playlist-title">${escapeHtml(m.title)}</div>
                            <div class="playlist-artist">${escapeHtml(m.artist)}</div>
                        </div>
                    </div>
                `;
            });
            playlistContainer.innerHTML = html;
        }
        
        function atualizarInfoMusica() {
            const track = musicas[currentMusicIndex];
            currentTrackInfo.innerHTML = `🎵 ${track.title} - ${track.artist}`;
            renderPlaylist();
        }
        
        function carregarMusica(index) {
            if(index >= musicas.length) index = 0;
            if(index < 0) index = musicas.length - 1;
            currentMusicIndex = index;
            const track = musicas[currentMusicIndex];
            musicPlayer.src = track.src;
            musicPlayer.load();
            atualizarInfoMusica();
        }
        
        function playMusic() {
            const track = musicas[currentMusicIndex];
            if(musicPlayer.src !== track.src) {
                musicPlayer.src = track.src;
                musicPlayer.load();
            }
            
            musicPlayer.play()
                .then(() => {
                    isPlaying = true;
                    playPauseBtn.innerHTML = '<i class="fas fa-pause"></i>';
                    renderPlaylist();
                    showNotification(`🎵 Tocando: ${track.title}`);
                })
                .catch(e => {
                    console.log('Erro play:', e);
                    showNotification('⚠️ Erro ao tocar música');
                    isPlaying = false;
                    playPauseBtn.innerHTML = '<i class="fas fa-play"></i>';
                });
        }
        
        function pauseMusic() {
            musicPlayer.pause();
            isPlaying = false;
            playPauseBtn.innerHTML = '<i class="fas fa-play"></i>';
            renderPlaylist();
        }
        
        function togglePlayPause() {
            if(!musicas[currentMusicIndex]) return;
            
            if(isPlaying) {
                pauseMusic();
            } else {
                const track = musicas[currentMusicIndex];
                if(!musicPlayer.src || musicPlayer.src !== track.src) {
                    musicPlayer.src = track.src;
                    musicPlayer.load();
                }
                playMusic();
            }
        }
        
        function nextTrack() {
            if(musicas.length === 0) return;
            
            pauseMusic();
            let nextIndex;
            if(shuffleActive) {
                let newIdx;
                do {
                    newIdx = Math.floor(Math.random() * musicas.length);
                } while(newIdx === currentMusicIndex && musicas.length > 1);
                nextIndex = newIdx;
            } else {
                nextIndex = (currentMusicIndex + 1) % musicas.length;
            }
            currentMusicIndex = nextIndex;
            carregarMusica(currentMusicIndex);
            playMusic();
        }
        
        function prevTrack() {
            if(musicas.length === 0) return;
            
            pauseMusic();
            let prevIndex;
            if(shuffleActive) {
                let newIdx;
                do {
                    newIdx = Math.floor(Math.random() * musicas.length);
                } while(newIdx === currentMusicIndex && musicas.length > 1);
                prevIndex = newIdx;
            } else {
                prevIndex = (currentMusicIndex - 1 + musicas.length) % musicas.length;
            }
            currentMusicIndex = prevIndex;
            carregarMusica(currentMusicIndex);
            playMusic();
        }
        
        window.selecionarMusica = function(idx) {
            if(currentMusicIndex === idx && isPlaying) {
                closeDrawer();
                return;
            }
            
            pauseMusic();
            currentMusicIndex = idx;
            carregarMusica(currentMusicIndex);
            playMusic();
            closeDrawer();
        };
        
        // ==================== TELA CHEIA ====================
        function toggleFullscreen() {
            if(!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
                fullscreenBtn.innerHTML = '<i class="fas fa-compress"></i>';
            } else {
                document.exitFullscreen();
                fullscreenBtn.innerHTML = '<i class="fas fa-expand"></i>';
            }
        }
        
        document.addEventListener('fullscreenchange', () => {
            if(document.fullscreenElement) {
                fullscreenBtn.innerHTML = '<i class="fas fa-compress"></i>';
            } else {
                fullscreenBtn.innerHTML = '<i class="fas fa-expand"></i>';
            }
        });
        
        // ==================== UI ====================
        function showNotification(msg) {
            const n = document.getElementById('notification');
            const text = document.getElementById('notificationText');
            if(text) text.innerText = msg;
            if(n) {
                n.classList.add('show');
                setTimeout(() => n.classList.remove('show'), 2500);
            }
        }
        
        function openDrawer() {
            document.getElementById('drawer').classList.add('open');
        }
        
        function closeDrawer() {
            document.getElementById('drawer').classList.remove('open');
        }
        
        // ==================== MODAL VÍDEO ====================
        const modal = document.getElementById('videoModal');
        const addVideoBtn = document.getElementById('addVideoBtn');
        const confirmVideo = document.getElementById('confirmVideo');
        const cancelModal = document.getElementById('cancelModal');
        const videoNameInput = document.getElementById('videoName');
        const videoPathInput = document.getElementById('videoPath');
        
        addVideoBtn.addEventListener('click', () => {
            modal.classList.add('open');
            videoNameInput.value = '';
            videoPathInput.value = '';
        });
        
        confirmVideo.addEventListener('click', () => {
            const nome = videoNameInput.value;
            const caminho = videoPathInput.value;
            if(adicionarVideo(nome, caminho)) {
                modal.classList.remove('open');
            }
        });
        
        cancelModal.addEventListener('click', () => {
            modal.classList.remove('open');
        });
        
        modal.addEventListener('click', (e) => {
            if(e.target === modal) modal.classList.remove('open');
        });
        
        // ==================== EVENTOS ====================
        playPauseBtn.addEventListener('click', togglePlayPause);
        prevBtn.addEventListener('click', prevTrack);
        nextBtn.addEventListener('click', nextTrack);
        shuffleBtn.addEventListener('click', () => {
            shuffleActive = !shuffleActive;
            shuffleBtn.style.opacity = shuffleActive ? '1' : '0.7';
            shuffleBtn.style.color = shuffleActive ? 'var(--primary-color)' : 'rgba(255,255,255,0.85)';
            showNotification(shuffleActive ? '🔀 Aleatório ON' : '➡️ Sequencial');
        });
        
        fullscreenBtn.addEventListener('click', toggleFullscreen);
        document.getElementById('menuBtn').addEventListener('click', openDrawer);
        document.getElementById('closeDrawer').addEventListener('click', closeDrawer);
        
        // ==================== TEMA ====================
        const themes = [
            { name: 'theme-red', color: '#e63946' },
            { name: 'theme-blue', color: '#00a8ff' },
            { name: 'theme-green', color: '#00ff88' },
            { name: 'theme-purple', color: '#aa44ff' }
        ];
        let currentTheme = 0;
        function mudarTema() {
            currentTheme = (currentTheme + 1) % themes.length;
            document.body.className = themes[currentTheme].name;
            showNotification(`🎨 Tema: ${themes[currentTheme].name.replace('theme-', '')}`);
        }
        fullscreenBtn.addEventListener('dblclick', mudarTema);
        
        // ==================== INICIALIZAÇÃO ====================
        window.addEventListener('load', () => {
            if(videosList.length > 0) {
                mainVideo.src = videosList[0].src;
                mainVideo.load();
                mainVideo.play().catch(e => console.log);
            }
            
            renderVideoList();
            renderPlaylist();
            
            const randomIndex = Math.floor(Math.random() * musicas.length);
            currentMusicIndex = randomIndex;
            carregarMusica(currentMusicIndex);
            atualizarInfoMusica();
            
            iniciarAlternanciaVideos();
            
            showNotification('🎬 MUTV - Clique no play');
        });
        
        mainVideo.addEventListener('error', () => {
            alternarVideo();
        });
        
        musicPlayer.addEventListener('ended', () => {
            if(isPlaying) {
                nextTrack();
            }
        });
    </script>
</body>

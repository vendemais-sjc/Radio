<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rádio Playlist • Vídeo alternado</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* ========== RESET E VARIÁVEIS ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            background-color: #000 !important;
            color: #fff;
        }

        /* Tema vermelho padrão (você pode adicionar outros temas depois) */
        :root {
            --primary-color: #e63946;
            --bg-secondary: #0a0a0a;
            --text-secondary: #ccc;
            --border-color: #333;
        }

        /* Modo carro simplificado */
        body.car-mode .top-bar,
        body.car-mode .extra-video-container,
        body.car-mode .footer,
        body.car-mode .track-info,
        body.car-mode .progress-area,
        body.car-mode .volume-area,
        body.car-mode .video-menu-btn,
        body.car-mode .feedback-btn,
        body.car-mode .feedback-modal {
            display: none !important;
        }
        body.car-mode .controls {
            display: flex !important;
            padding: 20px;
            gap: 30px;
        }
        .car-exit-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(0,0,0,0.8);
            color: white;
            border: 2px solid var(--primary-color);
            border-radius: 50px;
            width: 50px;
            height: 50px;
            display: none;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 10000;
        }
        body.car-mode .car-exit-btn {
            display: flex;
        }

        .app {
            max-width: 420px;
            width: 100%;
            background: #000;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            border: 1px solid var(--primary-color);
            border-radius: 25px;
            margin: 10px 0;
            overflow: hidden;
        }

        /* Splash */
        #splash {
            position: fixed;
            inset: 0;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.5s;
        }
        #splash.hidden {
            opacity: 0;
            pointer-events: none;
        }
        .splash-content i {
            font-size: 4rem;
            color: var(--primary-color);
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { opacity: 0.6; }
            50% { opacity: 1; }
            100% { opacity: 0.6; }
        }

        #tap-to-start {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.5);
            color: white;
            padding: 8px 16px;
            border-radius: 30px;
            border: 1px solid rgba(255,255,255,0.3);
            backdrop-filter: blur(2px);
            transition: opacity 0.3s;
            pointer-events: none;
        }
        #tap-to-start.hidden {
            opacity: 0;
            display: none !important;
        }

        /* Top ticker (pode ser opcional, mantive como exemplo) */
        .top-bar {
            background: #000;
            border-top: 2px solid var(--primary-color);
            border-bottom: 2px solid var(--primary-color);
        }
        .top-ticker {
            width: 100%;
            overflow: hidden;
            white-space: nowrap;
            background: #000;
            color: #fff;
            font-weight: 800;
            font-size: 1.4rem;
            padding: 15px 16px;
            cursor: pointer;
        }
        .top-ticker span {
            display: inline-block;
            padding-left: 100%;
            animation: ticker-scroll 25s linear infinite;
        }
        @keyframes ticker-scroll {
            0% { transform: translateX(0); }
            100% { transform: translateX(-100%); }
        }

        /* Player card */
        .player-card {
            background: #000;
            padding: 10px 0;
        }

        /* Container do vídeo principal */
        .video-container {
            aspect-ratio: 16 / 9;
            background: #000;
            border: 2px solid var(--primary-color);
            border-radius: 12px;
            margin: 5px;
            overflow: hidden;
            position: relative;
        }
        .video-container video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .video-menu-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0,0,0,0.8);
            color: white;
            border: 2px solid var(--primary-color);
            border-radius: 50%;
            width: 44px;
            height: 44px;
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 20;
        }

        /* Informações da música em destaque (grande) */
        .track-info {
            text-align: center;
            padding: 15px 10px 5px;
        }
        .track-title {
            font-size: 2.5rem;
            font-weight: 900;
            color: #fff;
            text-shadow: 0 0 15px var(--primary-color);
            line-height: 1.2;
            margin-bottom: 5px;
            word-break: break-word;
        }
        .track-artist {
            font-size: 1.8rem;
            color: var(--text-secondary);
            font-weight: 600;
            margin-bottom: 10px;
        }
        .track-info-extra {
            font-size: 1.2rem;
            color: var(--primary-color);
            font-style: italic;
            margin-bottom: 10px;
        }

        /* Progresso */
        .progress-area {
            padding: 0 16px 6px;
        }
        .progress-time {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: var(--text-secondary);
        }
        .progress-bar {
            height: 4px;
            background: var(--border-color);
            cursor: pointer;
            overflow: hidden;
            border-radius: 2px;
        }
        .progress-fill {
            height: 100%;
            background: var(--primary-color);
            width: 0%;
        }

        /* Controles */
        .controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            padding: 8px 16px 12px;
        }
        .control-btn {
            background: rgba(20,20,20,0.5);
            border: 1px solid var(--primary-color);
            color: #fff;
            font-size: 1.8rem;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            cursor: pointer;
            backdrop-filter: blur(2px);
            transition: 0.2s;
        }
        .control-btn:active {
            transform: scale(0.95);
        }
        .play-btn {
            font-size: 2.5rem;
            width: 55px;
            height: 55px;
            color: var(--primary-color);
            background-color: rgba(230,57,70,0.15);
            border: 2px solid var(--primary-color);
        }
        .shuffle-player-btn.active {
            color: var(--primary-color);
            transform: scale(1.1);
        }

        /* Volume */
        .volume-area {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 0 16px 12px;
        }
        .volume-icon {
            background: rgba(20,20,20,0.5);
            border: 1px solid var(--primary-color);
            color: #fff;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .volume-slider {
            flex: 1;
            height: 4px;
            background: var(--border-color);
            -webkit-appearance: none;
            border-radius: 2px;
        }
        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            background: white;
            border: 2px solid var(--primary-color);
            border-radius: 50%;
            cursor: pointer;
        }
        .volume-percent {
            font-size: 0.9rem;
            width: 40px;
            text-align: right;
            color: var(--text-secondary);
        }

        /* Vídeo extra (anúncios) */
        .extra-video-container {
            flex: 1;
            background: #000;
            border: 2px solid var(--primary-color);
            border-radius: 12px;
            margin: 5px;
            cursor: pointer;
            position: relative;
            height: 120px;
            overflow: hidden;
        }
        .extra-video-container video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .extra-overlay, .extra-timer {
            position: absolute;
            bottom: 8px;
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            border: 1px solid var(--primary-color);
            pointer-events: none;
            font-size: 0.8rem;
        }
        .extra-overlay { left: 8px; }
        .extra-timer { right: 8px; }

        /* Footer */
        .footer {
            text-align: center;
            padding: 10px;
            font-size: 0.7rem;
            color: var(--text-secondary);
            border-top: 2px solid var(--primary-color);
        }

        /* Drawer (menu lateral) */
        .drawer {
            position: fixed;
            top: 0;
            left: 0;
            width: 300px;
            height: 100vh;
            background: #000;
            box-shadow: 4px 0 20px rgba(0,0,0,0.8);
            transform: translateX(-100%);
            transition: transform 0.3s;
            z-index: 2000;
            padding: 20px;
            overflow-y: auto;
            border-right: 2px solid var(--border-color);
        }
        .drawer.open {
            transform: translateX(0);
        }
        .drawer-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.8);
            z-index: 1999;
            display: none;
        }
        .drawer-overlay.active {
            display: block;
        }
        .drawer-header {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 30px;
        }
        .close-drawer {
            background: none;
            border: none;
            color: #fff;
            font-size: 1.8rem;
            cursor: pointer;
        }
        .drawer-item {
            background: none;
            border: 1px solid var(--border-color);
            color: #fff;
            padding: 12px 14px;
            width: 100%;
            text-align: left;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            border-radius: 8px;
        }
        .drawer-item i {
            width: 22px;
            color: var(--primary-color);
        }

        /* Playlist */
        .playlist-container {
            margin-top: 15px;
            max-height: 350px;
            overflow-y: auto;
        }
        .playlist-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px;
            border: 1px solid var(--border-color);
            border-radius: 30px;
            margin-bottom: 8px;
            cursor: pointer;
            background: #0a0a0a;
        }
        .playlist-item.playing {
            border-color: var(--primary-color);
            background: #1a1a1a;
            box-shadow: 0 0 10px rgba(230,57,70,0.3);
        }
        .music-number {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--primary-color);
            color: #000;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid #fff;
        }
        .playlist-info {
            flex: 1;
            overflow: hidden;
        }
        .playlist-title {
            font-size: 0.85rem;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .playlist-artist {
            font-size: 0.7rem;
            color: var(--text-secondary);
        }
        .playlist-duration {
            font-size: 0.7rem;
            color: var(--primary-color);
            padding: 2px 6px;
            border: 1px solid var(--border-color);
            border-radius: 12px;
        }

        /* Notificação */
        .notification {
            position: fixed;
            bottom: 16px;
            left: 16px;
            right: 16px;
            background: #000;
            color: #fff;
            padding: 10px 16px;
            border-left: 3px solid var(--primary-color);
            border-radius: 10px;
            max-width: 380px;
            margin: 0 auto;
            transform: translateY(100px);
            transition: transform 0.3s;
            z-index: 3000;
        }
        .notification.show {
            transform: translateY(0);
        }

        /* Feedback flutuante */
        .feedback-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(20,20,20,0.8);
            border: 1px solid var(--primary-color);
            color: var(--primary-color);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 2000;
        }
        .feedback-modal {
            position: fixed;
            bottom: 70px;
            right: 20px;
            width: 260px;
            background: #1a1a1a;
            border: 2px solid var(--primary-color);
            border-radius: 15px;
            padding: 15px;
            z-index: 2001;
            display: none;
        }
        .feedback-modal.open {
            display: block;
            animation: slideIn 0.3s;
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .feedback-modal .rating {
            display: flex;
            gap: 5px;
            justify-content: center;
            margin: 10px 0;
        }
        .feedback-modal .star {
            color: #555;
            font-size: 1.5rem;
            cursor: pointer;
        }
        .feedback-modal .star.active {
            color: #ffd700;
        }
        .feedback-modal textarea {
            width: 100%;
            height: 60px;
            background: #0a0a0a;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 6px;
            color: white;
            resize: none;
            margin-bottom: 10px;
        }
        .feedback-modal .modal-buttons {
            display: flex;
            gap: 8px;
        }
        .feedback-modal .modal-btn {
            flex: 1;
            padding: 6px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            background: #2a2a2a;
            color: white;
        }
        .feedback-modal .modal-btn.send {
            background: #25D366;
            color: #000;
            font-weight: bold;
        }
    </style>
</head>

            // Vídeo principal
            const mainVideo = document.getElementById('mainVideo');
            const mainVideoSource = mainVideo.querySelector('source');

            // Vídeo extra
            const extraVideo = document.getElementById('extraVideo');
            const extraOverlay = document.getElementById('extraOverlay');
            const extraTimer = document.getElementById('extraTimer');
            const extraContainer = document.getElementById('extraVideoContainer');

            // Feedback
            const feedbackBtn = document.getElementById('feedbackBtn');
            const feedbackModal = document.getElementById('feedbackModal');
            const cancelFeedback = document.getElementById('cancelFeedback');
            const sendFeedback = document.getElementById('sendFeedback');
            const feedbackText = document.getElementById('feedbackText');
            const stars = document.querySelectorAll('.star');
            let currentRating = 0;
            const SEU_NUMERO_WHATSAPP = '5512988461978';

            // ========== FUNÇÕES AUXILIARES ==========
            function showNotification(msg) {
                if (notification && notificationText) {
                    notificationText.textContent = msg;
                    notification.classList.add('show');
                    setTimeout(() => notification.classList.remove('show'), 2000);
                } else {
                    alert(msg);
                }
            }

            function hideSplash() {
                if (splash) splash.classList.add('hidden');
            }

            function formatTime(seconds) {
                if (isNaN(seconds)) return '0:00';
                const m = Math.floor(seconds / 60);
                const s = Math.floor(seconds % 60);
                return `${m}:${s < 10 ? '0' : ''}${s}`;
            }

            // ========== LÓGICA DO VÍDEO ALTERNADO ==========
            function getSaudacaoVideoSrc() {
                const hour = new Date().getHours();
                if (hour >= 5 && hour < 12) return 'bomdia.mp4';
                if (hour >= 12 && hour < 18) return 'boatarde.mp4';
                return 'boanoite.mp4'; // das 18h às 5h
            }

            function alternarVideo() {
                if (!mainVideo || !mainVideoSource) return;
                if (showingSaudacao) {
                    // Volta para o vídeo normal
                    mainVideoSource.src = 'normal.mp4';
                } else {
                    // Troca para o vídeo de saudação do horário
                    mainVideoSource.src = getSaudacaoVideoSrc();
                }
                mainVideo.load();
                mainVideo.play().catch(e => console.warn('Erro ao trocar vídeo:', e));
                showingSaudacao = !showingSaudacao;
            }

            function iniciarAlternanciaVideo() {
                if (videoTimer) clearInterval(videoTimer);
                // Inicia mostrando o vídeo normal (já configurado no HTML)
                showingSaudacao = false;
                videoTimer = setInterval(alternarVideo, VIDEO_INTERVAL);
            }

            // ========== FUNÇÃO PARA ATUALIZAR INFO DA MÚSICA ==========
            function updateMusicInfo() {
                if (!playlist.length) return;
                const track = playlist[currentIndex];
                if (trackTitle) trackTitle.innerText = track.title || '?';
                if (trackArtist) trackArtist.innerText = track.artist || '?';
                if (trackInfoExtra) trackInfoExtra.innerHTML = track.info ? `📌 ${track.info}` : '';
            }

            // ========== CARREGAR MÚSICA ==========
            function loadTrack(index) {
                if (!playlist.length) return;
                if (index >= playlist.length) index = 0;
                if (index < 0) index = playlist.length - 1;
                currentIndex = index;
                const track = playlist[currentIndex];
                if (musicPlayer) {
                    musicPlayer.src = track.src;
                    musicPlayer.load();
                }
                if (totalTimeEl) totalTimeEl.textContent = track.duration || '0:00';
                if (progressFill) progressFill.style.width = '0%';
                if (currentTimeEl) currentTimeEl.textContent = '0:00';
                updateMusicInfo();
                renderPlaylist();
            }

            // ========== PLAY/PAUSE ==========
            function playMusic() {
                if (isAdPlaying) {
                    shouldResumeMusic = true;
                    return;
                }
                if (!musicPlayer) return;
                musicPlayer.play()
                    .then(() => {
                        isPlaying = true;
                        if (playBtn) playBtn.innerHTML = '<i class="fas fa-pause"></i>';
                        if (tapToStart) tapToStart.classList.add('hidden');
                        hideSplash();
                    })
                    .catch(() => {
                        if (tapToStart) tapToStart.classList.remove('hidden');
                    });
            }

            function pauseMusic() {
                if (musicPlayer) musicPlayer.pause();
                isPlaying = false;
                if (playBtn) playBtn.innerHTML = '<i class="fas fa-play"></i>';
            }

            function togglePlayPause() {
                if (isAdPlaying) {
                    if (adPlayer.paused) adPlayer.play(); else adPlayer.pause();
                } else {
                    if (isPlaying) pauseMusic(); else playMusic();
                }
            }

            // ========== PRÓXIMA/ANTERIOR ==========
            function changeTrack(direction) {
                if (isAdPlaying) {
                    showNotification('⏸️ Aguarde o anúncio');
                    return;
                }
                if (shuffle && playlist.length > 1) {
                    let newIndex;
                    do { newIndex = Math.floor(Math.random() * playlist.length); } while (newIndex === currentIndex);
                    currentIndex = newIndex;
                } else {
                    if (direction === 'next') currentIndex = (currentIndex + 1) % playlist.length;
                    else currentIndex = (currentIndex - 1 + playlist.length) % playlist.length;
                }
                loadTrack(currentIndex);
                if (isPlaying) playMusic();
                musicPlayedCount++;
                checkAdInterval();
            }

            function nextTrack() { changeTrack('next'); }
            function prevTrack() { changeTrack('prev'); }

            // ========== ANÚNCIOS ==========
            function updateAdTimer() {
                if (!adTimerEl) return;
                if (!adsEnabled) { adTimerEl.textContent = 'OFF'; return; }
                const songsUntilAd = CONFIG.adsInterval - (musicPlayedCount % CONFIG.adsInterval);
                adTimerEl.textContent = songsUntilAd === CONFIG.adsInterval ? 0 : songsUntilAd;
            }

            function playAd() {
                if (!adsEnabled || isAdPlaying || !adPlayer) return;
                const ad = CONFIG.adsList[currentAdIndex];
                if (!ad) return;

                if (isPlaying) {
                    musicPausedTime = musicPlayer.currentTime;
                    pauseMusic();
                    shouldResumeMusic = true;
                }

                adPlayer.src = ad.src;
                adPlayer.load();
                isAdPlaying = true;
                if (adStatus) adStatus.innerHTML = `<i class="fas fa-volume-up"></i> Tocando: ${ad.title}`;
                if (skipAdBtn) skipAdBtn.style.display = 'inline-block';
                showNotification(`📢 ${ad.title}`);

                adPlayer.play().catch(finishAd);
                adPlayer.onended = finishAd;
                adPlayer.onerror = finishAd;
            }

            function finishAd() {
                isAdPlaying = false;
                if (adStatus) adStatus.innerHTML = '<i class="fas fa-compact-disc fa-spin"></i> Aguardando...';
                if (skipAdBtn) skipAdBtn.style.display = 'none';
                if (shouldResumeMusic && playlist.length) {
                    musicPlayer.currentTime = musicPausedTime;
                    playMusic();
                    shouldResumeMusic = false;
                }
                currentAdIndex = (currentAdIndex + 1) % CONFIG.adsList.length;
            }

            function checkAdInterval() {
                if (!adsEnabled) return;
                if (musicPlayedCount > 0 && musicPlayedCount % CONFIG.adsInterval === 0 && !isAdPlaying) {
                    playAd();
                }
                updateAdTimer();
            }

            function toggleAds() {
                adsEnabled = !adsEnabled;
                if (toggleAdsBtn) toggleAdsBtn.innerHTML = adsEnabled ? '<i class="fas fa-toggle-on"></i> Ativo' : '<i class="fas fa-toggle-off"></i> Inativo';
                if (!adsEnabled && isAdPlaying) {
                    adPlayer.pause();
                    finishAd();
                }
                updateAdTimer();
            }

            function testAd() { playAd(); }
            function skipAd() { if (isAdPlaying) { adPlayer.pause(); finishAd(); showNotification('⏭️ Pulado'); } }

            // ========== PLAYLIST ==========
            function renderPlaylist() {
                if (!playlistContainer) return;
                let html = '';
                playlist.forEach((musica, index) => {
                    const numero = index + 1 < 10 ? `0${index+1}` : `${index+1}`;
                    const isPlaying = (index === currentIndex && !isAdPlaying);
                    html += `<div class="playlist-item ${isPlaying ? 'playing' : ''}" onclick="window.selectSong(${index})">
                        <div class="music-number">${numero}</div>
                        <div class="playlist-info">
                            <div class="playlist-title">${musica.title}</div>
                            <div class="playlist-artist">${musica.artist}</div>
                        </div>
                        <div class="playlist-duration">${musica.duration}</div>
                    </div>`;
                });
                playlistContainer.innerHTML = html;
            }

            window.selectSong = function(index) {
                if (isAdPlaying) { showNotification('Aguarde o anúncio'); return; }
                currentIndex = index;
                loadTrack(currentIndex);
                if (isPlaying) playMusic();
                closeDrawerFunc();
            };

            // ========== DRAWER ==========
            function openDrawer() { drawer.classList.add('open'); drawerOverlay.classList.add('active'); renderPlaylist(); }
            function closeDrawerFunc() { drawer.classList.remove('open'); drawerOverlay.classList.remove('active'); }

            // ========== MODO CARRO ==========
            function toggleCarMode() {
                body.classList.toggle('car-mode');
                showNotification(body.classList.contains('car-mode') ? '🚗 Modo carro' : '🚗 Modo normal');
            }

            // ========== VÍDEO EXTRA ==========
            let videoIndex = 0;
            function iniciarVideoExtra() {
                if (!extraVideo) return;
                const primeiro = videosExtra[0];
                extraVideo.src = primeiro.src;
                extraVideo.load();
                extraVideo.play().catch(() => {});
                if (extraOverlay) extraOverlay.innerHTML = `<i class="fas fa-ad"></i> ${primeiro.nome}`;
                setInterval(() => {
                    videoIndex = (videoIndex + 1) % videosExtra.length;
                    const novo = videosExtra[videoIndex];
                    extraVideo.src = novo.src;
                    extraVideo.load();
                    extraVideo.play().catch(() => {});
                    if (extraOverlay) extraOverlay.innerHTML = `<i class="fas fa-ad"></i> ${novo.nome}`;
                }, 60000);
            }

            if (extraContainer) {
                extraContainer.addEventListener('click', () => {
                    const atual = videosExtra[videoIndex];
                    window.open(atual.link, '_blank');
                    showNotification(`🔗 ${atual.nome}`);
                });
            }

            // ========== FEEDBACK ==========
            function toggleFeedbackModal() { feedbackModal.classList.toggle('open'); }
            function resetFeedback() {
                feedbackText.value = '';
                stars.forEach(s => s.classList.remove('active', 'fas'));
                stars.forEach(s => s.classList.add('far'));
                currentRating = 0;
            }

            stars.forEach(star => {
                star.addEventListener('mouseenter', () => {
                    const r = parseInt(star.dataset.rating);
                    stars.forEach((s, i) => s.classList.toggle('fas', i < r));
                });
                star.addEventListener('mouseleave', () => {
                    stars.forEach((s, i) => s.classList.toggle('fas', i < currentRating));
                });
                star.addEventListener('click', () => {
                    currentRating = parseInt(star.dataset.rating);
                    stars.forEach((s, i) => s.classList.toggle('fas', i < currentRating));
                });
            });

            sendFeedback.addEventListener('click', () => {
                if (currentRating === 0) { showNotification('⭐ Dê uma nota'); return; }
                const texto = `🎵 *Feedback*\n⭐ ${'★'.repeat(currentRating)}${'☆'.repeat(5-currentRating)}\n💬 ${feedbackText.value || 'Sem mensagem'}`;
                window.open(`https://wa.me/${SEU_NUMERO_WHATSAPP}?text=${encodeURIComponent(texto)}`, '_blank');
                resetFeedback(); toggleFeedbackModal();
            });

            cancelFeedback.addEventListener('click', () => { resetFeedback(); toggleFeedbackModal(); });
            feedbackBtn.addEventListener('click', toggleFeedbackModal);

            // ========== EVENTOS ==========
            musicPlayer.addEventListener('timeupdate', () => {
                if (musicPlayer.duration && !isAdPlaying) {
                    const percent = (musicPlayer.currentTime / musicPlayer.duration) * 100;
                    if (progressFill) progressFill.style.width = percent + '%';
                    if (currentTimeEl) currentTimeEl.textContent = formatTime(musicPlayer.currentTime);
                }
            });

            musicPlayer.addEventListener('ended', () => { if (!isAdPlaying) nextTrack(); });
            musicPlayer.addEventListener('error', () => { showNotification('⚠️ Erro na música'); setTimeout(nextTrack, 1000); });

            document.getElementById('progressBar')?.addEventListener('click', (e) => {
                if (isAdPlaying || !musicPlayer.duration) return;
                const rect = e.currentTarget.getBoundingClientRect();
                const x = e.clientX - rect.left;
                if (x >= 0 && x <= rect.width) {
                    musicPlayer.currentTime = (x / rect.width) * musicPlayer.duration;
                }
            });

            volumeSlider.addEventListener('input', (e) => {
                const vol = e.target.value / 100;
                musicPlayer.volume = vol; adPlayer.volume = vol;
                volumePercent.textContent = e.target.value + '%';
                volumeIcon.innerHTML = vol == 0 ? '<i class="fas fa-volume-mute"></i>' : '<i class="fas fa-volume-up"></i>';
            });

            volumeIcon.addEventListener('click', () => {
                if (musicPlayer.volume > 0) {
                    musicPlayer.volume = adPlayer.volume = 0;
                    volumeSlider.value = 0;
                    volumePercent.textContent = '0%';
                    volumeIcon.innerHTML = '<i class="fas fa-volume-mute"></i>';
                } else {
                    musicPlayer.volume = adPlayer.volume = 0.8;
                    volumeSlider.value = 80;
                    volumePercent.textContent = '80%';
                    volumeIcon.innerHTML = '<i class="fas fa-volume-up"></i>';
                }
            });

            shuffleBtn.addEventListener('click', () => {
                shuffle = !shuffle;
                shuffleBtn.classList.toggle('active', shuffle);
                showNotification(shuffle ? '🔀 Aleatório ON' : '➡️ Sequencial');
            });

            document.getElementById('videoMenuBtn')?.addEventListener('click', openDrawer);
            closeDrawer.addEventListener('click', closeDrawerFunc);
            drawerOverlay.addEventListener('click', closeDrawerFunc);

            document.getElementById('fullscreenDrawerBtn')?.addEventListener('click', () => {
                if (!document.fullscreenElement) document.documentElement.requestFullscreen(); else document.exitFullscreen();
            });

            document.getElementById('carModeDrawerBtn')?.addEventListener('click', toggleCarMode);
            document.getElementById('shareDrawerBtn')?.addEventListener('click', () => {
                if (navigator.share) navigator.share({ title: 'Rádio Playlist', url: location.href }).catch(() => {});
                else { navigator.clipboard?.writeText(location.href); showNotification('📋 Link copiado!'); }
            });

            toggleAdsBtn.addEventListener('click', toggleAds);
            testAdBtn.addEventListener('click', testAd);
            skipAdBtn.addEventListener('click', skipAd);

            prevBtn.addEventListener('click', prevTrack);
            nextBtn.addEventListener('click', nextTrack);
            playBtn.addEventListener('click', togglePlayPause);

            exitCarModeBtn.addEventListener('click', toggleCarMode);

            topTicker?.addEventListener('click', () => {
                const novo = prompt('Editar letreiro:', topTickerText.innerText.replace(/<[^>]*>/g, ''));
                if (novo?.trim()) { topTickerText.innerHTML = novo; showNotification('✅ Letreiro atualizado'); }
            });

            // ========== INICIALIZAÇÃO ==========
            window.addEventListener('load', () => {
                // Volume
                if (musicPlayer) musicPlayer.volume = CONFIG.defaultVolume / 100;
                if (adPlayer) adPlayer.volume = CONFIG.defaultVolume / 100;
                if (volumeSlider) volumeSlider.value = CONFIG.defaultVolume;
                if (volumePercent) volumePercent.textContent = CONFIG.defaultVolume + '%';

                // Carrega primeira música
                if (playlist.length) loadTrack(currentIndex);
                else showNotification('Playlist vazia');

                renderPlaylist();

                // Inicia vídeo alternado
                iniciarAlternanciaVideo();

                // Inicia vídeo extra
                iniciarVideoExtra();

                // Tenta autoplay
                setTimeout(() => {
                    if (!isPlaying && musicPlayer) {
                        musicPlayer.play().catch(() => {
                            if (tapToStart) tapToStart.classList.remove('hidden');
                        });
                    }
                }, 1000);

                setTimeout(hideSplash, 3000);
                updateAdTimer();
            });
        })();
    </script>
</body>
</html>
